<DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>Wild Cones Hockey Tournament</title>
	<style>
	
		html,
		body {
			margin: 0;
			background: #222;
			padding: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			-webkit-text-size-adjust: 100%;
			text-size-adjust: 100%;
		}

		/* Overlay for title, score, timer, and messages */
		#overlay {
		  position: absolute;
		  top: 0; left: 0;
		  width: 100%;
		  pointer-events: none;
		  color: white;
		  font-family: Arial, sans-serif;
		  text-align: center;
		  z-index: 10;
		}

		#hud-container {
			position: fixed;
			box-sizing: border-box;
			top: 2vw;
			left: 2vw;
			width: 25vw;
			background-color: rgba(0, 0, 0, 0.2);
			color: white;
			padding: 0.6vw 1vw;
			border-radius: 0.6vw;
			font-family: sans-serif;
			font-size: 0.9vw;
			line-height: 1.2;
			z-index: 1000;
			pointer-events: none;
			text-shadow: 0 0 0.2vw black, 0 0 0.4vw black;
			overflow-wrap: anywhere;
		}

		#hud-container h2 {
			font-size: 1.2vw;
			margin: 0.5vw 0;
		}

		#hud-container p {
			font-size: inherit;
			margin: 0.25vw 0;
		}

		.touch-device #hud-container {
			width: 30.0vw;
			padding: 0.4vw 0.8vw;
			border-radius: 0.8vw;
			font-size: 1.3vw;
		}

		.touch-device #hud-container h2 {
			font-size: 1.8vw;
			margin: 0.67vw 0;
		}

		.touch-device #hud-container p {
			font-size: 1.7vw;
			margin: 0.35vw 0;
		}

		#controls-container {
		  position: fixed;
		  top: 30%;
		  left: 50%;
		  transform: translate(-50%, -30%);
		  background-color: rgba(0, 0, 0, 0.4);
		  color: white;
		  padding: 1vh 1.5vw;
		  border-radius: 1vh;
		  font-family: sans-serif;
		  font-size: 2.0vh; /* scales with window height */
		  line-height: 1.2;
		  z-index: 1000;
		  pointer-events: none;
		  text-shadow: 0 0 5px black, 0 0 10px black;
		}

		#controls-container h2 {
		  font-size: 2.5vh;
		  margin: 1vh 0;
		}

		#controls-container p {
		  font-size: 2vh;
		  margin: 0.5vh 0;
		}

		.touch-device #controls-container {
			top: 50%;
			left: 50%;
			right: auto;
			bottom: auto;
			transform: translate(-55%, -50%);

			width: max-content;
			max-width: 90vw;
			height: auto;
			max-height: 92vh;

			box-sizing: border-box;
			padding: 1vh 1.5vw;
			margin: 0;

			display: block;
			overflow-y: auto;
			pointer-events: auto;
		}


		#gameinfo-container {
		  position: fixed;
		  top: 30%;
		  left: 50%;
		  transform: translate(-50%, -30%);
		  background-color: rgba(0, 0, 0, 0.4);
		  color: white;
		  padding: 1vh 1.5vw;
		  border-radius: 1vh;
		  font-family: sans-serif;
		  font-size: 2.0vh; /* scales with window height */
		  line-height: 1.2;
		  z-index: 1000;
		  pointer-events: none;
		  text-shadow: 0 0 5px black, 0 0 10px black;
		}

		#gameinfo-container h2 {
		  font-size: 2.5vh;
		  margin: 1vh 0;
		}

		#gameinfo-container p {
		  font-size: 2vh;
		  margin: 0.5vh 0;
		}

		.touch-device #gameinfo-container {
			top: 50%;
			left: 50%;
			right: auto;
			bottom: auto;
			transform: translate(-55%, -50%);

			width: max-content;
			max-width: 90vw;
			height: auto;
			max-height: 92vh;

			box-sizing: border-box;
			padding: 1vh 1.5vw;
			margin: 0;

			display: block;
			overflow-y: auto;
			pointer-events: auto;
		}

		.touch-device #gameinfo-container h2 {
		  font-size: 5.0vh;
		  margin: 1vh 0;
		}

		.touch-device #gameinfo-container p {
		  font-size: 4.0vh;
		  margin: 0.5vh 0;
		}

		.touch-zone {
		  position: fixed;
		  top: 0;
		  bottom: 0;
		  z-index: 1;
		  touch-action: none;
		}
		.move-zone {
		  left: 0;
		  width: 50vw;
		}
		.rotate-zone {
		  right: 0;
		  width: 50vw;
		}
		
		.touch-button {
			position: fixed;
			width: 12.5vmin;
			height: 12.5vmin;
			background: rgba(10, 10, 10, 0.20);
			border-radius: 50%;
			z-index: 1010;
			touch-action: none;
		}

		.touch-button-label {
			color: white;
			font-family: sans-serif;
			font-weight: normal;
			font-size: 3.2vmin;
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			pointer-events: none;
		}

		#touchStartVrButton {
			width: 60px;
			height: 60px;
			right: 40px;
			bottom: 100px;
			background: rgba(255, 80, 80, 0.5);
			z-index: 1100;
		}

		#touchStartVrButton .touch-button-label {
			font-size: 12px;
			text-align: center;
			text-shadow: -1px -1px 1px black, 1px -1px 1px black, -1px 1px 1px black, 1px 1px 1px black;
		}
				

		/* Join and Host frames */

		.online-dialog-backdrop {
			position: fixed;
			inset: 0;
			z-index: 5000;

			background: rgba(0, 0, 0, 0.72);
			font-family: sans-serif;
		}

		.online-dialog-backdrop[hidden] {
			display: none;
		}

		.online-dialog {
			position: fixed;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);

			box-sizing: border-box;
			width: 30vw;
			max-height: 90vh;
			overflow-y: auto;

			padding: 2vh 1.5vw;

			color: white;
			background: rgba(24, 24, 30, 0.96);

			border: 0.1vh solid rgba(255, 255, 255, 0.25);
			border-radius: 1vh;

			box-shadow:
				0 1vh 4vh rgba(0, 0, 0, 0.75),
				0 0 2vh rgba(255, 204, 51, 0.08);

			font-family: sans-serif;
			font-size: 1.6vh;
			line-height: 1.2;
		}

		.online-join-dialog {
			width: 40vw;
		}

		.online-dialog h2 {
			margin: 0 0 2vh 0;

			color: #FF4D00;
			font-size: 2.8vh;
			font-weight: normal;
			text-align: center;
		}

		.online-dialog label {
			display: block;
			margin: 1.2vh 0 0.5vh 0;

			color: #eeeeee;
			font-size: 1.6vh;
		}

		.online-dialog input[type="text"] {
			box-sizing: border-box;
			width: 100%;

			padding: 1vh 0.8vw;

			color: white;
			background: #151515;

			border: 0.1vh solid #666666;
			border-radius: 0.6vh;

			font-family: sans-serif;
			font-size: 1.7vh;
			outline: none;
		}

		.online-dialog input[type="text"]:focus {
			border-color: #FF4D00;
			box-shadow: 0 0 0 0.2vh rgba(255, 204, 51, 0.15);
		}

		.online-checkbox-row {
			display: flex !important;
			align-items: center;

			gap: 0.6vw;
			margin-top: 1.5vh !important;

			font-size: 1.6vh;
			cursor: pointer;
		}

		.online-checkbox-row input[type="checkbox"] {
			width: 1.8vh;
			height: 1.8vh;
		}

		.online-dialog-buttons {
			display: flex;
			justify-content: flex-end;

			gap: 0.8vw;
			margin-top: 2vh;
		}

		.online-dialog button {
			padding: 1vh 1vw;

			color: #111111;
			background: #FF4D00;

			border: 0;
			border-radius: 0.6vh;

			font-family: sans-serif;
			font-size: 1.5vh;
			font-weight: bold;
			cursor: pointer;
		}

		.online-dialog button:hover {
			filter: brightness(1.1);
		}

		.online-dialog button:disabled {
			cursor: default;
			filter: none;
			opacity: 0.5;
		}

		.online-dialog .online-secondary-button {
			color: white;
			background: #555555;
		}

		.online-dialog .online-small-button {
			padding: 0.7vh 0.7vw;
			font-size: 1.3vh;
		}

		.online-dialog-message {
			min-height: 2vh;
			margin-top: 1.2vh;

			color: #ff8b8b;
			font-size: 1.4vh;
		}

		.online-dialog-message.online-success {
			color: #7cff9b;
		}

		.online-room-list-header {
			display: flex;
			align-items: center;
			justify-content: space-between;

			margin-top: 2vh;
			margin-bottom: 0.6vh;

			color: #eeeeee;
			font-size: 1.5vh;
		}

		.online-room-list {
			max-height: 28vh;
			overflow-y: auto;

			background: #121212;

			border: 0.1vh solid #555555;
			border-radius: 0.6vh;
		}

		.online-room-row {
			display: grid;
			grid-template-columns: 1fr auto auto;
			gap: 0.8vw;
			align-items: center;

			padding: 1vh 0.8vw;

			border-bottom: 0.1vh solid #333333;
			cursor: pointer;
		}

		.online-room-row:last-child {
			border-bottom: 0;
		}

		.online-room-row:hover {
			background: rgba(255, 204, 51, 0.14);
		}

		.online-room-name {
			color: #ffdd66;
			font-size: 1.5vh;
			font-weight: bold;
			overflow-wrap: anywhere;
		}

		.online-room-host,
		.online-room-count {
			color: #cccccc;
			font-size: 1.3vh;
		}

		.online-room-count {
			white-space: nowrap;
		}

		.online-room-list-info {
			padding: 1.5vh 1vw;

			color: #aaaaaa;
			font-size: 1.4vh;
			text-align: center;
		}

		/* Online connection */

		.online-connection-frame {
			position: fixed;
			top: 2vh;
			right: 2vw;
			left: auto;
			bottom: auto;
			z-index: 4500;

			box-sizing: border-box;
			max-width: 35vw;

			padding: 1vh 1.5vw;

			color: white;
			background-color: rgba(0, 0, 0, 0.2);

			border: none;
			border-radius: 1vh;
			box-shadow: none;

			font-family: sans-serif;
			font-size: 1.5vh;
			line-height: 1.2;

			pointer-events: none;
			text-shadow: 0 0 5px black, 0 0 10px black;
		}

		.online-connection-frame[hidden] {
			display: none;
		}

		.online-connection-frame strong {
			color: #FF4D00;
			font-size: 1.7vh;
			font-weight: normal;
		}

		/* Online Chat */

		.online-chat-frame {
			position: fixed;
			top: 14vh;
			left: 2vw;
			z-index: 4600;

			box-sizing: border-box;
			width: 28vw;
			max-height: 34vh;

			padding: 1vh 1vw;

			color: white;
			background-color: rgba(0, 0, 0, 0.2);

			border-radius: 1vh;

			font-family: sans-serif;
			font-size: 1.5vh;
			line-height: 1.2;

			text-shadow: 0 0 5px black, 0 0 10px black;
		}

		.online-chat-frame[hidden] {
			display: none;
		}

		.online-chat-frame input {
			box-sizing: border-box;
			width: 100%;

			padding: 0.8vh 0.7vw;
			margin-bottom: 0.8vh;

			color: white;
			background-color: rgba(0, 0, 0, 0.55);

			border: 0.1vh solid rgba(255, 255, 255, 0.35);
			border-radius: 0.5vh;

			font-family: sans-serif;
			font-size: 1.5vh;
			text-shadow: none;
			outline: none;
		}

		.online-chat-frame input:focus {
			border-color: #FF4D00;
		}

		.online-chat-messages {
			display: flex;
			flex-direction: column;
			gap: 0.35vh;

			max-height: 25vh;
			overflow-y: auto;

			overflow-wrap: anywhere;
		}

		.online-chat-message {
			color: white;
		}

		.online-chat-player-name {
			font-weight: bold;
		}
		
		.online-chat-time {
			color: white;
			font-weight: normal;
		}

		@media (max-width: 800px) {
			.online-chat-frame {
				width: 50vw;
			}
		}
		
		.online-quick-chat {
			box-sizing: border-box;
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 0.6em;
			width: 100%;
		}

		.online-quick-chat[hidden] {
			display: none;
		}

		.online-quick-chat-button {
			box-sizing: border-box;
			min-width: 0;
			min-height: 3em;
			padding: 0.6em 0.8em;

			color: white;
			background: rgba(20, 20, 20, 0.45);
			border: 1px solid rgba(255, 255, 255, 0.35);
			border-radius: 0.5em;

			font: inherit;
			text-align: center;
			text-shadow: 0 0 4px black;

			touch-action: manipulation;
			-webkit-user-select: none;
			user-select: none;
		}

		.online-quick-chat-button:active {
			background: rgba(255, 255, 255, 0.25);
		}

		.touch-device .online-quick-chat-button {
			min-height: 11vmin;
			font-size: clamp(14px, 3vmin, 19px);
		}
		

		#inviteFullscreenButton {
			position: fixed;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			z-index: 6000;
			padding: 2vh 4vw;
			color: white;
			background: rgba(200, 40, 40, 0.9);
			border: 0;
			border-radius: 1vh;
			font-family: sans-serif;
			font-size: 3vh;
			font-weight: bold;
			cursor: pointer;
		}

		#versionInfoContainer {
			position: fixed;
			right: 1.5vw;
			bottom: 1.5vh;
			z-index: 5001;
			margin: 0;
			padding: 0.5em 0.8em;
			color: white;
			background: rgba(0, 0, 0, 0.2);
			border-radius: 0.4em;
			font-size: 1.4vmin;
			line-height: 0.5;
			text-align: right;
			pointer-events: none;
		}
		
		.touch-device #versionInfoContainer {
			top: 5px;
			left: 5px;
			right: auto;
			bottom: auto;
			transform: none;
			margin: 0;
			text-align: left;
			font-size: 2.2vmin;
		}
		
		#controls-container,
		#hud-container,
		.touch-button,
		.touch-button-label,
		#touchMoveZone,
		#touchRotateZone {
			-webkit-user-select: none;
			user-select: none;
			-webkit-touch-callout: none;
		}
		
		.touch-device .online-dialog {
			zoom: 2.0;
			max-width: 64vw;
			max-height: 65vh;
			overflow-y: auto;
		}

		.touch-device #onlineChatForm {
			box-sizing: border-box;
			width: 100%;
			margin: 0;
		}

		.touch-device #onlineChatFrame {
			box-sizing: border-box;
			left: 50%;
			right: auto;
			width: 50vw;
			max-width: 50vw;
			height: auto;
			min-height: 0;
			max-height: 80dvh;
			transform: translateX(-50%);
			padding: 10px;
			font-size: 12px;
			overflow-y: auto;
		}

		.touch-device #onlineChatInput {
			box-sizing: border-box;
			display: block;
			width: 100%;
			max-width: 100%;
			min-width: 0;
			padding: 9px 11px;
			font-size: 12px;
			line-height: 1.25;
		}

		.touch-device #onlineChatMessages {
			box-sizing: border-box;
			width: 100%;
			max-width: 100%;
			height: auto;
			min-height: 0;
			max-height: 55dvh;
			margin-top: 8px;
			padding-bottom: 4px;
			font-size: 14px;
			line-height: 1.3;
			overflow-y: auto;
			overflow-wrap: anywhere;
		}

		#restoreFullscreenButton {
			position: fixed;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			z-index: 6000;
			padding: 2vh 4vw;
			color: white;
			background: rgba(200, 40, 40, 0.9);
			border: 0;
			border-radius: 1vh;
			font-family: sans-serif;
			font-size: 3vh;
			font-weight: bold;
			cursor: pointer;
		}

		#onlineConnectingOverlay {
			position: fixed;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			z-index: 7000;
			padding: 20px 30px;
			color: white;
			background: rgba(0, 0, 0, 0.8);
			border-radius: 12px;
			font-family: sans-serif;
			font-size: 20px;
			text-align: center;
			pointer-events: none;
		}

		.online-connecting-spinner {
			width: 32px;
			height: 32px;
			margin: 0 auto 12px auto;
			border: 4px solid rgba(255, 255, 255, 0.3);
			border-top-color: white;
			border-radius: 50%;
			animation: onlineConnectingSpin 0.8s linear infinite;
		}

		@keyframes onlineConnectingSpin {
			to {
				transform: rotate(360deg);
			}
		}

	</style>

	<!-- Load three.js -->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
	
</head>
<body>
	<div id="touchMoveZone" class="touch-zone move-zone" style="display: none;"></div>
	<div id="touchRotateZone" class="touch-zone rotate-zone" style="display: none;"></div>

	<div id="touchStrategyButton" class="touch-button" style="display: none; bottom: 6.25vmin; left: 6.25vmin;">
		<span class="touch-button-label">Strategy</span>
	</div>

	<div id="touchPauseButton" class="touch-button" style="display: none; bottom: 6.25vmin; right: 6.25vmin;">
		<span class="touch-button-label">Pause</span>
	</div>

	<div id="touchStartButton" class="touch-button" style="display: none; bottom: 6.25vmin; right: 25vmin;">
		<span class="touch-button-label">Start</span>
	</div>

	<div id="touchGraphicsButton" class="touch-button" style="display: none; top: 3.125vmin; right: 6.25vmin;">
		<span class="touch-button-label">Graph</span>
	</div>

	<div id="touchCameraButton" class="touch-button" style="display: none; top: 18.75vmin; right: 6.25vmin;">
		<span class="touch-button-label">Cam</span>
	</div>

	<div id="touchChatButton" class="touch-button" style="display: none; top: 25vmin; left: 6.25vmin;">
		<span class="touch-button-label">Chat</span>
	</div>

	<div id="touchStartVrButton" class="touch-button" style="display: none;">
		<span class="touch-button-label">Start VR</span>
	</div>

	<div id="overlay"></div>
	<button id="restoreFullscreenButton" type="button" hidden>Restore Fullscreen</button>

	<!-- =============================================================== -->
	<!-- Wild Cones online lobby dialogs                                 -->
	<!-- =============================================================== -->

	<div id="onlineHostDialog" class="online-dialog-backdrop" hidden>
		<div class="online-dialog">
			<h2>Host online game</h2>

			<label for="onlineHostPlayerName">
				Player name
			</label>

			<input
				id="onlineHostPlayerName"
				type="text"
				maxlength="20"
				autocomplete="nickname"
				placeholder="Player name">

			<label for="onlineHostRoomName">
				Room name
			</label>

			<input
				id="onlineHostRoomName"
				type="text"
				maxlength="32"
				autocomplete="off"
				placeholder="Room name or token">

			<label class="online-checkbox-row">
				<input
					id="onlineHostPublic"
					type="checkbox"
					checked>

				Public room
			</label>

			<div
				id="onlineHostDialogMessage"
				class="online-dialog-message">
			</div>

			<div class="online-dialog-buttons">
				<button
					id="onlineHostGameButton"
					type="button">
					Host Game
				</button>

				<button
					id="onlineHostCancelButton"
					type="button"
					class="online-secondary-button">
					Cancel
				</button>
			</div>
		</div>
	</div>


	<div id="onlineJoinDialog" class="online-dialog-backdrop" hidden>
		<div class="online-dialog online-join-dialog">
			<h2>Join online game</h2>

			<label for="onlineJoinPlayerName">
				Player name
			</label>

			<input
				id="onlineJoinPlayerName"
				type="text"
				maxlength="20"
				autocomplete="nickname"
				placeholder="Player name">

			<label for="onlineJoinRoomName">
				Room name or private token
			</label>

			<input
				id="onlineJoinRoomName"
				type="text"
				maxlength="32"
				autocomplete="off"
				placeholder="Room name">

			<div class="online-room-list-header">
				<span>Public rooms</span>
