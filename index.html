		this.vy = 0;
		this.rotSpeed = 0;
        this.maxSpeed = PLAYER_MAX_SPEED;
		this.maxRotSpeed = MAX_SHOOT_ROT_SPEED;
		this.maxAcc = PLAYER_ACC;
        this.stickGap = 5;
        this.stickSide = this.radius + this.stickGap;
        this.stickOffset = { x: 0, y: this.stickSide };
		this.stickLifted = false;
		this.spirit = "normal"; // normal, eager, sad
		this.stamina = STAMINA_MAX;
		this.staminaRefreshTime = 0;
		this.stickPuckContact = false;
		this.spinAccumulator = 0.0;

		// not propagated by host in player message
		this.isMainUser = false;
		this.tx = x;
		this.ty = y;
        this.brain = new NeuralBrain(); // Will be assigned a NeuralBrain instance
        this.useBrain = useBrain; // Toggle to switch between SimpleAI and Brain
        // Analog controls: movex, movey, rotate (-1 to 1) and autorotate flag.
        this.controlInput = { movex: 0, movey: 0, rotate: 0, autorotate: 0, strategy: 0, lift: 0, boost: 0, rotX: 0, rotY:0 };
		this.controlKeys = undefined;
		this.gamepad = undefined;
		this.gpIndex = undefined;
		this.gpMap = gpMap;
        // Shooting state variables.
        this.isShooting = false;
        this.shootingTime = 0; // frames remaining in shooting mode
        this.shootTargetRotation = 0; // total rotation to apply during shooting
        this.shotCooldown = 0; // Shot cooldown (frames)
		this.head = new Head;
		this.winkTime = 0;
		this.scanTime = 0;
		this.squintTime = 0;
		this.meshGroup;
		this.varianceTime = 0;
		this.deviationShootDistance = 0;
		this.deviationX = 0;
		this.deviationY = 0;
		this.targetUpdateDelay = 0;
		this.targetUpdateTime = 0;
		this.isTargetUpdating = true;
		this.body = new ConeBody;
		this.body.setPose(playerStickDownPose);
		this.isTouchControl = false;
		this.isVrControl = false;
		this.shootSoundTime = 0;
		this.puckSoundTime = 0;
		this.boardSoundTime = 0;
		this.bodySoundTime = 0;
		this.stickbodySoundTime = 0;
		//buffers
        this.aiInputBuffer = new Float32Array(62); // Pre-allocate memory for AI inputs
		this.prevNeuralOutput = new Float32Array(14); // Store the raw 5 outputs from the last frame
      }

	  // --- update player's input controls  ----
	  updateControls() {
			if (this.isUser) {
				if (this.gamepad !== undefined && this.gamepad !== null) {
					this.handleUserInput();
				} else if (this.isVrControl) {
					handleVrInput(this);
				} else {
					this.handleUserInput();
				}
			} else if (this.useBrain) {
				this.neuralAI();
			} else {
				this.simpleAI();
			}
	  }

      // --- Update player state ---
	  update() {
        if (this.shotCooldown > 0) this.shotCooldown--;

		this.spinAccumulator += Math.abs(this.rotSpeed);
		this.spinAccumulator *= 0.90;

        this.prevX = this.x;
        this.prevY = this.y;
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= friction;
        this.vy *= friction;
        limitSpeed(this, this.maxSpeed);

		this.rotSpeed = clamp(this.rotSpeed, -this.maxRotSpeed, this.maxRotSpeed);
		this.angle = normalizeAngle(this.angle + this.rotSpeed);
		this.prevAngle = this.angle - this.rotSpeed;
        handleBoundaryCollision(this, boundaries);

		// manage stamina
		if (this.staminaRefreshTime > 0) this.staminaRefreshTime -= 1;
		let playerSpeed = Math.hypot(this.vx, this.vy);
		if (playerSpeed > PLAYER_MAX_SPEED * 1.1 && this.stamina > 0 && this.controlInput.boost == 1 ) {
			this.stamina -= STAMINA_USE_RATE;
			if (this.stamina < 0) this.stamina = 0;
			this.staminaRefreshTime = STAMINA_REFRESH_TIME;
		}
		if (playerSpeed <= PLAYER_MAX_SPEED * 1.1 && this.stamina < STAMINA_MAX && this.staminaRefreshTime == 0) {
			this.stamina += STAMINA_REFRESH_RATE;
			if (this.stamina > STAMINA_MAX) this.stamina = STAMINA_MAX;
		}

		// head & eyes rotation to the puck
		if (!GState.goalScored) {
		  let actualAngleToPuck = Math.atan2(puckObj.y - this.y, puckObj.x - this.x) - Math.PI / 2;
		  let newHeadRotation = Math.min(Math.max(normalizeAngle(this.angle - actualAngleToPuck), -HEAD_ANGLE_MAX), HEAD_ANGLE_MAX) / HEAD_ANGLE_MAX;
		  this.head.eyes.headRotation = (Math.abs(newHeadRotation - this.head.eyes.headRotation) < HEAD_ROT_SPEED_MAX) ? newHeadRotation : this.head.eyes.headRotation + Math.sign(newHeadRotation - this.head.eyes.headRotation) * HEAD_ROT_SPEED_MAX;
		  let newEyesRotation = Math.min(Math.max(normalizeAngle(this.angle - (this.head.eyes.headRotation * HEAD_ANGLE_MAX) - actualAngleToPuck), -Math.PI / 4), Math.PI / 4) / EYES_ANGLE_MAX;
		  this.head.eyes.rotation = (Math.abs(newEyesRotation - this.head.eyes.rotation) < EYES_ROT_SPEED_MAX) ? newEyesRotation : this.head.eyes.rotation + Math.sign(newEyesRotation - this.head.eyes.rotation) * EYES_ROT_SPEED_MAX;
		}
		this.head.animateEyes();

		// initiate eyes gestures
		if (this.winkTime <= Date.now() ) {
		  this.head.eyeWink(Math.floor(Math.random() * 2) + 1 );
		  this.winkTime = Date.now() + Math.random() * MEAN_TIME_WINK;
		}
		if (this.scanTime <= Date.now() ) {
		  this.head.eyeScan(Math.floor(Math.random() * 2) + 2);
		  this.scanTime = Date.now() + Math.random() * MEAN_TIME_SCAN;
		}
		if (this.squintTime <= Date.now() ) {
		  this.head.eyeSquint(Math.floor(Math.random() * 120) + 60);
		  this.squintTime = Date.now() + Math.random() * MEAN_TIME_SQUINT;
		}

		this.body.animate();
		this.updateVariance();
		this.updateMesh();
      }


	  // The new "Neural" update function. Replaces simpleAI() when this.useBrain is true.
	  neuralAI() {
		if (!this.brain) return;

		// 1. Get Inputs (48 floats)
		getAINetworkInputs(this);

		// 2. Inference (Forward Pass)
		const outputs = this.brain.predict(this.aiInputBuffer);

		// 3. Apply Controls
		applyAINetworkOutput(this, outputs);
	  }



	  // Apply control inputs to player
	  applyControls() {
		const spinAccMax = 1.8;
		let rotFriction = 0.5 + 0.5 * (1 - Math.abs(this.spinAccumulator / spinAccMax));
		rotFriction = Math.max(0.5, rotFriction);

	    if (this.controlInput.boost == 1 && this.stamina > 0) {
			this.maxSpeed = STAMINA_MAX_SPEED;
			this.maxAcc = STAMINA_ACC;
		} else {
			if (this.maxSpeed > PLAYER_MAX_SPEED) {
				this.maxSpeed *= friction;
			} else {
				this.maxSpeed = PLAYER_MAX_SPEED;
				this.maxAcc = PLAYER_ACC;
			}
		}

		this.maxSpeed *= rotFriction;

        // CIRCULAR JOYSTICK NORMALIZATION
        let mx = this.controlInput.movex;
        let my = this.controlInput.movey;
        let moveMag = Math.hypot(mx, my);

        // If the AI (or Human) pushes the joystick into the corners (> 1.0 magnitude),
        // we scale it back down so the maximum vector length is exactly 1.0.
        if (moveMag > 1.0) {
            mx /= moveMag;
            my /= moveMag;
        }

        // Apply the normalized input to acceleration
		this.vx += mx * this.maxAcc;
		this.vy += my * this.maxAcc;

		let rotate = this.controlInput.rotate * PLAYER_ROT_ACC;
	    this.rotSpeed = (this.rotSpeed * 0.6) + (rotate * 0.4);

		if (this.controlInput.strategy == 1 && !NetworkManager.isGuest()) {
			this.team.rotateStrategy();
			this.controlInput.strategy = 0;
		}

		// Stick lift
		if (this.controlInput.lift == 1 && !this.stickLifted) {
			this.stickLifted = true;
		};

		if (this.controlInput.lift == 1 && this.body.rArmRotation.x > stickLiftX) {
			this.body.rArmRotation.x -= stickLiftDeltaX;
			if (this.body.rArmRotation.x < stickLiftX) this.body.rArmRotation.x = stickLiftX;
		}

		if (this.controlInput.lift == 0 && this.stickLifted) {
			this.stickLifted = false;
		};

		if (this.controlInput.lift == 0 && this.body.rArmRotation.x < stickDownX) {
			this.body.rArmRotation.x += stickLiftDeltaX;
			if (this.body.rArmRotation.x > stickDownX) this.body.rArmRotation.x = stickDownX;
		}
      }

	  // set gamepad
	  bindGamepad(gamepad) {
		if (gamepad != undefined) {
			this.gamepad = gamepad;
			this.gpIndex = gamepad.index;
			this.gpMap = getGpMap(gamepad);
			this.isUser = true;
			this.meshGroup.getObjectByName("ring").visible = true;
		}
	  }

	  unbindGamepad() {
		this.gamepad = undefined;
		this.gpIndex = undefined;
		if(!this.controlKeys && !this.isTouchControl && !this.isVrControl) {
			this.isUser = false;
			this.meshGroup.getObjectByName("ring").visible = false;
		}
	  }

	  // Update player mesh
	  updateMesh() {
        this.meshGroup.position.set(this.x, 0, this.y);
        this.meshGroup.rotation.y = -this.angle;
		this.meshGroup.getObjectByName("head").rotation.set(0, this.head.eyes.headRotation * HEAD_ANGLE_MAX, 0);
		this.meshGroup.getObjectByName("leftPupil").rotation.set(0, this.head.eyes.rotation * EYES_ANGLE_MAX, 0);
		this.meshGroup.getObjectByName("rightPupil").rotation.set(0, this.head.eyes.rotation * EYES_ANGLE_MAX, 0);
		this.meshGroup.getObjectByName("leftLidTop").rotation.set( (9/8 + this.head.eyes.lidLeftTop * (12/8 - 9/8)) * Math.PI, this.head.eyes.lidSideRotation * Math.PI / 8, 0);
		this.meshGroup.getObjectByName("leftLidBottom").rotation.set( (-10/8 + this.head.eyes.lidLeftBottom * (-12/8 + 10/8)) * Math.PI, -this.head.eyes.lidSideRotation * Math.PI / 8, 0);
		this.meshGroup.getObjectByName("rightLidTop").rotation.set( (9/8 + this.head.eyes.lidRightTop * (12/8 - 9/8)) * Math.PI, -this.head.eyes.lidSideRotation * Math.PI / 8, 0);
		this.meshGroup.getObjectByName("rightLidBottom").rotation.set( (-10/8 + this.head.eyes.lidRightBottom * (-12/8 + 10/8)) * Math.PI, this.head.eyes.lidSideRotation * Math.PI / 8, 0);
		this.meshGroup.getObjectByName("hockeyStickPivot").rotation.set(this.body.rArmRotation.x * Math.PI, this.body.rArmRotation.y * Math.PI, this.body.rArmRotation.z * Math.PI);
		this.meshGroup.getObjectByName("hockeyStickPivot").getObjectByName("stickBlade").castShadow = (this.body.rArmRotation.x < -5/6) ? false : true;
		this.meshGroup.getObjectByName("ring").material.uniforms.stamina.value = this.stamina / STAMINA_MAX;
	  }

	  // update variance in player skills
	  updateVariance() {
		const DEVIATION_UPDATE_TIME = 2 * 1000; //in ms
		const DEVIATION_TARGET_RANGE = 0;
		const DEVIATION_SHOOT_RANGE = puckRadius * 8;
		const UPDATE_DELAY_MAX = 4000; // maximum time player looses the puck from sight (in ms)
		const UPDATE_TIME_MAX = 2000; // maximum time range player does not loose puck from sight (in ms)
		const UPDATE_TIME_MIN = 1000; // minimum time player does not loose puck from sight  (in ms)

		let now = Date.now();
		if(this.varianceTime < now) {
			this.varianceTime = Date.now() + Math.random() * DEVIATION_UPDATE_TIME + 500;
			let deviationTargetMax = (100 - this.skill) / 100 * DEVIATION_TARGET_RANGE;
			let deviationShootDistanceMax = (100 - this.skill) / 100 * DEVIATION_SHOOT_RANGE;
			this.deviationX = deviationTargetMax * Math.random() - deviationTargetMax / 2;
			this.deviationY = deviationTargetMax * Math.random() - deviationTargetMax / 2;
			this.deviationShootDistance = deviationShootDistanceMax * Math.random();
		}
		if(this.targetUpdateTime < now && this.targetUpdateDelay < now) {
			let targetUpdateDelayMax = (100 - this.skill) / 100 * UPDATE_DELAY_MAX;
			this.targetUpdateTime = Date.now() + Math.random() * (UPDATE_TIME_MAX - UPDATE_TIME_MIN) + UPDATE_TIME_MIN;
			this.targetUpdateDelay = this.targetUpdateTime + Math.random() * targetUpdateDelayMax;
		}
		this.isTargetUpdating = !(this.targetUpdateTime < now && this.targetUpdateDelay > now);
	  }

      setSpirit(spirit) {
		if (this.spirit == spirit) {
			return;
		}

	    this.spirit = spirit;
		switch(spirit){
		  case "normal":
			this.head.eyesTemplate = normalEyesExpression;
			break;
		  case "sad":
			this.head.eyesTemplate = sadEyesExpression;
			break;
		  case "eager":
			this.head.eyesTemplate = eagerEyesExpression;
			break;
		  default:
			this.head.eyesTemplate = normalEyesExpression;
			break;
		}
		this.head.addEyeMovement(30, undefined, this.head.eyesTemplate);
	  }


      // Read user controler input and set cotrol inputs
	  handleUserInput() {
		// keyboard input
		if (this.controlKeys && (this.gamepad === undefined) && !this.isTouchControl) {
			this.controlInput.movex = ((keys[this.controlKeys.right[camSetting.controlsRotation]] ? 1 : 0) + (keys[this.controlKeys.left[camSetting.controlsRotation]] ? -1 : 0));
			this.controlInput.movey = ((keys[this.controlKeys.down[camSetting.controlsRotation]] ? 1 : 0) + (keys[this.controlKeys.up[camSetting.controlsRotation]] ? -1 : 0));

			const strategyPressed =
				keys[this.controlKeys.strategy[camSetting.controlsRotation]] === true;
			if (strategyPressed && !this.team.strategyChosen) {
				this.controlInput.strategy = 1;
				this.team.strategyChosen = true;
			}
			if (!strategyPressed) {
				this.team.strategyChosen = false;
			}

			this.controlInput.lift = keys[this.controlKeys.lift[camSetting.controlsRotation]] ? 1 : 0;
			this.controlInput.boost = keys[this.controlKeys.boost[camSetting.controlsRotation]] ? 1 : 0;

			let deltaRot = ((keys[this.controlKeys.rotRight[camSetting.controlsRotation]] ? 1/5 : 0) + (keys[this.controlKeys.rotLeft[camSetting.controlsRotation]] ? -1/5 : 0));
			this.controlInput.rotate = (deltaRot == 0) ? 0 : this.controlInput.rotate + deltaRot;

		}
		// gamepad input
		this.gamepad = navigator.getGamepads()[this.gpIndex];
		if (!(this.gamepad === undefined || this.gamepad === null)) {
				let moveX = this.gamepad.axes[this.gpMap.gpAxis[camSetting.controlsRotation].moveX];
				let moveY = this.gamepad.axes[this.gpMap.gpAxis[camSetting.controlsRotation].moveY];
				moveX = (Math.abs(moveX) < gpDeadZone) ? 0 : (Math.abs(moveX) > gpMaxZone ? 1 * Math.sign(moveX) : moveX);
				moveY = (Math.abs(moveY) < gpDeadZone) ? 0 : (Math.abs(moveY) > gpMaxZone ? 1 * Math.sign(moveY) : moveY);
				this.controlInput.movex = moveX * this.gpMap.gpAxis[camSetting.controlsRotation].moveXOrientation;
				this.controlInput.movey = moveY * this.gpMap.gpAxis[camSetting.controlsRotation].moveYOrientation;

				const strategyPressed = this.gamepad.buttons[this.gpMap.butStrategy].pressed;

				if (strategyPressed && !this.team.strategyChosen) {
					this.controlInput.strategy = 1;
					this.team.strategyChosen = true;
				}

				if (!strategyPressed) {
					this.team.strategyChosen = false;
				}

				this.controlInput.lift = (this.gamepad.buttons[this.gpMap.butLift1].pressed || this.gamepad.buttons[this.gpMap.butLift2].pressed) ? 1 : 0;
				this.controlInput.boost = this.gamepad.buttons[this.gpMap.butBoost].pressed ? 1 : 0;

				let rotX = this.gamepad.axes[this.gpMap.gpAxis[camSetting.controlsRotation].rotX];
				let rotY = this.gamepad.axes[this.gpMap.gpAxis[camSetting.controlsRotation].rotY];
				let rot = Math.hypot(rotX, rotY);
				rotX = (rot < gpDeadZone) ? 0 : (Math.abs(rotX) > gpMaxZone ? 1 * Math.sign(rotX) : rotX);
				rotY = (rot < gpDeadZone) ? 0 : (Math.abs(rotY) > gpMaxZone ? 1 * Math.sign(rotY) : rotY);
				rotX = rotX * this.gpMap.gpAxis[camSetting.controlsRotation].rotXOrientation;
				rotY = rotY * this.gpMap.gpAxis[camSetting.controlsRotation].rotYOrientation;

				let angleToTarget = Math.atan2(rotY, rotX) - Math.PI/2;
				//let rotGpButtons = ((this.gamepad.buttons[this.gpMap.butRotRight].pressed ? 1/5 : 0) + (this.gamepad.buttons[this.gpMap.butRotLeft].pressed ? -1/5 : 0));
				let rotGpButtons = this.gamepad.buttons[this.gpMap.butRotRight].value - this.gamepad.buttons[this.gpMap.butRotLeft].value;

				if (rotGpButtons != 0) {
					this.controlInput.rotate = rotGpButtons;
				} else {
					this.controlInput.rotate = (rot > gpMinZone) ? clamp(normalizeAngle(angleToTarget - this.angle) * 2, -1, 1 ) : 0;
				}
		}
		// touch control input
		if (this.isTouchControl && (this.gamepad === undefined)) {
			const dx = this.controlInput.rotX;
			const dy = this.controlInput.rotY;
			const angleToTarget = Math.atan2(dy, dx) - Math.PI / 2;
			const rot = Math.hypot(dx, dy);
			if (rot > 5) {
			  this.controlInput.rotate = clamp(normalizeAngle(angleToTarget - this.angle) * 1.0, -1, 1);
			} else {

				if (rot > gpMinZone) {
					let deltaAngle = normalizeAngle(angleToTarget - this.angle);

					// --- FIXED COMMITMENT LOGIC ---
					// Threshold: ~160 degrees (Math.PI * 0.9).
					// If target is almost directly behind, the math becomes unstable (+PI vs -PI).
					if (Math.abs(deltaAngle) > Math.PI * 0.9) {

						// Look at what we TOLD the player to do last frame (the command, not the physics speed)
						// If we were commanding a Left turn (> 0), force the math to stay Left (+PI)
						if (this.controlInput.rotate > 0) {
							deltaAngle = Math.PI;
						}
						// If we were commanding a Right turn (< 0), force the math to stay Right (-PI)
						else if (this.controlInput.rotate < 0) {
							deltaAngle = -Math.PI;
						}
						// If we were neutral (0), we let the raw math decide the shortest path.
					}
					// -----------------------------

					// Apply control
					this.controlInput.rotate = clamp(deltaAngle * 2, -1, 1);
				} else {
					this.controlInput.rotate = 0;
				}

				//this.controlInput.rotate = (rot > gpMinZone) ? clamp(normalizeAngle(angleToTarget - this.angle) * 2, -1, 1 ) : 0;
			}
		}

        this.stickOffset = { x: 0, y: this.stickSide };
      }

	  getNearestPlayer(amongPlayers) {
		let nearestPlayer = undefined;
		let minDist = Infinity;

		for (const player of amongPlayers) {
			if (this !== player) {
				const dist = distance(this.x, this.y, player.x, player.y);
				if (dist < minDist) {
					minDist = dist;
					nearestPlayer = player;
				}
			}
		}
		return nearestPlayer;
	  }

	  // Helper na výpočet WORLD stick start & end:
	  getStickSegment() {
		let ox = this.stickOffset.x;
		let oy = this.stickOffset.y;

		let baseMag = Math.hypot(ox, oy);
		let dirX = ox / baseMag;
		let dirY = oy / baseMag;

		// local positions
		let lx1 = ox;
		let ly1 = oy;
		let lx2 = ox + dirX * this.stickLength;
		let ly2 = oy + dirY * this.stickLength;

		// rotate
		let s = Math.sin(this.angle);
		let c = Math.cos(this.angle);

		let wx1 = this.x + lx1 * c - ly1 * s;
		let wy1 = this.y + lx1 * s + ly1 * c;
		let wx2 = this.x + lx2 * c - ly2 * s;
		let wy2 = this.y + lx2 * s + ly2 * c;

		return { sx: wx1, sy: wy1, ex: wx2, ey: wy2 };
	  }

	  getPrevStickSegment() {
		let ox = this.stickOffset.x;
		let oy = this.stickOffset.y;

		let baseMag = Math.hypot(ox, oy);
		let dirX = ox / baseMag;
		let dirY = oy / baseMag;

		// local positions
		let lx1 = ox;
		let ly1 = oy;
		let lx2 = ox + dirX * this.stickLength;
		let ly2 = oy + dirY * this.stickLength;

		// rotate
		let s = Math.sin(this.prevAngle);
		let c = Math.cos(this.prevAngle);

		let wx1 = this.prevX + lx1 * c - ly1 * s;
		let wy1 = this.prevY + lx1 * s + ly1 * c;
		let wx2 = this.prevX + lx2 * c - ly2 * s;
		let wy2 = this.prevY + lx2 * s + ly2 * c;

		return { sx: wx1, sy: wy1, ex: wx2, ey: wy2 };
	  }


      ////////////////////////////////////
      /// --- Ai players behavior ---- ///
      ////////////////////////////////////
	  simpleAI() {
		if (GState.goalTimer > 0) {
		  this.controlInput.movex = 0;
		  this.controlInput.movey = 0;
		  this.controlInput.rotate = 0;
		  let newAngle = normalizeAngle(Math.atan2(this.x - camera.position.x, this.y - 0));
		  this.angle = (Math.abs(newAngle - this.angle) < MAX_SHOOT_ROT_SPEED ) ? newAngle : this.angle + Math.sign(newAngle - this.angle) * MAX_SHOOT_ROT_SPEED;
		  return;
		}
		//if (this.team === teamB && DEBUG_ENABLED) return; //debug line
		if (DEBUG_ENABLED || DEBUG_AI_DISABLED) return; //debug line

		let shootThresholdOffence = this.radius / 2;
		let shootThresholdDefence = this.stickSide + this.stickLength;
	    let targetRotation;
        let teammate = this.getTeammate();
        let dSelf = distance(this.x, this.y, puckObj.x, puckObj.y);
        let dMate = teammate ? distance(teammate.x, teammate.y, puckObj.x, puckObj.y) : Infinity;
		let actualAngleToPuck = Math.atan2(puckObj.y - this.y, puckObj.x - this.x) - Math.PI / 2;

        // Estimate dt_contact based on distance from stick tip to puck.
        let stickTip = {
          x: this.x + (this.stickSide + this.stickLength / 2) * Math.cos(this.angle),
          y: this.y + (this.stickSide + this.stickLength / 2) * Math.sin(this.angle)
        };
		let moveControlStrength = 0;

	    //let shootTimeToContact = Math.abs(normalizeAngle(actualAngleToPuck - this.angle)) / MAX_SHOOT_ROT_SPEED;

		let contactVel = Math.hypot(this.vx - puckObj.vx, this.vy - puckObj.vy);
        let contactDist = Math.hypot(stickTip.x - puckObj.x, stickTip.y - puckObj.y);
        // Use a contact speed factor (e.g., 5 pixels/frame)
        let dt_contact = Math.max(5, contactDist / (contactVel + 5))

        let a_x = this.controlInput.movex * this.maxAcc;
        let a_y = this.controlInput.movey * this.maxAcc;
        let projPlayerX = this.x + this.vx * dt_contact // + 0.5 * a_x * dt_contact * dt_contact;

		let angleToPuck = Math.atan2(projPuckY - targetPlayerY, projPuckX - targetPlayerX) + addRotation;

		// --- Prepare debug variable ----------------------------------------------------------------

				  targetRotation = (anglePuckToGoal > anglePlayerToGoal) ? -2.0 : 2.0;

				// modify player target if ahead of the puck in deffensive zone

					break;
				  case 2: // normal
					this.tx = (puckObj.x < fieldOffsetX + fieldWidth/2) ? Math.max(puckObj.x, fieldOffsetX + fieldWidth * 0.1) : Math.min(puckObj.x, fieldOffsetX + fieldWidth * 0.75);
					this.ty = (teammate.y > fieldOffsetY + fieldHeight/2) ? puckObj.y -  fieldHeight / 3 : puckObj.y + fieldHeight / 3;
					break;
				  case 3: // attack

					this.ty = (teammate.y > fieldOffsetY + fieldHeight/2) ? puckObj.y -  fieldHeight / 3 : puckObj.y + fieldHeight / 3;

					this.ty = (puckObj.x > fieldOffsetX + fieldWidth/2) ? ((teammate.y > fieldOffsetY + fieldHeight/2) ? puckObj.y -  fieldHeight / 3 : puckObj.y +  fieldHeight / 3) : Math.min(fieldOffsetY + fieldHeight * 0.75, Math.max(puckObj.y, fieldOffsetY + fieldHeight * 0.25));

			  let angleToTarget = Math.atan2(this.ty - this.y, this.tx  - this.x) + addRotation;

    // -----------------------------

    // -----------------------------
    // Collision Functions

	function checkPuckPlayerCollision(player) {
		const px = puckObj.x;
		const py = puckObj.y;
		const plx = player.x;
		const ply = player.y;

		let dx = px - plx;
		let dy = py - ply;
		let dist = Math.hypot(dx, dy);
		let minDist = puckObj.radius + player.radius;

		if (dist >= minDist) return;

		// --- Normalized collision normal ---
		let nx = dx / dist;
		let ny = dy / dist;

		// We must physically push the overlapping objects apart BEFORE we check
		// if they are separating, otherwise they get permanently glued together!
		let overlap = minDist - dist;

		// Boosted to 0.9 to ensure it clears the body instantly, mitigating the "Center-Crossing" bug
		const percent = 0.9;
		const slop = 0.01;

		if (overlap > slop) {
			let correction = (overlap - slop) * percent;
			puckObj.x += nx * correction;
			puckObj.y += ny * correction;
		}

		// --- Relative velocity ---
		let rvx = puckObj.vx - player.vx;
		let rvy = puckObj.vy - player.vy;

		// --- Velocity along the collision normal ---
		let velAlongNormal = rvx * nx + rvy * ny;

		// If they are separating, we abort the bounce math, but we STILL
		// executed the positional correction above to prevent visual sinking.
		if (velAlongNormal > 0) return;

		// --- Control bounciness here ---
		const RESTITUTION = 0.4;

		const puckMass = 1;
		const playerMass = 20;

		let impulse = -(1 + RESTITUTION) * velAlongNormal;
		impulse /= (1 / puckMass + 1 / playerMass);

		// --- Apply impulse to puck only ---
		puckObj.vx += (impulse / puckMass) * nx;
		puckObj.vy += (impulse / puckMass) * ny;

		// Play sound
		let vdiff = Math.hypot(rvx, rvy);
		if (Date.now() - player.puckSoundTime > SHOOT_SOUND_TIME_MIN) {
			const maxImpactSpeed = 10;
			let volume = clamp(vdiff / maxImpactSpeed, 0, 1);
			player.puckSoundTime = Date.now();
			sound.playSoundVar("bodyPuck", 0.15, volume);
		}
	}


	function handleGoalPostCollisions() {
		for (const post of goalPosts) {

			let dx = puckObj.x - post.x;
			let dy = puckObj.y - post.y;
			let dist = Math.hypot(dx, dy);
			let minDist = puckObj.radius + post.radius;

			// No collision
			if (dist >= minDist) continue;

			// --- Collision normal ---
			let nx = dx / dist;
			let ny = dy / dist;

			// --- Relative velocity (post is static → its velocity = 0) ---
			let rvx = puckObj.vx;
			let rvy = puckObj.vy;

			// --- Component of velocity along the normal ---
			let velAlongNormal = rvx * nx + rvy * ny;

			// If moving away, don't bounce
			if (velAlongNormal > 0) {
				// Still resolve overlap so the puck does not get stuck
				let overlap = minDist - dist;
				puckObj.x += nx * overlap;
				puckObj.y += ny * overlap;
				continue;
			}

			// --- Apply restitution (bounce factor) ---
			const REST = post.restitution ?? 0.6;

			// Impulse for a static object:
			let impulse = -(1 + REST) * velAlongNormal;

			// Apply impulse to puck only (post is heavy / static)
			puckObj.vx += impulse * nx;
			puckObj.vy += impulse * ny;

			// --- Positional correction ---
			let overlap = minDist - dist;
			puckObj.x += nx * overlap;
			puckObj.y += ny * overlap;

			const volume = Math.min(Math.abs(impulse / PUCK_MAX_SPEED), 1);
			sound.playSoundVar("goalPost", 0.15, volume);

		}
	}



	function checkPuckStickCollision(player) {
	  player.stickPuckContact = false;
	  if (player.stickLifted) return false;

	  // chcek distance from puck current/previous positions to player's current position
	  let mag = Math.hypot(player.stickOffset.x, player.stickOffset.y);
	  if (mag === 0) mag = 1;
	  const stickThickness = 3;  // for collisions purpose

	  const stickReach = mag + player.stickLength + stickThickness + puckObj.radius;
	  const distNow  = distance(puckObj.x,     puckObj.y,     player.x, player.y);
	  const distPrev = distance(puckObj.prevX, puckObj.prevY, player.x, player.y);
	  if (distNow > stickReach && distPrev > stickReach) return false; // puck too far — impossible to collide this frame

	  // Prepočítame aktuálny world stick len preto, aby sme mali fallback a pre intersection test.
	  const restitutionLinear = 0;
	  const restitutionRotational = 0;
	  let dirX = player.stickOffset.x / mag;
	  let dirY = player.stickOffset.y / mag;

	  let localStart = { x: player.stickOffset.x, y: player.stickOffset.y };
	  let localEnd = {
		x: player.stickOffset.x + dirX * player.stickLength,
		y: player.stickOffset.y + dirY * player.stickLength
	  };

	  let worldStart = rotatePoint(localStart.x, localStart.y, player.angle);
	  let worldEnd = rotatePoint(localEnd.x, localEnd.y, player.angle);
	  worldStart.x += player.x; worldStart.y += player.y;
	  worldEnd.x += player.x; worldEnd.y += player.y;

	  // --------- CCD / detection --------------
	  let collisionOccurred = false;
	  let puckCollisionPointX = puckObj.x;
	  let puckCollisionPointY = puckObj.y;
	  let t_contact = null;

	  // We'll collect/contact-time stick geometry & nearest point into these.
	  let ws_c = null, we_c = null, nearestX_c = null, nearestY_c = null;
	  let stickX_c = null, stickY_c = null, stickAngle_c = null;

	  // --- 1) early intersection between puck segment and current stick segment (fast puck case)
	  const intersection = getLineSegmentIntersection(
		puckObj.prevX, puckObj.prevY, puckObj.x, puckObj.y,
		worldStart.x, worldStart.y, worldEnd.x, worldEnd.y
	  );

	  if (intersection) {
		const px = intersection.x;
		const py = intersection.y;
		const tPuck = intersection.tPuck;

		t_contact = tPuck;
		puckCollisionPointX = px;
		puckCollisionPointY = py;
		collisionOccurred = true;

		stickX_c = (player.prevX !== undefined) ? player.prevX + (player.x - player.prevX) * t_contact : player.x;
		stickY_c = (player.prevY !== undefined) ? player.prevY + (player.y - player.prevY) * t_contact : player.y;
		stickAngle_c = (player.prevAngle !== undefined) ? player.prevAngle + (player.angle - player.prevAngle) * t_contact : player.angle;

		let mag_i = Math.hypot(player.stickOffset.x, player.stickOffset.y);
		if (mag_i === 0) mag_i = 1;
		let dirXi = player.stickOffset.x / mag_i;
		let dirYi = player.stickOffset.y / mag_i;

		let ls_i = { x: player.stickOffset.x, y: player.stickOffset.y };
		let le_i = {
		  x: player.stickOffset.x + dirXi * player.stickLength,
		  y: player.stickOffset.y + dirYi * player.stickLength
		};

		ws_c = rotatePoint(ls_i.x, ls_i.y, stickAngle_c);
		we_c = rotatePoint(le_i.x, le_i.y, stickAngle_c);
		ws_c.x += stickX_c; ws_c.y += stickY_c;
		we_c.x += stickX_c; we_c.y += stickY_c;

		// nearest point at contact time
		let A_i = puckCollisionPointX - ws_c.x;
		let B_i = puckCollisionPointY - ws_c.y;
		let C_i = we_c.x - ws_c.x;
		let D_i = we_c.y - ws_c.y;
		let len_sq_i = C_i * C_i + D_i * D_i;
		let param_i = len_sq_i !== 0 ? (A_i * C_i + B_i * D_i) / len_sq_i : -1;

		if (param_i < 0) { nearestX_c = ws_c.x; nearestY_c = ws_c.y; }
		else if (param_i > 1) { nearestX_c = we_c.x; nearestY_c = we_c.y; }
		else { nearestX_c = ws_c.x + param_i * C_i; nearestY_c = ws_c.y + param_i * D_i; }
	  }

	  // --- 2) if no intersection, do multistep CCD (stick rotation/movement through (prev->cur) can hit stationary or slow puck)
	  if (!collisionOccurred) {
		const SUBSTEPS = 5;
		for (let i = 1; i <= SUBSTEPS; i++) {
		  const t = i / SUBSTEPS;

		  const puckMidX = puckObj.prevX + (puckObj.x - puckObj.prevX) * t;
		  const puckMidY = puckObj.prevY + (puckObj.y - puckObj.prevY) * t;

		  const stickX = player.prevX + (player.x - player.prevX) * t;
		  const stickY = player.prevY + (player.y - player.prevY) * t;
		  const stickAngle = player.prevAngle + (player.angle - player.prevAngle) * t;

		  let mag2 = Math.hypot(player.stickOffset.x, player.stickOffset.y);
		  if (mag2 === 0) mag2 = 1;
		  let dirX2 = player.stickOffset.x / mag2;
		  let dirY2 = player.stickOffset.y / mag2;

		  let ls = { x: player.stickOffset.x, y: player.stickOffset.y };
		  let le = {
			x: player.stickOffset.x + dirX2 * player.stickLength,
			y: player.stickOffset.y + dirY2 * player.stickLength
		  };

		  let ws = rotatePoint(ls.x, ls.y, stickAngle);
		  let we = rotatePoint(le.x, le.y, stickAngle);
		  ws.x += stickX; ws.y += stickY;
		  we.x += stickX; we.y += stickY;

		  let A = puckMidX - ws.x;
		  let B = puckMidY - ws.y;
		  let C = we.x - ws.x;
		  let D = we.y - ws.y;
		  let len_sq = C * C + D * D;
		  let param = len_sq !== 0 ? (A * C + B * D) / len_sq : -1;

		  let nearestX, nearestY;
		  if (param < 0) { nearestX = ws.x; nearestY = ws.y; }
		  else if (param > 1) { nearestX = we.x; nearestY = we.y; }
		  else { nearestX = ws.x + param * C; nearestY = ws.y + param * D; }

		  let d = distance(puckMidX, puckMidY, nearestX, nearestY);

		  if (d < puckObj.radius + stickThickness) {
			collisionOccurred = true;
			t_contact = t;
			puckCollisionPointX = puckMidX;
			puckCollisionPointY = puckMidY;

			stickX_c = stickX;
			stickY_c = stickY;
			stickAngle_c = stickAngle;
			ws_c = ws;
			we_c = we;
			nearestX_c = nearestX;
			nearestY_c = nearestY;
			break;
		  }
		}

		if (!collisionOccurred) {
		  player.stickPuckContact = false;
		  return false;
		}
	  }

	  // -----------------------------------------------
	  // UNIFIED RESOLUTION (use values at t_contact)
	  // -----------------------------------------------

	  if (!ws_c || !we_c || nearestX_c === null || nearestY_c === null) {
		// reconstruct in case something missing (defensive)
		stickX_c = (player.prevX !== undefined) ? player.prevX + (player.x - player.prevX) * t_contact : player.x;
		stickY_c = (player.prevY !== undefined) ? player.prevY + (player.y - player.prevY) * t_contact : player.y;
		stickAngle_c = (player.prevAngle !== undefined) ? player.prevAngle + (player.angle - player.prevAngle) * t_contact : player.angle;

		let mag3 = Math.hypot(player.stickOffset.x, player.stickOffset.y);
		if (mag3 === 0) mag3 = 1;
		let dirX3 = player.stickOffset.x / mag3;
		let dirY3 = player.stickOffset.y / mag3;

		let ls_c_local = { x: player.stickOffset.x, y: player.stickOffset.y };
		let le_c_local = {
		  x: player.stickOffset.x + dirX3 * player.stickLength,
		  y: player.stickOffset.y + dirY3 * player.stickLength
		};

		ws_c = rotatePoint(ls_c_local.x, ls_c_local.y, stickAngle_c);
		we_c = rotatePoint(le_c_local.x, le_c_local.y, stickAngle_c);
		ws_c.x += stickX_c; ws_c.y += stickY_c;
		we_c.x += stickX_c; we_c.y += stickY_c;

		let A_c = puckCollisionPointX - ws_c.x;
		let B_c = puckCollisionPointY - ws_c.y;
		let C_c = we_c.x - ws_c.x;
		let D_c = we_c.y - ws_c.y;
		let len_sq_c = C_c * C_c + D_c * D_c;
		let param_c = len_sq_c !== 0 ? (A_c * C_c + B_c * D_c) / len_sq_c : -1;

		if (param_c < 0) { nearestX_c = ws_c.x; nearestY_c = ws_c.y; }
		else if (param_c > 1) { nearestX_c = we_c.x; nearestY_c = we_c.y; }
		else { nearestX_c = ws_c.x + param_c * C_c; nearestY_c = ws_c.y + param_c * D_c; }
	  }

	  let d_c = distance(puckCollisionPointX, puckCollisionPointY, nearestX_c, nearestY_c);
	  if (d_c > puckObj.radius + stickThickness) {
		player.stickPuckContact = false;
		return false;
	  }

	  // normal at contact time (used for impulse calculation)
	  let nx = (puckCollisionPointX - nearestX_c) / d_c;
	  let ny = (puckCollisionPointY - nearestY_c) / d_c;
	  if (d_c === 0) { nx = 1; ny = 0; }

	  player.stickPuckContact = true;

	  // ---------- velocities at contact time ----------
	  const prevVx = (player.prevVx !== undefined) ? player.prevVx : player.vx;
	  const prevVy = (player.prevVy !== undefined) ? player.prevVy : player.vy;
	  const stickVxLinear_c = prevVx + (player.vx - prevVx) * t_contact;
	  const stickVyLinear_c = prevVy + (player.vy - prevVy) * t_contact;

	  const prevRot = (player.prevRotSpeed !== undefined) ? player.prevRotSpeed : player.rotSpeed;
	  const rotSpeed_c = prevRot + (player.rotSpeed - prevRot) * t_contact;

	  const playerX_c = (player.prevX !== undefined) ? player.prevX + (player.x - player.prevX) * t_contact : player.x;
	  const playerY_c = (player.prevY !== undefined) ? player.prevY + (player.y - player.prevY) * t_contact : player.y;

	  const rX = nearestX_c - playerX_c;
	  const rY = nearestY_c - playerY_c;

	  const vRotX = -rotSpeed_c * rY;
	  const vRotY =  rotSpeed_c * rX;

	  const stickVx_c = stickVxLinear_c + vRotX;
	  const stickVy_c = stickVyLinear_c + vRotY;

	  // ---------- relative velocity & impulse ----------
	  let relVx = puckObj.vx - stickVx_c;
	  let relVy = puckObj.vy - stickVy_c;
	  let impactSpeed = relVx * nx + relVy * ny;

	  let e = (Math.abs(player.rotSpeed) > 0.001) ? restitutionRotational : restitutionLinear;

	  if (impactSpeed < 0) {
		let impulse = -(1 + e) * impactSpeed;
		puckObj.vx += impulse * nx;
		puckObj.vy += impulse * ny;
	  } else {
		let playerSpeedAtPoint = Math.hypot(stickVx_c, stickVy_c);
		if (playerSpeedAtPoint > 0.1) {
		  puckObj.vx += nx * playerSpeedAtPoint * 0.1;
		  puckObj.vy += ny * playerSpeedAtPoint * 0.1;
		}
	  }

	// -------------- PENETRATION CORRECTION (HYBRID: contact normal + final overlap) --------------

	//
	// 1) compute overlap relative to final stick position
	//
	let A_now = puckObj.x - worldStart.x;
	let B_now = puckObj.y - worldStart.y;
	let C_now = worldEnd.x - worldStart.x;
	let D_now = worldEnd.y - worldStart.y;
	let len_sq_now = C_now*C_now + D_now*D_now;

	let param_now = (len_sq_now !== 0 ? (A_now*C_now + B_now*D_now) / len_sq_now : -1);

	let nearestNowX, nearestNowY;
	if (param_now < 0) {
		nearestNowX = worldStart.x;
		nearestNowY = worldStart.y;
	} else if (param_now > 1) {
		nearestNowX = worldEnd.x;
		nearestNowY = worldEnd.y;
	} else {
		nearestNowX = worldStart.x + param_now * C_now;
		nearestNowY = worldStart.y + param_now * D_now;
	}

	let d_now = distance(puckObj.x, puckObj.y, nearestNowX, nearestNowY);
	let overlap_now = (puckObj.radius + stickThickness) - d_now;

	//
	// 2) push puck OUT using *contact normal*, but distance = overlap_now
	//
	if (overlap_now > 0) {
		// normal is from t_contact (correct direction!)
		puckObj.x += nx * overlap_now;
		puckObj.y += ny * overlap_now;
	}

	  // Play shooting SFX
	  if(Date.now() - player.shootSoundTime > SHOOT_SOUND_TIME_MIN) {
		player.shootSoundTime = Date.now();
		const maxImpactSpeed = 30;
		let volume = clamp(Math.abs(impactSpeed / maxImpactSpeed), 0, 1);
		if(player.rotSpeed == 0) {
			sound.playSoundVar("takePuck", 0.15, volume);
		} else {
			sound.playSoundVar("shot1", 0.15, volume);
			//if (Math.random() > 0.5) sound.playSoundVar("shot1", 0.15, volume); else sound.playSoundVar("shot2", 0.15, volume);
		}
	  }

	  limitSpeed(puckObj, PUCK_MAX_SPEED );
	  return true;
	}


	function getPlayerCollisionOrder(plrs) {

		const indexed = plrs.map((p, i) => {

			// CURRENT blade tip
			const offNow = rotatePoint(p.stickOffset.x, p.stickOffset.y, p.angle);
			const dirNow = {
				x: Math.cos(p.angle) * p.stickLength,
				y: Math.sin(p.angle) * p.stickLength
			};
			const tipNow = {
				x: p.x + offNow.x + dirNow.x,
				y: p.y + offNow.y + dirNow.y
			};

			// PREVIOUS blade tip
			const offPrev = rotatePoint(p.stickOffset.x, p.stickOffset.y, p.prevAngle);
			const dirPrev = {
				x: Math.cos(p.prevAngle) * p.stickLength,
				y: Math.sin(p.prevAngle) * p.stickLength
			};
			const tipPrev = {
				x: p.prevX + offPrev.x + dirPrev.x,
				y: p.prevY + offPrev.y + dirPrev.y
			};

			// COMPLETE precise blade motion
			const dx = tipNow.x - tipPrev.x;
			const dy = tipNow.y - tipPrev.y;
			const stickMove = Math.sqrt(dx*dx + dy*dy);

			return { index: i, stickMove };
		});

		// Larger movement → earlier evaluation
		// Smaller movement → last in evaluation (defender priority)
		indexed.sort((a, b) => b.stickMove - a.stickMove);

		return indexed.map(o => o.index);
	}


	function checkPlayerCollisions() {
	  for (let i = 0; i < players.length; i++) {
		for (let j = i+1; j < players.length; j++) {

		  let p1 = players[i], p2 = players[j];

		  // =====================================================
		  // 1) --- PLAYER–PLAYER COLLISION (existing code improved)
		  // =====================================================

		  let dx = p2.x - p1.x;
		  let dy = p2.y - p1.y;
		  let dist = Math.hypot(dx, dy);
		  let minDist = p1.radius + p2.radius;

		  if (dist < minDist && dist > 0) {

			// Separation
			let overlap = (minDist - dist) / 2;
			let nx = dx / dist;
			let ny = dy / dist;

			p1.x -= nx * overlap;
			p1.y -= ny * overlap;
			p2.x += nx * overlap;
			p2.y += ny * overlap;

			// Relative velocity
			let rvx = p2.vx - p1.vx;
			let rvy = p2.vy - p1.vy;

			let velAlongNormal = rvx * nx + rvy * ny;
			if (velAlongNormal < 0) {

			  let e = 0.3; // elasticity
			  let m1 = p1.mass || 1;
			  let m2 = p2.mass || 1;

			  let jImpulse = -(1 + e) * velAlongNormal / (1/m1 + 1/m2);
			  let ix = jImpulse * nx;
			  let iy = jImpulse * ny;

			  p1.vx -= ix / m1;
			  p1.vy -= iy / m1;
			  p2.vx += ix / m2;
			  p2.vy += iy / m2;

				// Play sound
				const maxHitSpeed = 6;
				const volume = clamp( -velAlongNormal / maxHitSpeed, 0, 1);
				const now = Date.now();
				if ( (now - p1.bodySoundTime > SHOOT_SOUND_TIME_MIN) ||
					 (now - p2.bodySoundTime > SHOOT_SOUND_TIME_MIN) ) {
					p1.bodySoundTime = now;
					p2.bodySoundTime = now;
					sound.playSoundVar("bodyBody", 0.15, volume);
				}

			}
		  }

		  // =====================================================
		  // 2) --- STICK vs PLAYER BODY COLLISION
		  // =====================================================

		  handleStickPlayerCollision(p1, p2);
		  handleStickPlayerCollision(p2, p1);

			function handleStickPlayerCollision(ps, pb) {
			  let stick = ps.getStickSegment();
			  //ps.maxRotSpeed = MAX_SHOOT_ROT_SPEED;

			  // 1. Geometry: Distance to segment
			  let d = pointToSegmentDist(
				pb.x, pb.y,
				stick.sx, stick.sy,
				stick.ex, stick.ey
			  );

			  let allowed = pb.radius + 1; // Tolerance

			  if (d < allowed) {
				// --- A. FIND CONTACT POINT & NORMAL ---
				let dx = stick.ex - stick.sx;
				let dy = stick.ey - stick.sy;
				let len2 = dx * dx + dy * dy;
				let t = ((pb.x - stick.sx) * dx + (pb.y - stick.sy) * dy) / len2;
				t = Math.max(0, Math.min(1, t));

				let cx = stick.sx + t * dx;
				let cy = stick.sy + t * dy;

				let nx = pb.x - cx;
				let ny = pb.y - cy;
				let nmag = Math.hypot(nx, ny) || 0.001;
				nx /= nmag;
				ny /= nmag;

				// --- B. CALCULATE VELOCITIES ---

				// 1. Get Shooter's Angular Velocity
				// If you don't track rotSpeed, calculate it from prevAngle
				let angVel = ps.rotSpeed || 0;
				if (!angVel && ps.prevAngle !== undefined) {
					 angVel = ps.angle - ps.prevAngle;
					 // Handle angle wrapping -PI to PI
					 if (angVel > Math.PI) angVel -= Math.PI * 2;
					 if (angVel < -Math.PI) angVel += Math.PI * 2;
				}

				// 2. Vector from Shooter Center to Contact Point (Lever Arm)
				let rx = cx - ps.x;
				let ry = cy - ps.y;

				// 3. Velocity of the Stick Tip
				// V_tip = V_linear + V_tangential
				// Tangential = (-angVel * ry, angVel * rx)
				let vStickX = ps.vx + (-angVel * ry);
				let vStickY = ps.vy + (angVel * rx);

				// 4. Relative Velocity (Victim Body - Stick Tip)
				let rvx = pb.vx - vStickX;
				let rvy = pb.vy - vStickY;

				// Velocity along the normal
				let velAlongNormal = rvx * nx + rvy * ny;

				// Only collide if moving towards each other
				if (velAlongNormal < 0) {

				  // --- C. RESOLVE IMPULSE ---

				  let e = 0.5; // Low elasticity for flesh/stick collision
				  let m1 = ps.mass || 1;
				  let m2 = pb.mass || 1;

				  // Standard Impulse Scalar
				  let j = -(e) * velAlongNormal;
				  j /= (1 / m1 + 1 / m2);

				  // The Impulse Vector
				  let ix = j * nx;
				  let iy = j * ny;

				  // 1. Apply LINEAR velocity change
				  // Victim gets pushed away
				  pb.vx += ix / m2;
				  pb.vy += iy / m2;

				  // Shooter gets pushed back (Linear Recoil)
				  ps.vx -= ix / m1;
				  ps.vy -= iy / m1;

				  // --- D. APPLY ROTATIONAL IMPULSE (The soft impact) ---

				  // 1. Calculate Torque (Cross Product of Radius and Force)
				  // Force on stick is opposite to Impulse on victim: (-ix, -iy)
				  // Torque = rx * Fy - ry * Fx
				  let torque = rx * (-iy) - ry * (-ix);

				  // 2. Moment of Inertia (Resistance to rotation)
				  // A high inertia means it's hard to stop the stick.
				  // A simple approximation for a "stick held at one end" or a player body.
				  // Increase this value to make the stick "heavier" and recoil less.
				  let inertia = m1 * (ps.radius * ps.radius) * 10;

				  // 3. Calculate change in rotation
				  let deltaRot = torque / inertia;

				  // 4. APPLY REDUCTION FACTOR (User Request)
				  // We multiply by a small number (e.g., 0.1 or 0.2) to make the
				  // rotational influence subtle, not abrupt.
				  let dampening = 0.15;

				  // 5. Update the rotation Speed
				  if (ps.rotSpeed !== undefined) {
					 ps.rotSpeed += deltaRot * dampening;
				  }

					// Play sound
					const STICKHIT_SOUND_TIME_MIN = 500;
					const maxHitSpeed = 10;
					const volume = clamp( -velAlongNormal / maxHitSpeed, 0, 1);
					const now = Date.now();
					if ( now - ps.stickbodySoundTime > STICKHIT_SOUND_TIME_MIN ) {
						ps.stickbodySoundTime = now;
						sound.playSoundVar("stickBody", 0.15, volume);
					}
				}

				// --- E. POSITIONAL CORRECTION ---
				// Prevent sinking (standard)
				let penetration = allowed - d;
				let percent = 0.2; // Soft correction
				if (penetration > 0) {
					let cx_corr = (penetration * percent) * nx /2;
					let cy_corr = (penetration * percent) * ny /2;

					// Push victim out
					pb.x += cx_corr;
					pb.y += cy_corr;
					// Optional: Push shooter back slightly
					ps.x -= cx_corr;
					ps.y -= cy_corr;
				}
			  }
			}

		}
	  }
	}


    function checkGoalScore() {
		//return;  // uncomment to disable goal detection for debug

		if (!GState.goalScored) {
			if (puckObj.x + puckObj.radius < fieldOffsetX &&
				puckObj.y > goalY && puckObj.y < goalY + goalHeight) {
				teamB.score++;
				GState.goalScored = true;
				GState.goalTeam = teamB;
				GState.goalTimer = goalTimerMax;
			}
			else if (puckObj.x - puckObj.radius > fieldOffsetX + fieldWidth &&
				puckObj.y > goalY && puckObj.y < goalY + goalHeight) {
				teamA.score++;
				GState.goalScored = true;
				GState.goalTeam = teamA;
				GState.goalTimer = goalTimerMax;
			}
			if (GState.goalScored) {
				// set team spirit
				if ((teamB.score - teamA.score) >= SADNESS_TRESHOLD) teamA.setTeamSpirit((GState.goalTeam == teamA) ? "normal" : "sad"); else teamA.setTeamSpirit((teamA.strategy == 3) ? "eager" : "normal");
				if ((teamA.score - teamB.score) >= SADNESS_TRESHOLD) teamB.setTeamSpirit((GState.goalTeam == teamB) ? "normal" : "sad"); else teamB.setTeamSpirit((teamB.strategy == 3) ? "eager" : "normal");
			}
		}
	}

	function updateGoalScorePresentation() {
		const goalHasJustStarted = !wasGoalScored && GState.goalScored;
		const goalHasJustFinished = wasGoalScored && !GState.goalScored;

		if (goalHasJustStarted) {
			showGoalScorePresentation(GState.goalTeam);
		}

		if (goalHasJustFinished && graphicsLevel == 1) {
			spotLightGoalA.intensity = 0;
			spotLightGoalB.intensity = 0;
		}

		wasGoalScored = GState.goalScored;
	}

	function showGoalScorePresentation(team) {
		// show goal lights
		if (!team) return;

		if (graphicsLevel==1) {
			if (team === teamB) {
				spotLightGoalA.intensity = GOAL_LIGHT_INTENSITY;
			}
			else if (team === teamA) {
				spotLightGoalB.intensity = GOAL_LIGHT_INTENSITY;
			}
		}

		// animate players
		players.forEach(p => {
			if (p.team == team) {
				p.head.eyeBrowsUp(5);
				p.body.playerStickUp(Math.floor(Math.random() * 3));
			} else {
				if (Math.random() > 0.5) p.head.upsetHeadShake(6, 6); else p.head.upsetHeadShake(3, 15);
			}

		});

		// animate spectators
		spectators.forEach(s => {
			if(s.dynamic && !s.frozen) {
				s.initiateState();
				s.resetActionTimes();
				let action;
				if (s.team === team) {
					action = (Math.random() < 0.5) ? 10 : 11;
				} else {
					action = (Math.random() < 0.5) ? 12 : 13;
				}
				s.update(action);
			}
		});

		// play goal horn and spectators applause
		const minLoudDiff = 6;
		const minLoudness = 0.05;
		let crowdLoudness = minLoudness + 0.95 * ( clamp ( minLoudDiff - Math.abs ( teamB.score - teamA.score ), 0, minLoudDiff ) / minLoudDiff );
		sound.playSound("goalHorn", { volume: 0.3, rate: 0.9, fadeIn: 0.15 } );
		sound.playSound("crowdGoal", { volume: crowdLoudness, rate: 0.7 + Math.random() * 0.6, fadeIn: Math.random() * 1 } );
	}


	function resetPositions() {
		puckObj.x = fieldOffsetX + fieldWidth/2;
		puckObj.y = HEIGHT/2;
		puckObj.prevX = fieldOffsetX + fieldWidth/2;
		puckObj.prevY = HEIGHT/2;
		puckObj.vx = 0; puckObj.vy = 0;
		players[0].x = fieldOffsetX + fieldWidth*0.32;  players[0].y = HEIGHT*0.5;
		players[1].x = fieldOffsetX + fieldWidth*0.35; players[1].y = HEIGHT*0.3;
		players[2].x = fieldOffsetX + fieldWidth*0.68; players[2].y = HEIGHT*0.5;
		players[3].x = fieldOffsetX + fieldWidth*0.65; players[3].y = HEIGHT*0.7;

		if (graphicsLevel==1) {
			spotLightGoalA.intensity = 0;
			spotLightGoalB.intensity = 0;
		}

		players.forEach(p => {
			p.vx = 0;
			p.vy = 0;
			p.rotSpeed = 0;
			p.stickLifted = false;

			// WIPE ALL CONTROLLER INPUTS
			p.controlInput.movex = 0;
			p.controlInput.movey = 0;
			p.controlInput.rotX = 0;
			p.controlInput.rotY = 0;
			p.controlInput.rotate = 0;
			p.controlInput.autorotate = 0;
			p.controlInput.strategy = 0;
			p.controlInput.lift = 0;
			p.controlInput.boost = 0;
		});

		if (!NetworkManager.isGuest()) {
			GState.goalScored = false;
			GState.goalTeam = null;
			GState.goalTimer = 0;
		}
    }


	function handleBoundaryCollision(circle, segments) {
	  const RESTITUTION = 0.4;
	  const MAX_STICK_CORRECTION = 5.0; // Max pixels to push per frame (Prevents teleporting)

	  // Get stick if it exists
	  let stick = (typeof circle.getStickSegment === 'function') ? circle.getStickSegment() : null;

	  for (let seg of segments) {

		// =========================================================
		// 1. BODY (CIRCLE) COLLISION (Standard)
		// =========================================================
		let dx = circle.x - seg.x1;
		let dy = circle.y - seg.y1;
		let sx = seg.x2 - seg.x1;
		let sy = seg.y2 - seg.y1;
		let segLenSq = sx * sx + sy * sy;
		let t = segLenSq ? (dx * sx + dy * sy) / segLenSq : -1;

		let closestT = Math.max(0, Math.min(1, t));
		let nearestX = seg.x1 + closestT * sx;
		let nearestY = seg.y1 + closestT * sy;
		let dist = Math.hypot(circle.x - nearestX, circle.y - nearestY);

		if (dist < circle.radius) {
		  let penetration = circle.radius - dist;
		  if (penetration > 0) {
			circle.x += seg.nx * penetration;
			circle.y += seg.ny * penetration;
		  }
		  let dot = circle.vx * seg.nx + circle.vy * seg.ny;
		  if (dot < 0) {
			circle.vx = circle.vx - (1 + RESTITUTION) * dot * seg.nx;
			circle.vy = circle.vy - (1 + RESTITUTION) * dot * seg.ny;
		  }
		}

		// =========================================================
		// 2. STICK COLLISION (Improved)
		// =========================================================
		if (stick) {
		  // Helper to get intersection param T on the BOUNDARY segment
		  // (Returns t value 0..1 if intersected, otherwise null)
		  let intersect = getLineSegmentIntersection(
			stick.sx, stick.sy, stick.ex, stick.ey,
			seg.x1, seg.y1, seg.x2, seg.y2
		  );

		  if (intersect !== null) {
			let intersectT = intersect.tPuck;
			let ix = seg.x1 + intersectT * (seg.x2 - seg.x1);
			let iy = seg.y1 + intersectT * (seg.y2 - seg.y1);

			// Vector from Intersection to Stick Tip
			let tipDx = stick.ex - ix;
			let tipDy = stick.ey - iy;

			// Calculate penetration depth along the wall normal
			let overhang = tipDx * seg.nx + tipDy * seg.ny;

			// Only push if the stick is actually pointing "into" the wall
			// (Use Math.abs to handle if it's pointing strictly opposite)
			let pushBack = Math.abs(overhang) + 1.0;

			// --- FIX: DETECT CORNER & CLAMP ---

			// 1. Check if we hit the very edge of the wall (The Goal Post)
			// If intersectT is near 0 or 1, we are at a corner.
			let isCorner = (intersectT < 0.05 || intersectT > 0.95);

			// 2. CLAMP THE PUSH
			// If we are at a corner, or if the push is huge (teleport glitch), cap it.
			// This forces the player to "slide" around the post over several frames
			// rather than jumping instantly.
			if ( pushBack > MAX_STICK_CORRECTION ) {
				pushBack = MAX_STICK_CORRECTION;
			}

			// Apply push
			circle.x += seg.nx * pushBack;
			circle.y += seg.ny * pushBack;

			// --- COMPUTE STICK TIP VELOCITY FROM ROTATION + MOVEMENT ---
			// Stick tip relative vector
			let rx = stick.ex - circle.x;
			let ry = stick.ey - circle.y;

			// Rotational velocity component
			let tipVx_rot = -circle.rotSpeed * ry;
			let tipVy_rot =  circle.rotSpeed * rx;

			// Total tip velocity = rotation + player movement
			let tipVx = circle.vx + tipVx_rot;
			let tipVy = circle.vy + tipVy_rot;

			// Projection of tip velocity INTO the wall normal
			let tipDot = tipVx * seg.nx + tipVy * seg.ny;

			// Only inward hits cause sound
			const impact = Math.max(0, -tipDot);

			// Stop velocity moving into wall
			let vDot = circle.vx * seg.nx + circle.vy * seg.ny;
			if (vDot < 0) {
			  circle.vx -= vDot * seg.nx;
			  circle.vy -= vDot * seg.ny;
			}

			// Stop rotation (Bonk effect)
			if (circle.rotSpeed !== undefined) {
				 circle.rotSpeed *= -0.1;
			}

			// Play sound
			if ( seg.type == 1 ) {
				const maxTipSpeed = 6;
				const volume = clamp(impact / maxTipSpeed, 0, 1);
				if (Date.now() - circle.boardSoundTime > SHOOT_SOUND_TIME_MIN) {
					circle.boardSoundTime = Date.now();
					sound.playSoundVar("stickBoard", 0.15, volume);
				}
			}

			// Update stick coordinates immediately for next segment check
			stick = circle.getStickSegment();
		  }
		}
	  }
	}

      resetPositions();
      puckObj.update();

	// Manage tournament or single match
	function handleGameState (action) {

		if (action === "pause") {
			if (NetworkManager.isGuest()) {
				return;
			}

			if (GState.gameState === "playing" || GState.gameState === "overtime") {
				if (!GState.gamePaused) {
					GState.gamePaused = true;
					pausedTimer = GState.matchTimer;
				} else {
					GState.gamePaused = false;
					GState.matchTimer = pausedTimer;
					lastTimerUpdate = Date.now();
				}
			}
		}

		if (action === "go") {
			// Guest
			if (NetworkManager.isGuest()) {
				if (GState.gameState === "title") {
					NetworkManager.setReady(true);
					NetworkManager.showGameMessage("Ready. Waiting for host.");
				}
				return;
			}

			// Host or offline game
			if (!NetworkManager.isGuest()) {
				if (GState.gameState === "title") {
					GState.gameInfoMsg = "";
					GState.tournamentOver = false;
					GState.gameState = "gameinfo";
				} else if (GState.gameState === "gameover") {
					if (teamA.score > teamB.score && GState.actualStage < maxStage) {
						GState.gameInfoMsg = "";
						GState.tournamentOver = false;
						GState.actualStage++ ;
					} else if (teamA.score > teamB.score && GState.actualStage == maxStage) {
						GState.gameInfoMsg = "Congratulations! You are the champions!";
						GState.tournamentOver = true;
					} else if (teamA.score < teamB.score && GState.actualStage == maxStage) {
						GState.gameInfoMsg = "You made it to the final and finished as the runner-up!";
						GState.tournamentOver = true;
					} else if (teamA.score < teamB.score && GState.actualStage < maxStage) {
						GState.gameInfoMsg = "You have been eliminated in " + gameStages[GState.actualStage].name + ".";
						GState.tournamentOver = true;
					}  else if (GState.gameMode = "single match" ) {
						GState.gameInfoMsg = "End of " + gameStages[GState.actualStage].name + ".";
						GState.tournamentOver = true;
					}
					GState.gameState = "gameinfo";
				} else if (GState.gameState === "gameinfo") {
					if (!GState.tournamentOver) {
						GState.gameState = "playing";
						startGame();
					} else {
						GState.gameState = "title";
						GState.actualStage = 0;
						resetGameToTitle();
					}
				}
				updateVrHud(true);
			}
		}
	}

	function setPlayerCamera() {
		if (
			!NetworkManager.isOnline() ||
			NetworkManager.localPlayerIndex === null ||
			!players[NetworkManager.localPlayerIndex]
		) {
			camSetting.userType = 2;
			camSetting.type = 2;
		} 
		else {
			const localOnlinePlayer = players[NetworkManager.localPlayerIndex];

			if (localOnlinePlayer.team === teamA) {
				camSetting.userType = 2;
				camSetting.type = 2;
			} else if (localOnlinePlayer.team === teamB) {
				camSetting.userType = 3;
				camSetting.type = 3;
			} else {
				camSetting.userType = 2;
				camSetting.type = 2;
			}
		}
	}


	function updateOnGameStateChange() {

			// set user camera on game start
			if (GState.gameState === "playing" && prevGameState === "gameinfo") {

				spectators.forEach(s => {s.resetActionTimes(); });

			if (GState.gameState === "title" &&	prevGameState !== "title" && vrControlState.sessionActive) {

				setCamera(camSetting.type, true);

				&& prevGameState === "playing"

			}
	}


    // -----------------------------
    // Key Event Listeners
    // -----------------------------
    window.addEventListener("keydown", function(e) {

		// do not handle game events while chatting
		if (typeof OnlineChat !== "undefined" && OnlineChat.hasInputFocus()) {
			return;
		}

		// do not handle game events if any dialog open
		if (OnlineLobbyDialogs.shouldBlockGameInput() || OnlineInviteDialog.isOpen() ) {
			return;
		}

		keys[e.code] = true;
		let action;

		if (e.code === "KeyP") action = "pause";

		if (e.code === "Space") action = "go";
		
		handleGameState(action);

		// Handle keys for settings
		if (e.code === "KeyR") {
			camSetting.AngleX = clamp(camSetting.AngleX + 0.01, 0.25, Math.PI/2 - 0.1);
		}
		if (e.code === "KeyF") {
			camSetting.AngleX = clamp(camSetting.AngleX - 0.01, 0.25, Math.PI/2 - 0.1);
		}
		if (e.code === "KeyM") {
			soundMuted = !soundMuted;
		}
		if (e.code === "KeyG" ) { //set graphics level
			handleToogleGraphicsEvent();
		}
		if (e.code === "KeyC") {
			handleSwitchCameraEvent();
		}
		if (e.code === "KeyL") { // Hide or show spectators
			handleToogleSpectatorsEvent();
		}

		if (e.code === "KeyK") { // Hide or show shadows
			disposeSpotlights();
			shadowmaps = !shadowmaps;
			renderer.shadowMap.enabled = shadowmaps;
			if (spotLights.length === 0) {
                createSpotlights();
            }
		}

		if (GState.gameState === "title") {
			if (e.code === "ArrowUp" || e.code === "ArrowDown" || e.code === "ArrowLeft" || e.code === "ArrowRight") {
				manageKeyboardController(e.code);
			}
			if (e.code === "KeyH") {
				OnlineLobbyDialogs.showHostDialog();
			}
			if (e.code === "KeyJ") {
				OnlineLobbyDialogs.showJoinDialog();
			}
			if (event.code === "KeyI" && GState.gameState === "title" && NetworkManager.isHost() ) {
				handleInviteEvent();
				return;
			}			
			
		}

		if (event.code === "KeyT" && NetworkManager.isOnline() && !OnlineChat.hasInputFocus()) {
			event.preventDefault();
			event.stopPropagation();

			/*
			 * Browser pri držaní tlačidla generuje opakované
			 * keydown eventy. Timer spustíme iba pri prvom.
			 */
			if (event.repeat || OnlineChat.keyTHoldTimer !== null) {
				return;
			}

			OnlineChat.keyTLongPressTriggered = false;

			OnlineChat.keyTHoldTimer = setTimeout(() => {
				OnlineChat.keyTHoldTimer = null;
				OnlineChat.keyTLongPressTriggered = true;

				OnlineChat.toggleAutoShowIncoming();
			}, OnlineChat.keyTHoldTimeMs);

			return;
		}

    });

    window.addEventListener("keyup", function(e) {
		// do not handle game events if any dialog open
		if (typeof OnlineLobbyDialogs !== "undefined" && OnlineLobbyDialogs.shouldBlockGameInput()) {
			return;
		}

		if (event.code === "KeyT" && NetworkManager.isOnline() && !OnlineChat.hasInputFocus()) {
			event.preventDefault();
			event.stopPropagation();

			if (OnlineChat.keyTHoldTimer !== null) {
				clearTimeout(OnlineChat.keyTHoldTimer);
				OnlineChat.keyTHoldTimer = null;
			}

			/*
			 * Ak sa nespustilo dlhé podržanie, išlo o bežné
			 * krátke stlačenie a otvoríme chat.
			 */
			if (!OnlineChat.keyTLongPressTriggered) {
				OnlineChat.open(true, 5000);
			}

			OnlineChat.keyTLongPressTriggered = false;
			return;
		}

		keys[e.code] = false;
    });

	function manageKeyboardController(code) {
		// Nájdeme hráča, ktorý má aktuálne priradenú hlavnú sadu klávesov.
		let currentIndex = players.findIndex((player) => {
			return (
				player.isMainUser
			);
		});

		// Fallback, ak klávesnica momentálne nie je priradená žiadnemu hráčovi.
		// V online režime použijeme autoritatívny lokálny index z NetworkManagera, ak je už známy.
		if (currentIndex === -1) {
			if (NetworkManager.isOnline() && NetworkManager.localPlayerIndex !== null) {
				currentIndex = NetworkManager.localPlayerIndex;
			} else {
				currentIndex = 0;
			}
		}

		let direction = 0;

		switch (code) {
			case "ArrowDown":
				direction = 1;
				break;

			case "ArrowUp":
				direction = -1;
				break;

			case "ArrowLeft":
				break;

			case "ArrowRight":
				break;
				
			default:
				return;
		}

		let newIndex = currentIndex + direction;

		// Hľadáme najbližšieho dostupného hráča v zadanom smere.
		while (newIndex >= 0 && newIndex < players.length) {
			if (NetworkManager.isOnline()) {
				const onlinePlayer = NetworkManager.getOnlinePlayer(newIndex);

				// Index je dostupný, ak:
				// 1. nie je obsadený online hráčom, alebo
				// 2. je obsadený týmto lokálnym peerom.
				const isAvailable = !onlinePlayer || onlinePlayer.peerId === NetworkManager.peerId;

				if (isAvailable) {
					break;
				}
			} else {
				// V lokálnom režime zachováme pôvodné správanie. Najbližší index je dostupný.
				break;
			}

			newIndex += direction;
		}

		// V danom smere neexistuje dostupný Player.
		if (newIndex < 0 || newIndex >= players.length) {
			return;
		}

		// ==============================================================
		// V online režime je potrebné najprv zmeniť autoritatívne online priradenie.
		// ==============================================================
		if (NetworkManager.isOnline() && newIndex !== currentIndex) {
			mainUserControllerType = "keys";
			const requestAccepted = NetworkManager.changeLocalPlayerIndex(newIndex);
			if (!requestAccepted) {
				return;
			}

			if (NetworkManager.isGuest()) {
				// Guest lokálne zatiaľ nič nemení. Host požiadavku spracuje a odošle nový online-player-state. Po jeho prijatí sa
				// zavolá applyOnlineStateToPlayers(), ktorá  prenesie klávesnicu na nového Playera.
				return;
			}
			 // Host už zmenu vykonal autoritatívne. emitOnlinePlayersChanged() vo funkcii
			 // changeLocalPlayerIndex() by mal zavolať applyOnlineStateToPlayers().
			return;
		}

		// ==============================================================
		// Lokálny režim
		// ==============================================================
		const newPlayer = players[newIndex];
		
		assignControllerTypeToMainUser(newPlayer, "keys"); 

	}


	function assignControllerTypeToMainUser(newPlayer, controllerType) {
		if (!newPlayer) {
			return false;
		}

		if (
			controllerType !== "keys" &&
			controllerType !== "touch" &&
			controllerType !== "vr"
		) {
			return false;
		}

		mainUserControllerType = controllerType;

		const currentIndex = players.findIndex(player => {
			return player.isMainUser === true;
		});

		const currentPlayer =
			currentIndex >= 0
				? players[currentIndex]
				: null;

		/*
		 * Predchádzajúceho hlavného hráča vyčistíme,
		 * iba ak existuje a ide o iného hráča.
		 */
		if (currentPlayer && currentPlayer !== newPlayer) {
			currentPlayer.controlKeys = null;
			currentPlayer.isTouchControl = false;
			currentPlayer.isVrControl = false;
			currentPlayer.isMainUser = false;

			if (
				currentPlayer.gamepad === undefined ||
				currentPlayer.gamepad === null
			) {
				currentPlayer.isUser = false;

				const currentRing =
					currentPlayer.meshGroup.getObjectByName("ring");

				if (currentRing) {
					currentRing.visible = false;
				}
			}
		}

		/*
		 * Klávesnica, touch control a VR control
		 * nahrádzajú gamepad na cieľovom hráčovi.
		 */
		if (newPlayer.gamepad !== undefined && newPlayer.gamepad !== null) {
			newPlayer.unbindGamepad();
		}

		/*
		 * Tieto tri typy ovládania sa navzájom vylučujú.
		 */
		newPlayer.controlKeys = null;
		newPlayer.isTouchControl = false;
		newPlayer.isVrControl = false;

		if (controllerType === "keys") {
			newPlayer.controlKeys = controlKeysSet[0];
		}
		else if (controllerType === "touch") {
			newPlayer.isTouchControl = true;
		}
		else if (controllerType === "vr") {
			newPlayer.isVrControl = true;
		}

		newPlayer.isUser = true;
		newPlayer.isMainUser = true;

		const newRing =
			newPlayer.meshGroup.getObjectByName("ring");

		if (newRing) {
			newRing.visible = true;
		}

		return true;
	}
	

	function selectTouchControlledPlayer(playerIndex) {
		if (
			GState.gameState !== "title" ||
			!NetworkManager.validatePlayerIndex(playerIndex) ||
			!players[playerIndex]
		) {
			return;
		}

		const touchControlAvailable = 'ontouchstart' in window;

		const currentPlayerIndex = NetworkManager.isOnline()
			? NetworkManager.localPlayerIndex
			: players.findIndex(player => player.isMainUser);

		if (vrControlState.supported && playerIndex === currentPlayerIndex) {
			if (mainUserControllerType === "touch") {
				selectVRControlledPlayer(playerIndex);
				return;
			}

			if (mainUserControllerType === "vr" && touchControlAvailable) {
				setupTouchControlsForPlayer(players[playerIndex]);
				assignControllerTypeToMainUser(players[playerIndex], "touch");
				return;
			}
		}

		if (vrControlState.supported && mainUserControllerType === "vr") {
			selectVRControlledPlayer(playerIndex);
			return;
		}

		/*
		 * Bez touch podpory už nemožno pokračovať
		 * priradením touch ovládania.
		 */
		if (!touchControlAvailable) {
			return;
		}

		touchControlState.enabled = true;
		mainUserControllerType = "touch";

		if (NetworkManager.isOnline()) {
			touchControlState.pendingPlayerIndex = playerIndex;

			/*
			 * Ak ide o aktuálneho online hráča, nemeníme
			 * jeho index, iba typ lokálneho ovládania.
			 */
			if (playerIndex === NetworkManager.localPlayerIndex) {
				setupTouchControlsForPlayer(players[playerIndex]);
				assignControllerTypeToMainUser(players[playerIndex], "touch");
				touchControlState.pendingPlayerIndex = null;
				return;
			}

			/*
			 * Pri zmene online hráča musí nový index
			 * najprv autoritatívne potvrdiť host.
			 */
			const accepted = NetworkManager.changeLocalPlayerIndex(playerIndex);

			if (!accepted) {
				touchControlState.pendingPlayerIndex = null;
			}

			return;
		}

		/*
		 * V offline režime možno touch ovládanie
		 * priradiť okamžite.
		 */
		setupTouchControlsForPlayer(players[playerIndex]);
		assignControllerTypeToMainUser(players[playerIndex], "touch");
	}	


	function selectVRControlledPlayer(playerIndex) {
		if (
			!vrControlState.supported ||
			GState.gameState !== "title" ||
			!NetworkManager.validatePlayerIndex(playerIndex) ||
			!players[playerIndex]
		) {
			return false;
		}

		mainUserControllerType = "vr";

		if (NetworkManager.isOnline()) {
			/*
			 * Ak ide o aktuálneho lokálneho hráča,
			 * meníme iba lokálny typ controlleru.
			 */
			if (playerIndex === NetworkManager.localPlayerIndex) {
				assignControllerTypeToMainUser(players[playerIndex], "vr");
				setupTouchControlsForPlayer();

				return true;
			}

			/*
			 * Pri inom Player indexe musí zmenu najprv
			 * potvrdiť host.
			 *
			 * applyOnlineStateToPlayers() následne aplikuje
			 * mainUserControllerType === "vr".
			 */
			return NetworkManager.changeLocalPlayerIndex(playerIndex);
		}

		assignControllerTypeToMainUser(players[playerIndex], "vr");
		setupTouchControlsForPlayer();

		return true;
	}	


    // -----------------------------
    // 3D Setup (three.js Rendering)
    // -----------------------------
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 2000);
    const center3D = new THREE.Vector3(fieldWidth/2 + goalDepth, 0, fieldHeight/2  );

	camSetting.AngleX = Math.PI/6;
	camera.position.x = center3D.x;
	camera.position.y = camSetting.type0Distance * Math.sin(camSetting.AngleX);
	camera.position.z = center3D.z + camSetting.type0Distance * Math.cos(camSetting.AngleX);
    camera.lookAt(center3D);
	camSetting.lookAt.x = center3D.x;
	camSetting.lookAt.y = center3D.y;
	camSetting.lookAt.z = center3D.z;
	camSetting.distance = camSetting.type0Distance;
	
	initializeVrCameraRig();

    const renderer = new THREE.WebGLRenderer({antialias: true});
	
	renderer.xr.enabled = true;
	renderer.xr.setReferenceSpaceType("local-floor");
	renderer.xr.setFramebufferScaleFactor(1.0);
	//renderer.setPixelRatio(window.devicePixelRatio);
	renderer.setSize(window.innerWidth, window.innerHeight);
	renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap; //PCFSoftShadowMap;  PCFShadowMap;
    document.body.appendChild(renderer.domElement);

	//////////////////////////////////////////////////////////////////////////////////////////
    // 	Lights																				//
    //////////////////////////////////////////////////////////////////////////////////////////

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.15);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 0); // intensity 0 initially, enabled for low graphics
    directionalLight.position.set(0, 2, 1);
    scene.add(directionalLight);

    let spotLights = []; // Declare spotLights array in a wider scope
    let spotLightFront, spotLightGoalA, spotLightGoalB; // Declare other spotlights

    // --- Function to CREATE spotlights ---
    function createSpotlights() {

		// Spotlights variables
		const spotLightColor = 0xffffff;
		const spotLightIntensity = 1.2;
		const spotLightDistance = 1000;
		const spotLightAngle = Math.PI / 2.7;
		const spotLightPenumbra = 0.3;
		const spotLightDecay = 2;
		const lightOffset = -60;
		const lightYPosition = 300;

		const cornerPositions = [
			new THREE.Vector3(fieldOffsetX - lightOffset, lightYPosition, fieldHeight + lightOffset),
			new THREE.Vector3(fieldOffsetX + fieldWidth + lightOffset, lightYPosition, fieldHeight + lightOffset),
			new THREE.Vector3(fieldOffsetX - lightOffset, lightYPosition, -lightOffset),
			new THREE.Vector3(fieldOffsetX + fieldWidth + lightOffset, lightYPosition, -lightOffset)
		];

		const quadrantTargets = [
			new THREE.Vector3(fieldOffsetX + fieldWidth / 2, 0, fieldHeight / 2),
			new THREE.Vector3(fieldOffsetX + fieldWidth / 2, 0, fieldHeight / 2),
			new THREE.Vector3(fieldOffsetX + fieldWidth / 2, 0, fieldHeight / 2),
			new THREE.Vector3(fieldOffsetX + fieldWidth / 2, 0, fieldHeight / 2)
		];

        spotLights = []; // Clear existing array

        for (let i = 0; i < 4; i++) {
            const spotLight = new THREE.SpotLight(spotLightColor,spotLightIntensity, spotLightDistance, spotLightAngle, spotLightPenumbra, spotLightDecay);
            spotLight.position.copy(cornerPositions[i]);
            spotLight.target.position.copy(quadrantTargets[i]);
            scene.add(spotLight.target);
            spotLight.castShadow = true;
            spotLight.shadow.mapSize.width = 1024;
            spotLight.shadow.mapSize.height = 1024;
            spotLight.shadow.camera.near = 10;
            spotLight.shadow.camera.far = 1000;
            scene.add(spotLight);
            spotLights.push(spotLight);
        }

        // Add front spotlight
        spotLightFront = new THREE.SpotLight(spotLightColor, 1 * spotLightIntensity / 3, spotLightDistance, spotLightAngle, spotLightPenumbra, spotLightDecay);
        spotLightFront.position.set(fieldOffsetX + fieldWidth / 2, lightYPosition, fieldHeight / 3 + lightOffset + 500);
        spotLightFront.target.position.set(fieldOffsetX + fieldWidth / 2, 0, 0);
        spotLightFront.castShadow = false;
        scene.add(spotLightFront.target);
        scene.add(spotLightFront);
		spotLights.push(spotLightFront);

        // Add goals spotlights - keep them always, just adjust intensity
        spotLightGoalA = new THREE.SpotLight(0xFF0000, 0, 300, Math.PI / 6, spotLightPenumbra, spotLightDecay);

	function createHead(playerRadius, coneHeight, coneMaterial, detailLevel) {

      // Left eye
      const leftEye = new THREE.Mesh(eyeGeometry[detailLevel], eyeMaterial);

	  leftLidTop.rotation.set( 10 / 8 * Math.PI, lidSideRotation, 0);
      leftLidTop.name = "leftLidTop";
	  head.add(leftLidTop);

	  const leftLidBottom = new THREE.Mesh(lidGeometry[detailLevel], coneMaterial);
      leftLidBottom.position.set(leftEye.position.x, leftEye.position.y, leftEye.position.z);
	  leftLidBottom.rotation.set( -11 / 8 * Math.PI, -lidSideRotation, 0);
      leftLidBottom.name = "leftLidBottom";
      head.add(leftLidBottom);

      const leftPupil = new THREE.Mesh(pupilGeometry[detailLevel], pupilMaterial);
      leftPupil.position.set(leftEye.position.x, leftEye.position.y, leftEye.position.z + 0.2);
      leftPupil.rotation.set(0, 0, 0);
	  leftPupil.name = "leftPupil";
      head.add(leftPupil);

      // Right eye
      const rightEye = new THREE.Mesh(eyeGeometry[detailLevel], eyeMaterial);
      rightEye.position.set(playerRadius * eyeWidth, coneHeight * eyeHeight, playerRadius * eyeDepth);
      head.add(rightEye);

	  const rightLidTop = new THREE.Mesh(lidGeometry[detailLevel], coneMaterial);
      rightLidTop.position.set(rightEye.position.x, rightEye.position.y, rightEye.position.z);
	  rightLidTop.rotation.set( 10 / 8 * Math.PI, -lidSideRotation, 0);
      rightLidTop.name = "rightLidTop";
      head.add(rightLidTop);

	  const rightLidBottom = new THREE.Mesh(lidGeometry[detailLevel], coneMaterial);
      rightLidBottom.position.set(rightEye.position.x, rightEye.position.y, rightEye.position.z);
	  rightLidBottom.rotation.set( -11 / 8 * Math.PI, lidSideRotation, 0);
      rightLidBottom.name = "rightLidBottom";
