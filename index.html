<DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Wild Cones Hockey Tournament</title>
	<style>
	body { margin: 0; background: #222; overflow: hidden; }
	/* Overlay for title, score, timer, and messages */
	#overlay {
	  position: absolute;
	  top: 0; left: 0;
	  width: 100%;
	  pointer-events: none;
	  color: white;
	  font-family: Arial, sans-serif;
	  text-align: center;
	  z-index: 10;
	}
	</style>
	<style>
	#hud-container {
	  position: fixed;
	  top: 2vh;
	  left: 2vw;
	  background-color: rgba(0, 0, 0, 0.2);
	  color: white;
	  padding: clamp(0.5vh, 1vh, 2vh) clamp(1vw, 1.5vw, 3vw);
	  border-radius: clamp(0.5vh, 1vh, 2vh);
	  font-family: sans-serif;
	  font-size: clamp(8px, 1.5vh, 24px); /* bude mať vždy min 12px */
	  line-height: 1.2;
	  z-index: 1000;
	  pointer-events: none;
	  text-shadow: 0 0 5px black, 0 0 10px black;
	}

	#hud-container h2 {
	  font-size: clamp(14px, 2vh, 28px);
	  margin: clamp(0.5vh, 1vh, 2vh) 0;
	}

	#hud-container p {
	  margin: clamp(0.25vh, 0.5vh, 1vh) 0;
	}

	#controls-container {
	  position: fixed;
	  top: 30%;
	  left: 50%;
	  transform: translate(-50%, -30%);
	  background-color: rgba(0, 0, 0, 0.4);
	  color: white;
	  padding: 1vh 1.5vw;
	  border-radius: 1vh;
	  font-family: sans-serif;
	  font-size: 2.0vh; /* scales with window height */
	  line-height: 1.2;
	  z-index: 1000;
	  pointer-events: none;
	  text-shadow: 0 0 5px black, 0 0 10px black;
	}

	#controls-container h2 {
	  font-size: 2.5vh;
	  margin: 1vh 0;
	}

	#controls-container p {
	  font-size: 2vh;
	  margin: 0.5vh 0;
	}

	.touch-device #controls-container {
		top: 50%;
		left: 50%;
		right: auto;
		bottom: auto;
		transform: translate(-55%, -50%);

		width: max-content;
		max-width: 90vw;
		height: auto;
		max-height: 92vh;

		box-sizing: border-box;
		padding: 1vh 1.5vw;
		margin: 0;

		display: block;
		overflow-y: auto;
		pointer-events: auto;
	}


	.touch-zone {
	  position: fixed;
	  top: 0;
	  bottom: 0;
	  z-index: 1;
	  touch-action: none;
	}
	.move-zone {
	  left: 0;
	  width: 50vw;
	}
	.rotate-zone {
	  right: 0;
	  width: 50vw;
	}
	.touch-button {
		position: fixed;
		width: 40px;
		height: 40px;
		background: rgba(10, 10, 10, 0.20);
		border-radius: 50%;
		z-index: 10;
		touch-action: none;
	}
	.touch-button-label {
	  color: white;
	  font-family: sans-serif;
	  font-weight: normal;
	  font-size: 10px;
	  position: absolute;
	  top: 50%;
	  left: 50%;
	  transform: translate(-50%, -50%);
	  pointer-events: none; /* So touches still register on the button */
	}

	/* Join and Host frames */

	.online-dialog-backdrop {
		position: fixed;
		inset: 0;
		z-index: 5000;

		background: rgba(0, 0, 0, 0.72);
		font-family: sans-serif;
	}

	.online-dialog-backdrop[hidden] {
		display: none;
	}

	.online-dialog {
		position: fixed;
		top: 50%;
		left: 50%;
		transform: translate(-50%, -50%);

		box-sizing: border-box;
		width: 30vw;
		max-height: 90vh;
		overflow-y: auto;

		padding: 2vh 1.5vw;

		color: white;
		background: rgba(24, 24, 30, 0.96);

		border: 0.1vh solid rgba(255, 255, 255, 0.25);
		border-radius: 1vh;

		box-shadow:
			0 1vh 4vh rgba(0, 0, 0, 0.75),
			0 0 2vh rgba(255, 204, 51, 0.08);

		font-family: sans-serif;
		font-size: 1.6vh;
		line-height: 1.2;
	}

	.online-join-dialog {
		width: 40vw;
	}

	.online-dialog h2 {
		margin: 0 0 2vh 0;

		color: #FF4D00;
		font-size: 2.8vh;
		font-weight: normal;
		text-align: center;
	}

	.online-dialog label {
		display: block;
		margin: 1.2vh 0 0.5vh 0;

		color: #eeeeee;
		font-size: 1.6vh;
	}

	.online-dialog input[type="text"] {
		box-sizing: border-box;
		width: 100%;

		padding: 1vh 0.8vw;

		color: white;
		background: #151515;

		border: 0.1vh solid #666666;
		border-radius: 0.6vh;

		font-family: sans-serif;
		font-size: 1.7vh;
		outline: none;
	}

	.online-dialog input[type="text"]:focus {
		border-color: #FF4D00;
		box-shadow: 0 0 0 0.2vh rgba(255, 204, 51, 0.15);
	}

	.online-checkbox-row {
		display: flex !important;
		align-items: center;

		gap: 0.6vw;
		margin-top: 1.5vh !important;

		font-size: 1.6vh;
		cursor: pointer;
	}

	.online-checkbox-row input[type="checkbox"] {
		width: 1.8vh;
		height: 1.8vh;
	}

	.online-dialog-buttons {
		display: flex;
		justify-content: flex-end;

		gap: 0.8vw;
		margin-top: 2vh;
	}

	.online-dialog button {
		padding: 1vh 1vw;

		color: #111111;
		background: #FF4D00;

		border: 0;
		border-radius: 0.6vh;

		font-family: sans-serif;
		font-size: 1.5vh;
		font-weight: bold;
		cursor: pointer;
	}

	.online-dialog button:hover {
		filter: brightness(1.1);
	}

	.online-dialog button:disabled {
		cursor: default;
		filter: none;
		opacity: 0.5;
	}

	.online-dialog .online-secondary-button {
		color: white;
		background: #555555;
	}

	.online-dialog .online-small-button {
		padding: 0.7vh 0.7vw;
		font-size: 1.3vh;
	}

	.online-dialog-message {
		min-height: 2vh;
		margin-top: 1.2vh;

		color: #ff8b8b;
		font-size: 1.4vh;
	}

	.online-dialog-message.online-success {
		color: #7cff9b;
	}

	.online-room-list-header {
		display: flex;
		align-items: center;
		justify-content: space-between;

		margin-top: 2vh;
		margin-bottom: 0.6vh;

		color: #eeeeee;
		font-size: 1.5vh;
	}

	.online-room-list {
		max-height: 28vh;
		overflow-y: auto;

		background: #121212;

		border: 0.1vh solid #555555;
		border-radius: 0.6vh;
	}

	.online-room-row {
		display: grid;
		grid-template-columns: 1fr auto auto;
		gap: 0.8vw;
		align-items: center;

		padding: 1vh 0.8vw;

		border-bottom: 0.1vh solid #333333;
		cursor: pointer;
	}

	.online-room-row:last-child {
		border-bottom: 0;
	}

	.online-room-row:hover {
		background: rgba(255, 204, 51, 0.14);
	}

	.online-room-name {
		color: #ffdd66;
		font-size: 1.5vh;
		font-weight: bold;
		overflow-wrap: anywhere;
	}

	.online-room-host,
	.online-room-count {
		color: #cccccc;
		font-size: 1.3vh;
	}

	.online-room-count {
		white-space: nowrap;
	}

	.online-room-list-info {
		padding: 1.5vh 1vw;

		color: #aaaaaa;
		font-size: 1.4vh;
		text-align: center;
	}

	/* Online connection */

	.online-connection-frame {
		position: fixed;
		top: 2vh;
		right: 2vw;
		left: auto;
		bottom: auto;
		z-index: 4500;

		box-sizing: border-box;
		max-width: 35vw;

		padding: 1vh 1.5vw;

		color: white;
		background-color: rgba(0, 0, 0, 0.2);

		border: none;
		border-radius: 1vh;
		box-shadow: none;

		font-family: sans-serif;
		font-size: 1.5vh;
		line-height: 1.2;

		pointer-events: none;
		text-shadow: 0 0 5px black, 0 0 10px black;
	}

	.online-connection-frame[hidden] {
		display: none;
	}

	.online-connection-frame strong {
		color: #FF4D00;
		font-size: 1.7vh;
		font-weight: normal;
	}

	/* Online Chat */

	.online-chat-frame {
		position: fixed;
		top: 14vh;
		left: 2vw;
		z-index: 4600;

		box-sizing: border-box;
		width: 28vw;
		max-height: 34vh;

		padding: 1vh 1vw;

		color: white;
		background-color: rgba(0, 0, 0, 0.2);

		border-radius: 1vh;

		font-family: sans-serif;
		font-size: 1.5vh;
		line-height: 1.2;

		text-shadow: 0 0 5px black, 0 0 10px black;
	}

	.online-chat-frame[hidden] {
		display: none;
	}

	.online-chat-frame input {
		box-sizing: border-box;
		width: 100%;

		padding: 0.8vh 0.7vw;
		margin-bottom: 0.8vh;

		color: white;
		background-color: rgba(0, 0, 0, 0.55);

		border: 0.1vh solid rgba(255, 255, 255, 0.35);
		border-radius: 0.5vh;

		font-family: sans-serif;
		font-size: 1.5vh;
		text-shadow: none;
		outline: none;
	}

	.online-chat-frame input:focus {
		border-color: #FF4D00;
	}

	.online-chat-messages {
		display: flex;
		flex-direction: column;
		gap: 0.35vh;

		max-height: 25vh;
		overflow-y: auto;

		overflow-wrap: anywhere;
	}

	.online-chat-message {
		color: white;
	}

	.online-chat-player-name {
		font-weight: bold;
	}
	
	.online-chat-time {
		color: white;
		font-weight: normal;
	}

	@media (max-width: 800px) {
		.online-chat-frame {
			width: 50vw;
		}
	}

	#inviteFullscreenButton {
		position: fixed;
		top: 50%;
		left: 50%;
		transform: translate(-50%, -50%);
		z-index: 6000;
		padding: 2vh 4vw;
		color: white;
		background: rgba(200, 40, 40, 0.9);
		border: 0;
		border-radius: 1vh;
		font-family: sans-serif;
		font-size: 3vh;
		font-weight: bold;
		cursor: pointer;
	}

	#versionInfoContainer {
		position: fixed;
		right: 1.5vw;
		bottom: 1.5vh;
		z-index: 5001;
		margin: 0;
		padding: 0.5em 0.8em;
		color: white;
		background: rgba(0, 0, 0, 0.2);
		border-radius: 0.4em;
		font-size: 1.4vmin;
		line-height: 0.5;
		text-align: right;
		pointer-events: none;
	}
	
	.touch-device #versionInfoContainer {
		right: 140px;
		bottom: 2vh;
		font-size: 2.0vmin;
	}

	#controls-container,
	#hud-container,
	.touch-button,
	.touch-button-label,
	#touchMoveZone,
	#touchRotateZone {
		-webkit-user-select: none;
		user-select: none;
		-webkit-touch-callout: none;
	}
	
	.touch-device .online-dialog {
		zoom: 2.0;
		max-width: 64vw;
		max-height: 65vh;
		overflow-y: auto;
	}	

	</style>

	<!-- Load three.js -->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="touchMoveZone" class="touch-zone move-zone" style="display: none;"></div>
  <div id="touchRotateZone" class="touch-zone rotate-zone" style="display: none;"></div>
  <div id="touchStrategyButton" class="touch-button" style="display: none; bottom: 20px; left: 40px;"><span class="touch-button-label">Strategy</span></div>
  <div id="touchPauseButton" class="touch-button" style="display: none; bottom: 20px; right: 20px;"><span class="touch-button-label">Pause</span></div>

  <div id="touchStartVrButton" class="touch-button" style="display: none; width: 60px; height: 60px; background: rgba(255, 80, 80, 0.5); bottom: 20px; right: 140px;">
	<span class="touch-button-label" style="font-size: 12px; text-align: center; text-shadow: -1px -1px 1px black, 1px -1px 1px black, -1px 1px 1px black, 1px 1px 1px black;">Start VR</span>
  </div>
  <div id="touchGraphicsButton" class="touch-button" style="display: none; top: 10px; right: 20px;"><span class="touch-button-label">Graph</span></div>
  <div id="touchCameraButton" class="touch-button" style="display: none; top: 60px; right: 20px;"><span class="touch-button-label">Cam</span></div>
  <div id="overlay"></div>

	<!-- =============================================================== -->
	<!-- Wild Cones online lobby dialogs                                 -->
	<!-- =============================================================== -->

	<div id="onlineHostDialog" class="online-dialog-backdrop" hidden>
		<div class="online-dialog">
			<h2>Host online game</h2>

			<label for="onlineHostPlayerName">
				Player name
			</label>

			<input
				id="onlineHostPlayerName"
				type="text"
				maxlength="20"
				autocomplete="nickname"
				placeholder="Player name">

			<label for="onlineHostRoomName">
				Room name
			</label>

			<input
				id="onlineHostRoomName"
				type="text"
				maxlength="32"
				autocomplete="off"
				placeholder="Room name or token">

			<label class="online-checkbox-row">
				<input
					id="onlineHostPublic"
					type="checkbox"
					checked>

				Public room
			</label>

			<div
				id="onlineHostDialogMessage"
				class="online-dialog-message">
			</div>

			<div class="online-dialog-buttons">
				<button
					id="onlineHostGameButton"
					type="button">
					Host Game
				</button>

				<button
					id="onlineHostCancelButton"
					type="button"

				</button>
			</div>

	</div>


	<div id="onlineJoinDialog" class="online-dialog-backdrop" hidden>
		<div class="online-dialog online-join-dialog">
			<h2>Join online game</h2>

			<label for="onlineJoinPlayerName">
				Player name
			</label>

			<input
				id="onlineJoinPlayerName"
				type="text"
				maxlength="20"
				autocomplete="nickname"
				placeholder="Player name">

			<label for="onlineJoinRoomName">
				Room name or private token
			</label>

			<input
				id="onlineJoinRoomName"
				type="text"
				maxlength="32"
				autocomplete="off"
				placeholder="Room name">

			<div class="online-room-list-header">
				<span>Public rooms</span>

				<button
					id="onlineRefreshRoomsButton"
					type="button"
					class="online-small-button">
					Refresh
				</button>
			</div>

			<div id="onlinePublicRoomList" class="online-room-list">
				<div class="online-room-list-info">
					Public room list has not been loaded.
				</div>
			</div>

			<div
				id="onlineJoinDialogMessage"
				class="online-dialog-message">
			</div>

			<div class="online-dialog-buttons">
				<button
					id="onlineJoinGameButton"
					type="button">
					Join Game
				</button>

				<button
					id="onlineJoinCancelButton"
					type="button"
					class="online-secondary-button">
					Cancel
				</button>
			</div>
		</div>
	</div>

	<div id="onlineConnectionFrame" class="online-connection-frame" hidden>
	</div>

	<div id="onlineChatFrame" class="online-chat-frame" hidden>
		<input
			id="onlineChatInput"
			type="text"
			maxlength="160"
			autocomplete="off"
			placeholder="Type a message and press Enter">

		<div id="onlineChatMessages" class="online-chat-messages"></div>
	</div>

	<div id="onlineInviteDialog" class="online-dialog-backdrop" hidden>
		<div class="online-dialog">
			<h2>Invite player</h2>

			<label for="onlineInvitePlayerName">
				Player name
			</label>

			<input
				id="onlineInvitePlayerName"
				type="text"
				maxlength="20"
				autocomplete="off"
				autocapitalize="words"
				placeholder="Invited player name">

			<label for="onlineInviteEmail">
				Email address
			</label>

			<input
				id="onlineInviteEmail"
				type="text"
				maxlength="100"
				autocomplete="email"
				autocapitalize="none"
				autocorrect="off"
				spellcheck="false"
				placeholder="player@example.com">

			<div id="onlineInviteDialogMessage" class="online-dialog-message"></div>

			<div class="online-dialog-buttons">
				<button id="onlineInviteButton" type="button">
					Invite
				</button>

				<button id="onlineInviteCancelButton" type="button" class="online-secondary-button">
					Close
				</button>
			</div>
		</div>
	</div>
	
	<button id="inviteFullscreenButton" type="button" hidden>
		Join Fullscreen
	</button>

  <script>
    // -----------------------------
    // Helper Functions
    // -----------------------------
    function distance(x1, y1, x2, y2) {
      return Math.hypot(x2 - x1, y2 - y1);
    }

    function clamp(val, min, max) {
      return Math.max(min, Math.min(max, val));
    }

    function rotatePoint(x, y, angle) {
      return {
        x: x * Math.cos(angle) - y * Math.sin(angle),
        y: x * Math.sin(angle) + y * Math.cos(angle)
      };
    }

    function limitSpeed(circle, maxSpeed) {
      let speed = Math.hypot(circle.vx, circle.vy);
      if (speed > maxSpeed) {
        circle.vx = (circle.vx / speed) * maxSpeed;
        circle.vy = (circle.vy / speed) * maxSpeed;
      }
    }

    function normalizeAngle(angle) {
      while (angle > Math.PI) angle -= 2 * Math.PI;
      while (angle < -Math.PI) angle += 2 * Math.PI;
      return angle;
    }

    function lerp(start, end, t) {	// Linear interpolation helper function
	  return start + (end - start) * t;
    }

	function lerp3(start, end, t) { // Linear interpolation for THREE.Vector3
      const result = new THREE.Vector3();
      result.x = lerp(start.x, end.x, t);
      result.y = lerp(start.y, end.y, t);
      result.z = lerp(start.z, end.z, t);
      return result;
    }

	function getLineSegmentIntersection(p1x, p1y, p2x, p2y, p3x, p3y, p4x, p4y) {
	  const s1x = p2x - p1x;
	  const s1y = p2y - p1y;
	  const s2x = p4x - p3x;
	  const s2y = p4y - p3y;

	  const denominator = (-s2x * s1y + s1x * s2y);
	  if (denominator === 0) return null; // Parallel or collinear

	  const s = (-s1y * (p1x - p3x) + s1x * (p1y - p3y)) / denominator;
	  const t = ( s2x * (p1y - p3y) - s2y * (p1x - p3x)) / denominator;

	  if (t >= 0 && t <= 1 && s >= 0 && s <= 1) {
		// Collision detected
		return {
		  x: p1x + (t * s1x),
		  y: p1y + (t * s1y),
		  tPuck: t,  // Parameter along puck's path
		  tStick: s  // Parameter along stick's segment
		};
	  }
	  return null; // No collision
	}

	function pointToSegmentDist(px, py, x1, y1, x2, y2) {
		let dx = x2 - x1, dy = y2 - y1;
		let len2 = dx*dx + dy*dy;
		if (len2 === 0) return Math.hypot(px - x1, py - y1);

		let t = ((px - x1) * dx + (py - y1) * dy) / len2;
		t = Math.max(0, Math.min(1, t));
		let sx = x1 + t * dx;
		let sy = y1 + t * dy;
		return Math.hypot(px - sx, py - sy);
	}


    // Global Constants & Variables
    // -----------------------------
	const gameVersion = "0.65";
	const DEBUG_ENABLED = false;
	const DEBUG_INFO = false;
	const DEBUG_AI_DISABLED = false;
	const AI_NN_ENABLE = false;
	const FPS_TARGET = 60;
    const fieldWidth = 800;
    const fieldHeight = 600;
    const goalDepth = 40;
    const fieldOffsetX = goalDepth;
    const fieldOffsetY = 0;
    const bevel = fieldWidth / 8; // 100 pixels
    const WIDTH = 880;
    const HEIGHT = 600;
    const friction = 0.98;
    const goalHeight = 120;
    const goalY = (fieldHeight - goalHeight) / 2;
	const goalCenterY = goalY + goalHeight / 2;
	const puckRadius = 8;
	const PLAYER_ROT_ACC = 0.2;
	const MAX_SHOOT_ROT_SPEED = 0.2;
	const PLAYER_ACC = 0.4;
	const PLAYER_MAX_SPEED = 3;
	const PUCK_MAX_SPEED = 12;
	const MSG_TIME = 2000;
	const MATCH_DURATION = 300;  // in seconds, default 300

	const strategies = [ "Defensive play", "Normal play", "Offensive play" ];
	const MEAN_TIME_WINK = 3000 * 2;
	const MEAN_TIME_SCAN = 15000 * 2;
	const MEAN_TIME_SQUINT = 15000 * 2;
	const SADNESS_TRESHOLD = 5;		// goal difference at which players become depressed
	const EYES_ANGLE_MAX = Math.PI / 3;
	const HEAD_ANGLE_MAX = Math.PI / 3;
	const EYES_ROT_SPEED_MAX = 0.1;  // units per frame
	const HEAD_ROT_SPEED_MAX = 0.3;  // units per frame
	const GOAL_LIGHT_INTENSITY = 1;
    const CAM_PAN_SPEED_MAX = 0.5;
    const CAM_ZOOM_SPEED_MAX = 0.5;
    const CAM_PAN_TRESHOLD = 100;
	const SPECT_MAIN_RATE = 0.5;	// rate of spectators for main tribunes

	async function detectVrSupport() {
		vrControlState.supported = false;

		if (!navigator.xr || typeof navigator.xr.isSessionSupported !== "function") {
			return false;
		}

		const userAgent = navigator.userAgent.toLowerCase();

		const isStandaloneVrBrowser =
			userAgent.includes("oculusbrowser") ||
			userAgent.includes("oculus") ||
			userAgent.includes("quest") ||
			userAgent.includes("pico") ||
			userAgent.includes("vive");

		const isWindowsDesktop =
			navigator.platform.toLowerCase().includes("win") ||
			userAgent.includes("windows");

		if (!isStandaloneVrBrowser && !isWindowsDesktop) {
			return false;
		}

		try {
			vrControlState.supported = await navigator.xr.isSessionSupported("immersive-vr");
		} catch (error) {
			console.warn("VR support detection failed:", error);
			vrControlState.supported = false;
		}

		const startVrButton = document.getElementById("touchStartVrButton");
		
		if (!vrControlState.supported) {

			if (startVrButton) {
				startVrButton.style.display = "none";
			}		

			return false;
		}
		
		vrControlState.agentType = getVrAgentType();		

		mainUserControllerType = "vr";

		let mainUserIndex = players.findIndex(player => {
			return player.isMainUser === true;
		});

		if (
			NetworkManager.isOnline() &&
			NetworkManager.localPlayerIndex !== null
		) {
			mainUserIndex = NetworkManager.localPlayerIndex;
		}

		if (mainUserIndex >= 0 && players[mainUserIndex]) {
			selectVRControlledPlayer(mainUserIndex);
		}
		
		if (startVrButton) {
			startVrButton.style.display = "block";
		}		

		console.log("VR headset with immersive VR support detected.");

		return true;
	}

	
	function getVrAgentType() {
		const userAgent = navigator.userAgent.toLowerCase();

		const isStandaloneVr =
			userAgent.includes("oculusbrowser") ||
			userAgent.includes("oculus") ||
			userAgent.includes("quest") ||
			userAgent.includes("pico") ||
			userAgent.includes("vive");

		if (isStandaloneVr) {
			return "standalone";
		}

		if (userAgent.includes("windows") || navigator.platform.toLowerCase().includes("win")) {
			return "windows";
		}

		return null;
	}	
	
	
	function applyVrGraphicsDefaults() {
		if (vrControlState.agentType === "standalone") {
			graphicsLevel = 0;
			setGraphicsLevel(graphicsLevel);
			
			spectatorsVisible = false;
			setSpectatorsVisible(spectatorsVisible);

		} else if (vrControlState.agentType === "windows") {
			graphicsLevel = 1;
			setGraphicsLevel(graphicsLevel);
			
			spectatorsFrozen = true;
			setSpectatorsFrozen(spectatorsFrozen);

			spectatorsVisible = false;
			setSpectatorsVisible(spectatorsVisible);
		}
	}

	function getVrThumbstick(gamepad) {
		if (!gamepad || gamepad.axes.length < 2) {
			return {
				x: 0,
				y: 0
			};
		}

		const axisIndex = gamepad.axes.length - 2;

		let x = gamepad.axes[axisIndex] || 0;
		let y = gamepad.axes[axisIndex + 1] || 0;

		x = Math.abs(x) < gpDeadZone ? 0 : x;
		y = Math.abs(y) < gpDeadZone ? 0 : y;

		return {
			x: clamp(x, -1, 1),
			y: clamp(y, -1, 1)
		};
	}
	
	function updateVrInputSources() {
		vrControlState.leftInputSource = null;
		vrControlState.rightInputSource = null;

		if (
			typeof renderer === "undefined" ||
			!renderer.xr ||
			typeof renderer.xr.getSession !== "function"
		) {
			return null;
		}

		const session = renderer.xr.getSession();

		if (!session) {
			vrControlState.sessionActive = false;
			return null;
		}

		vrControlState.sessionActive = true;

		for (const inputSource of session.inputSources) {
			if (!inputSource.gamepad) {
				continue;
			}

			if (inputSource.handedness === "left") {
				vrControlState.leftInputSource = inputSource;
			}

			if (inputSource.handedness === "right") {
				vrControlState.rightInputSource = inputSource;
			}
		}

		return session;
	}
	
	const vrCameraForward = new THREE.Vector3();
	const vrCameraRight = new THREE.Vector3();
	const vrWorldUp = new THREE.Vector3(0, 1, 0);
	
	function transformVrStickByView(stick) {
		const xrCamera = renderer.xr.getCamera(camera);

		xrCamera.getWorldDirection(vrCameraForward);

		/*
		 * Odstránime vertikálnu zložku pohľadu.
		 * Pohyb hráča zostáva v rovine ihriska.
		 */
		vrCameraForward.y = 0;

		if (vrCameraForward.lengthSq() < 0.0001) {
			vrCameraForward.set(0, 0, -1);
		} else {
			vrCameraForward.normalize();
		}

		/*
		 * Pravý smer kamery v horizontálnej rovine.
		 */
		vrCameraRight
			.crossVectors(vrCameraForward, vrWorldUp)
			.normalize();

		/*
		 * Thumbstick má pri pohybe dopredu obvykle Y = -1.
		 */
		const forwardInput = -stick.y;
		const rightInput = stick.x;

		return {
			x:
				vrCameraRight.x * rightInput +
				vrCameraForward.x * forwardInput,

			y:
				vrCameraRight.z * rightInput +
				vrCameraForward.z * forwardInput
		};
	}	

	function handleVrInput(player) {
		if (!player || !player.isVrControl || !player.isMainUser) {
			return;
		}

		const session = updateVrInputSources();

		if (!session) {
			return;
		}

		const leftGamepad = vrControlState.leftInputSource?.gamepad;
		const rightGamepad = vrControlState.rightInputSource?.gamepad;

		const leftStick = getVrThumbstick(leftGamepad);
		const rightStick = getVrThumbstick(rightGamepad);

		const moveInput = transformVrStickByView(leftStick);
		const rotateInput = transformVrStickByView(rightStick);

		// Ľavý stick: pohyb vzhľadom na smer pohľadu.
		player.controlInput.movex = moveInput.x;
		player.controlInput.movey = moveInput.y;

		// Pravy stick - rotacia hraca
		player.controlInput.rotX = rotateInput.x;
		player.controlInput.rotY = rotateInput.y;

		const rightStickLength = Math.hypot(rightStick.x, rightStick.y);

		if (rightStickLength > gpMinZone) {
			const angleToTarget = Math.atan2(rotateInput.y, rotateInput.x) - Math.PI / 2;
			player.controlInput.rotate = clamp(normalizeAngle(angleToTarget - player.angle) * 2, -1, 1);
		} else {
			player.controlInput.rotate = 0;
		}

		// Lavy trigger - boost
		const leftTriggerPressed = leftGamepad?.buttons[0]?.pressed === true;
		player.controlInput.boost = leftTriggerPressed ? 1 : 0;
		
		// Pravy trigger - stick lift
		const rightTriggerPressed = rightGamepad?.buttons[0]?.pressed === true;
		player.controlInput.lift = rightTriggerPressed ? 1 : 0;

		//Strategy button
		const strategyButtonPressed = rightGamepad?.buttons[5]?.pressed === true;

		if (strategyButtonPressed && !vrControlState.strategyPressed) {
			player.controlInput.strategy = 1;
			vrControlState.strategyPressed = true;
		}

		if (!strategyButtonPressed) {
			vrControlState.strategyPressed = false;
		}
	}	
	

	function handleVrSessionButtons() {
		if (!vrControlState.sessionActive) {
			return;
		}

		updateVrInputSources();

		const leftGamepad = vrControlState.leftInputSource?.gamepad;
		const rightGamepad = vrControlState.rightInputSource?.gamepad;

		// Start button
		const startPressed = rightGamepad?.buttons[4]?.pressed === true;

		if (startPressed && !vrControlState.startPressed) {
			handleGameState("go");
		}

		vrControlState.startPressed = startPressed;

		// Pause button
		const pausePressed = leftGamepad?.buttons[5]?.pressed === true;

		if (pausePressed && !vrControlState.pausePressed) {
			handleGameState("pause");
		}

		vrControlState.pausePressed = pausePressed;

		// Camera change button
		const cameraPressed = leftGamepad?.buttons[4]?.pressed === true;

		if (cameraPressed && !vrControlState.cameraPressed) {
			switchCamera();
			applyVrCameraChange();
		}

		vrControlState.cameraPressed = cameraPressed;
		
		const leftThumbstickPressed = leftGamepad?.buttons[3]?.pressed === true;
		const rightThumbstickPressed = rightGamepad?.buttons[3]?.pressed === true;
		const bothThumbsticksPressed = leftThumbstickPressed && rightThumbstickPressed;

		if (bothThumbsticksPressed) {
			if (vrControlState.thumbsticksHoldStartedAt === null) {
				vrControlState.thumbsticksHoldStartedAt = performance.now();
			}

			const holdTime = performance.now() - vrControlState.thumbsticksHoldStartedAt;

			if (
				holdTime >= vrControlState.thumbsticksRecenterHoldMs &&
				!vrControlState.thumbsticksRecenterTriggered
			) {
				vrControlState.thumbsticksRecenterTriggered = true;
				vrControlState.recenterPending = true;
				vrControlState.recenterDelayFrames = 2;

				msgText = "VR view recentered";
				msgExpireTime = Date.now() + MSG_TIME;
			}
		} else {
			vrControlState.thumbsticksHoldStartedAt = null;
			vrControlState.thumbsticksRecenterTriggered = false;
		}		
	}

	async function startVrSession() {
		if (
			!vrControlState.supported ||
			vrControlState.sessionActive ||
			vrControlState.sessionStarting
		) {
			return false;
		}

		if (!navigator.xr || !renderer.xr) {
			return false;
		}

		vrControlState.sessionStarting = true;

		try {
			const session = await navigator.xr.requestSession(
				"immersive-vr",
				{
					requiredFeatures: ["local-floor"],
					optionalFeatures: ["bounded-floor"]
				}
			);
			
			renderer.xr.setReferenceSpaceType("local-floor");

			await renderer.xr.setSession(session);
			
			if (
				session.supportedFrameRates &&
				Array.from(session.supportedFrameRates).includes(72) &&
				typeof session.updateTargetFrameRate === "function"
			) {
				try {
					await session.updateTargetFrameRate(72);
					console.log("XR target frame rate set to 72 Hz.");
				} catch (error) {
					console.warn("Unable to set XR frame rate:", error);
				}
			}			

			const referenceSpace = renderer.xr.getReferenceSpace();

			if (referenceSpace) {
				referenceSpace.addEventListener("reset", handleVrReferenceSpaceReset);
				vrControlState.referenceSpace = referenceSpace;
			}

			vrControlState.sessionActive = true;
			vrControlState.sessionStarting = false;

			session.addEventListener("end", handleVrSessionEnded, {
				once: true
			});

			console.log("Immersive VR session started.");
			
			return true;
		} catch (error) {
			vrControlState.sessionStarting = false;
			vrControlState.sessionActive = false;

			console.error("Unable to start immersive VR:", error);

			if (
				typeof NetworkManager !== "undefined" &&
				typeof NetworkManager.showGameMessage === "function"
			) {
				NetworkManager.showGameMessage(
					"Unable to start VR mode."
				);
			}
			return false;
		}
	}

	
	function enterVrCameraMode() {
		const cameraRig = vrControlState.cameraRig;

		if (!cameraRig) {
			return;
		}

		// Zapamätáme si pôvodného rodiča kamery.
		vrControlState.desktopCameraParent = camera.parent;

		// Kameru vložíme do XR rigu.
		cameraRig.add(camera);

		/*
		 * Lokálna transformácia kamery musí byť nulová.
		 * WebXR na ňu aplikuje pozíciu a rotáciu hlavy.
		 */
		camera.position.set(0, 0, 0);
		camera.quaternion.identity();
		camera.scale.set(1, 1, 1);

		/*
		 * Pozíciu a základný smer pohľadu nastavuje rig
		 * podľa kamery typu 2 alebo 3.
		 */
		cameraRig.scale.set(1, 1, 1);
		positionVrCameraRig();

		cameraRig.updateMatrixWorld(true);
		camera.updateMatrixWorld(true);

		/*
		 * Recenter sa vykoná, keď už bude dostupný
		 * platný XR pose headsetu.
		 */
		if (vrControlState.agentType === "standalone") {
			vrControlState.recenterPending = true;
			vrControlState.recenterDelayFrames = 2;
		} else {
			vrControlState.recenterPending = false;
			vrControlState.recenterDelayFrames = 0;
		}
	}
	

	const vrRecenterForward = new THREE.Vector3();
	const vrRecenterTarget = new THREE.Vector3();

	function recenterVrView() {
		if (!vrControlState.sessionActive || !vrControlState.cameraRig) {
			return false;
		}

		const xrCamera = renderer.xr.getCamera(camera);
		xrCamera.getWorldDirection(vrRecenterForward);
		vrRecenterForward.y = 0;

		if (vrRecenterForward.lengthSq() < 0.0001) {
			return false;
		}

		vrRecenterForward.normalize();

		if (camSetting.type === 2) {
			vrRecenterTarget.set(1, 0, 0);
		}
		else if (camSetting.type === 3) {
			vrRecenterTarget.set(-1, 0, 0);
		}
		else if (camSetting.type === 0 || camSetting.type === 1) {
			vrRecenterTarget.set(0, 0, -1);
		}
		else {
			return false;
		}

		const currentYaw = Math.atan2(vrRecenterForward.x, vrRecenterForward.z);
		const targetYaw = Math.atan2(vrRecenterTarget.x, vrRecenterTarget.z);
		const yawCorrection = normalizeAngle(targetYaw - currentYaw);

		vrControlState.cameraRig.rotateY(yawCorrection);
		vrControlState.cameraRig.updateMatrixWorld(true);

		return true;
	}
	

	function handleVrReferenceSpaceReset() {
		console.log("[VR] Reference space reset event received.");
		
		if (!vrControlState.sessionActive) {
			return;
		}

		/*
		 * Po systémovom recentri počkáme na nový stabilný
		 * XR pose a potom dorovnáme cameraRig.
		 */

		vrControlState.recenterPending = true;
		vrControlState.recenterDelayFrames = vrControlState.agentType === "windows" ? 8 : 3;
	}


	function positionVrCameraRig() {
		const cameraRig = vrControlState.cameraRig;

		if (!cameraRig) {
			return;
		}

		cameraRig.quaternion.identity();
		cameraRig.rotation.set(0, 0, 0);

		const fieldCenterX = fieldOffsetX + fieldWidth / 2;
		const fieldCenterZ = fieldHeight / 2;

		/*
		 * Vzdialenosť kamery za vlastnou bránou
		 * a výška očí nad ihriskom.
		 */
		const distanceBehindGoal = 200;
		const cameraHeight = 200;
		
		if (camSetting.type === 2) {
			/*
			 * Kamera za bránou teamA na strane s nižším X. Pozerá smerom k teamB.
			 */
			cameraRig.position.set(
				fieldOffsetX - distanceBehindGoal - 50,
				cameraHeight + 50,
				fieldCenterZ
			);
		}
		else if (camSetting.type === 3) {
			/*
			 * Kamera za bránou teamB na strane s vyšším X. Pozerá smerom k teamA.
			 */
			cameraRig.position.set(
				fieldOffsetX + fieldWidth + distanceBehindGoal + 50,
				cameraHeight + 50,
				fieldCenterZ
			);
		}
		else if (camSetting.type === 0 || camSetting.type === 1) {
			/*
			 * Kamera v strede tribuny medzi branami
			 */
			cameraRig.position.set(
				fieldCenterX,
				cameraHeight + 100,
				fieldHeight + distanceBehindGoal + 100
			);
		}
		else {
			/*
			 * Bezpečný fallback, ak VR režim dostane iný typ kamery.
			 */
			cameraRig.position.set(
				fieldCenterX,
				cameraHeight,
				fieldCenterZ + fieldHeight
			);
		}
		 
		if (camSetting.type === 2) {
			// Kamera za bránou teamA sa pozerá smerom +X.
			cameraRig.rotation.set(0, -Math.PI / 2, 0);
		}
		else if (camSetting.type === 3) {
			// Kamera za bránou teamB sa pozerá smerom -X.
			cameraRig.rotation.set(0, Math.PI / 2, 0);
		}
		else if (camSetting.type === 0 || camSetting.type === 1) {
			// Kamera z tribúny na vyššej Z strane sa pozerá smerom -Z.
			cameraRig.rotation.set(0, 0, 0);
		}

		if (vrControlState.agentType === "windows") {
			cameraRig.rotation.y = normalizeAngle(cameraRig.rotation.y + Math.PI);
		}

		cameraRig.updateMatrixWorld(true);

	}	
	
	
	function applyVrCameraChange() {
		if (!vrControlState.sessionActive) {
			return;
		}

		positionVrCameraRig();
		positionVrHudAboveOppositeStand();

	}	


	function handleVrSessionEnded() {
		vrControlState.sessionActive = false;
		vrControlState.sessionStarting = false;

		vrControlState.leftInputSource = null;
		vrControlState.rightInputSource = null;
		vrControlState.strategyPressed = false;

		restoreDesktopCamera();
		hideVrHud();
		
		if (vrControlState.referenceSpace) {
			vrControlState.referenceSpace.removeEventListener("reset", handleVrReferenceSpaceReset);
			vrControlState.referenceSpace = null;
		}		

		console.log("Immersive VR session ended.");
	}	


	function restoreDesktopCamera() {
		const cameraRig = vrControlState.cameraRig;

		if (!cameraRig || camera.parent !== cameraRig) {
			return;
		}

		/*
		 * Odpojíme kameru z XR rigu.
		 */
		cameraRig.remove(camera);

		if (vrControlState.desktopCameraParent) {
			vrControlState.desktopCameraParent.add(camera);
		}

		/*
		 * Desktopová funkcia setCamera() nastaví
		 * kameru znova podľa aktuálneho typu.
		 */
		setCamera(camSetting.type, true);
	}
	

	async function endVrSession() {
		if (!renderer.xr) {
			return;
		}

		const session = renderer.xr.getSession();

		if (!session) {
			return;
		}

		try {
			await session.end();

		} catch (error) {
			console.warn("Unable to end VR session:", error);
		}
	}
		

	// VR HUD
	function createVrHud() {
		if (vrControlState.hudMesh) {
			vrControlState.hudMesh.visible = true;
			return;
		}

		const canvas = document.createElement("canvas");
		canvas.width = 1440;
		canvas.height = 512;

		const context = canvas.getContext("2d");

		const texture = new THREE.CanvasTexture(canvas);
		texture.minFilter = THREE.LinearFilter;
		texture.magFilter = THREE.LinearFilter;

		const material = new THREE.MeshBasicMaterial({
			map: texture,
			transparent: true,
			depthTest: true,
			depthWrite: false,
			side: THREE.DoubleSide
		});

		const hudWidth = 700;
		const hudHeight = 200;
		const geometry = new THREE.PlaneGeometry(hudWidth, hudHeight);
		const mesh = new THREE.Mesh(geometry, material);

		mesh.name = "vrHud";
		mesh.position.set(fieldWidth / 2, 250, -300);
		mesh.renderOrder = 10000;
		mesh.frustumCulled = false;

		scene.add(mesh);
		positionVrHudAboveOppositeStand();

		vrControlState.hudCanvas = canvas;
		vrControlState.hudContext = context;
		vrControlState.hudTexture = texture;
		vrControlState.hudMesh = mesh;

		updateVrHud(true);
	}		


	function formatVrMatchTime(value) {
		const safeValue = Math.max(0, Number(value) || 0);
		const minutes = Math.floor(safeValue / 60);
		const seconds = Math.floor(safeValue % 60);

		return (
			String(minutes).padStart(2, "0") +
			":" +
			String(seconds).padStart(2, "0")
		);
	}
	
	function drawWrappedVrText(context, text, centerX, startY, maxWidth, lineHeight) {
		if (!text) {
			return startY;
		}

		const words = String(text).split(/\s+/);
		const lines = [];
		let line = "";

		for (const word of words) {
			const testLine = line ? line + " " + word : word;

			if (context.measureText(testLine).width > maxWidth && line) {
				lines.push(line);
				line = word;
			} else {
				line = testLine;
			}
		}

		if (line) {
			lines.push(line);
		}

		for (let index = 0; index < lines.length; index++) {
			context.fillText(lines[index], centerX, startY + index * lineHeight);
		}

		return startY + lines.length * lineHeight;
	}	


	function updateVrHud(forceUpdate = false) {
		if (
			!vrControlState.sessionActive ||
			!vrControlState.hudContext ||
			!vrControlState.hudTexture
		) {
			return;
		}

		const teamAColor = "#" + teamA.dressColor.toString(16).padStart(6, "0");
		const teamBColor = "#" + teamB.dressColor.toString(16).padStart(6, "0");

		let title = "";
		let detail = "";
		let gameInfoTeamA = "";
		let gameInfoTeamB = "";
		let showScore = false;
		let showUpcomingMatch = false;

		const timeText = formatVrMatchTime(GState.matchTimer);
		const messageText = GState.gamePaused ? "Game Paused" : (msgText || "");

		if (GState.gameState === "gameinfo") {
			if (
				GState.gameInfoMsg === "" &&
				gameStages[GState.actualStage]
			) {
				showUpcomingMatch = true;
				title = "Upcoming match:";
				detail = gameStages[GState.actualStage].name;
				gameInfoTeamA = teamA.name;
				gameInfoTeamB = gameStages[GState.actualStage].opponentName;
			} else {
				title = GState.gameInfoMsg || "Get ready";
			}
		}
		else if (
			GState.gameState === "playing" ||
			GState.gameState === "overtime" ||
			GState.gameState === "tied"
		) {
			showScore = true;

			if (GState.goalScored) {
				if (GState.gameState === "tied") {
					detail = "OVERTIME!";
				} else if (GState.goalTeam) {
					detail = GState.goalTeam.name + " scored!";
				}
			}
		}
		else if (GState.gameState === "gameover") {
			showScore = true;

			if (teamA.score > teamB.score) {
				detail = teamA.name + " Win!";
			} else if (teamB.score > teamA.score) {
				detail = teamB.name + " Win!";
			} else {
				detail = "Tie!";
			}
		}

		const fpsText = "FPS: " + Math.round(fps);
		const renderFpsText = "Render FPS: " + renderFps;
		
		const hudText =
			GState.gameState + "|" +
			teamA.name + "|" +
			teamA.score + "|" +
			teamB.score + "|" +
			teamB.name + "|" +
			timeText + "|" +
			title + "|" +
			detail + "|" +
			gameInfoTeamA + "|" +
			gameInfoTeamB + "|" +
			messageText + "|" +
			fpsText + "|" +
			renderFpsText;

		if (!forceUpdate && hudText === vrControlState.lastHudText) {
			return;
		}

		vrControlState.lastHudText = hudText;

		const canvas = vrControlState.hudCanvas;
		const context = vrControlState.hudContext;

		const centerX = canvas.width / 2;
		const contentWidth = canvas.width - 100;

		context.clearRect(0, 0, canvas.width, canvas.height);
		context.fillStyle = "rgba(0, 0, 0, 0.45)";
		context.fillRect(0, 0, canvas.width, canvas.height);

		context.textAlign = "center";
		context.textBaseline = "middle";
		context.shadowColor = "black";
		context.shadowBlur = 12;

		if (showScore) {
			const scoreY = 140;
			const scoreText = teamA.score + " : " + teamB.score;

			/*
			 * Skóre sa vykresľuje samostatne, takže je
			 * vždy presne vycentrované v strede tabule.
			 */
			context.fillStyle = "white";
			context.font = "bold 104px sans-serif";
			context.textAlign = "center";
			context.fillText(scoreText, centerX, scoreY);

			/*
			 * Názvy tímov sú umiestnené po stranách skóre.
			 */
			const scoreWidth = context.measureText(scoreText).width;
			const teamGap = 45;

			context.font = "bold 58px sans-serif";

			context.fillStyle = teamAColor;
			context.textAlign = "right";
			context.fillText(teamA.name, centerX - scoreWidth / 2 - teamGap, scoreY);

			context.fillStyle = teamBColor;
			context.textAlign = "left";
			context.fillText(teamB.name, centerX + scoreWidth / 2 + teamGap, scoreY);

			/*
			 * Čas je vždy presne vycentrovaný pod skóre.
			 */
			context.fillStyle = "white";
			context.font = "bold 58px sans-serif";
			context.textAlign = "center";
			context.fillText(timeText, centerX, 245);

			if (detail) {
				context.fillStyle = "#FF4D00";
				context.font = "bold 48px sans-serif";
				context.textAlign = "center";

				drawWrappedVrText(context, detail, centerX, 335, contentWidth, 56);
			}

			if (messageText) {
				context.fillStyle = "white";
				context.font = "40px sans-serif";
				context.textAlign = "center";

				drawWrappedVrText(context, messageText, centerX, 415, contentWidth, 48);
			}
		}
		else if (showUpcomingMatch) {
			context.fillStyle = "white";
			context.font = "bold 54px sans-serif";
			context.textAlign = "center";
			context.fillText(title, centerX, 95);

			context.font = "bold 62px sans-serif";
			drawWrappedVrText(context, detail, centerX, 175, contentWidth, 68);

			/*
			 * Názvy súperov kreslíme osobitne, aby mohol
			 * mať každý tím svoju farbu.
			 */
			context.font = "bold 58px sans-serif";

			const versusText = "  vs  ";
			const teamAWidth = context.measureText(gameInfoTeamA).width;
			const versusWidth = context.measureText(versusText).width;
			const teamBWidth = context.measureText(gameInfoTeamB).width;
			const matchWidth = teamAWidth + versusWidth + teamBWidth;
			const gameInfoTeamBColor = "#" + gameStages[GState.actualStage].opponentDressColor.toString(16).padStart(6, "0");

			let matchX = centerX - matchWidth / 2;

			context.textAlign = "left";
			context.fillStyle = teamAColor;
			context.fillText(gameInfoTeamA, matchX, 285);

			matchX += teamAWidth;

			context.fillStyle = "white";
			context.fillText(versusText, matchX, 285);

			matchX += versusWidth;

			context.fillStyle = gameInfoTeamBColor;
			context.fillText(gameInfoTeamB, matchX, 285);

			context.fillStyle = "white";
			context.font = "42px sans-serif";
			context.textAlign = "center";
			context.fillText("Press Start to continue", centerX, 390);

			if (messageText) {
				context.font = "36px sans-serif";
				drawWrappedVrText(context, messageText, centerX, 455, contentWidth, 42);
			}
		}
		else {
			context.fillStyle = "#FF4D00";
			context.font = "bold 64px sans-serif";
			context.textAlign = "center";

			const nextY = drawWrappedVrText(context, title, centerX, 145, contentWidth, 76);

			context.fillStyle = "white";
			context.font = "46px sans-serif";
			drawWrappedVrText(context, "Press Start to continue", centerX, Math.max(nextY + 30, 310), contentWidth, 54);

			if (messageText) {
				context.font = "38px sans-serif";
				drawWrappedVrText(context, messageText, centerX, 420, contentWidth, 46);
			}
		}

		// FPS counter
		context.textAlign = "right";
		context.textBaseline = "top";
		context.fillStyle = "white";
		context.font = "32px sans-serif";
		context.fillText(fpsText, canvas.width - 30, 25);
		
		// Render FPS counter
		context.textAlign = "left";
		context.textBaseline = "top";
		context.fillStyle = "white";
		context.font = "32px sans-serif";
		context.fillText(renderFpsText, 30, 25);		
		

		vrControlState.hudTexture.needsUpdate = true;
	}
	
	
	function hideVrHud() {
		if (vrControlState.hudMesh) {
			vrControlState.hudMesh.visible = false;
		}

		vrControlState.lastHudText = "";
	}

	function positionVrHudAboveOppositeStand() {
		const hudMesh = vrControlState.hudMesh;

		if (!hudMesh) {
			return;
		}

		const fieldCenterX = fieldOffsetX + fieldWidth / 2;
		const fieldCenterZ = fieldHeight / 2;

		/*
		 * Výška najvyššej časti tribúny a medzera
		 * medzi tribúnou a spodnou hranou HUD-u.
		 */
		const standTopHeight = 220;
		const hudBottomGap = 15;

		/*
		 * Ak má tabuľa výšku 90 jednotiek, jej stred
		 * musí byť o polovicu výšky vyššie.
		 */
		const hudHeight = 200;
		const hudCenterY = standTopHeight + hudBottomGap + hudHeight / 2;
		const distanceBehindOppositeGoal = 300;

		if (camSetting.type === 2) {
			/*
			 * Kamera je za bránou teamA na nižšom X.
			 * Protiľahlá tribúna je za bránou teamB.
			 * HUD musí čelnou stranou smerovať k nižšiemu X.
			 */
			hudMesh.position.set(
				fieldOffsetX + fieldWidth + distanceBehindOppositeGoal,
				hudCenterY,
				fieldCenterZ
			);

			hudMesh.rotation.set(0, -Math.PI / 2, 0);
		}
		else if (camSetting.type === 3) {
			/*
			 * Kamera je za bránou teamB na vyššom X.
			 * Protiľahlá tribúna je za bránou teamA.
			 * HUD musí čelnou stranou smerovať k vyššiemu X.
			 */
			hudMesh.position.set(
				fieldOffsetX - distanceBehindOppositeGoal,
				hudCenterY,
				fieldCenterZ
			);

			hudMesh.rotation.set(0, Math.PI / 2, 0);
		}
		else if (camSetting.type === 0 || camSetting.type === 1) {
			/*
			 * Kamera je v strede medzi branami.
			 * HUD musí čelnou stranou smerovať k vyššiemu Y.
			 */
			hudMesh.position.set(
				fieldCenterX,
				hudCenterY,
				-distanceBehindOppositeGoal
			);

			hudMesh.rotation.set(0, 0, 0);
		}		
		else {
			/*
			 * Pri inom type kamery HUD vo VR radšej
			 * nezobrazíme na nesprávnom mieste.
			 */
			hudMesh.visible = false;
			return;
		}

		hudMesh.visible = true;
		hudMesh.updateMatrixWorld(true);
	}

	const OnlineInviteDialog = {

		cancelButton: null,

				!this.dialog ||
				!this.playerNameInput ||
				!this.emailInput ||
				!this.messageElement ||

			) {

				return;

				this.sendInvitation();
			});

			this.cancelButton.addEventListener("click", () => {

					this.close();

				return;

			this.messageElement.classList.remove("online-success");
			this.dialog.hidden = false;

			setTimeout(() => {
				this.playerNameInput.focus();
			}, 0);
		},

		close() {
			this.dialog.hidden = true;
			this.playerNameInput.blur();
			this.emailInput.blur();
		},

		buildInviteUrl(playerName) {
			const inviteUrl = new URL("https://wild-cones-game.onrender.com/");

			inviteUrl.searchParams.set("join", "1");
			inviteUrl.searchParams.set("room", NetworkManager.roomName);
			inviteUrl.searchParams.set("name", playerName);

			return inviteUrl.toString();
		},

		async sendInvitation() {
			const playerName = this.playerNameInput.value.trim().slice(0, 20);
			const email = this.emailInput.value.trim().slice(0, 100);

			if (!playerName) {
				this.showError("Enter the invited player's name.");
				this.playerNameInput.focus();
				return;
			}

			const hostPlayerName = String(NetworkManager.playerName || "").trim();

			if (playerName.toLowerCase() === hostPlayerName.toLowerCase()) {
				this.showError("The invited player must use a different name than the host.");
				this.playerNameInput.focus();
				return;
			}			

			if (!NetworkManager.isHost() || !NetworkManager.roomName) {
				this.showError("The online room is no longer available.");
				return;
			}

			const inviteUrl = this.buildInviteUrl(playerName);
			const subject = "Wild Cones Hockey invitation";
			const body =
				"Hi " + playerName + ",\n\n" +
				"Join my Wild Cones Hockey online game:\n" +
				inviteUrl + "\n\n" +
				"The invitation is valid while the host remains in the room.";

			const isAndroid = /Android/i.test(navigator.userAgent);

			/*
			 * Systémové zdieľanie používame iba na Androide.
			 * Windows Web Share môže v prehliadači spôsobiť pád karty.
			 */
			if (isAndroid && typeof navigator.share === "function") {
				try {
					await navigator.share({
						title: subject,
						text: "Join my Wild Cones Hockey online game.",
						url: inviteUrl
					});

					this.showSuccess("The invitation was shared.");
					return;
				} catch (error) {
					if (error.name === "AbortError") {
						return;
					}

					console.warn("[OnlineInviteDialog] Share failed:", error);
				}
			}


			/*
			 * Na desktope otvoríme mailto iba vtedy,
			 * keď používateľ zadal e-mailovú adresu.
			 */
			if (email) {
				const mailtoUrl = "mailto:" + email +
					"?subject=" + encodeURIComponent(subject) +
					"&body=" + encodeURIComponent(body);

				const mailWindow = window.open("about:blank", "_blank");

				if (mailWindow) {
					mailWindow.opener = null;
					mailWindow.location.href = mailtoUrl;

					this.showSuccess("The invitation was opened in your email client.");
				} else {
					try {
						await navigator.clipboard.writeText(inviteUrl);
						this.showSuccess("Pop-ups were blocked. The invitation link was copied to the clipboard.");
					} catch (error) {
						this.showError("The invitation could not be opened.");
					}
				}

				return;
			}

			/*
			 * Bez e-mailovej adresy na desktope
			 * skopírujeme pozvánku do schránky.
			 */
			try {
				await navigator.clipboard.writeText(inviteUrl);
				this.showSuccess("The invitation link was copied to the clipboard.");
			} catch (error) {
				console.error("[OnlineInviteDialog] Clipboard failed:", error);
				this.showError("The invitation link could not be copied.");
			}
		},

		showError(message) {
			this.messageElement.textContent = message;
			this.messageElement.classList.remove("online-success");
		},

		showSuccess(message) {
			this.messageElement.textContent = message;
			this.messageElement.classList.add("online-success");
		}, 
		
		isOpen() {
			return this.dialog && this.dialog.hidden === false;
		},		
	};	
	
		
	// Načítanie invite parametrov pozvanky
	function handleInviteUrl() {
		const params = new URLSearchParams(window.location.search);

		if (params.get("join") !== "1") {
			return;
		}

		const roomName = (params.get("room") || "").trim().slice(0, 32);
		const playerName = (params.get("name") || "").trim().slice(0, 20);

		if (!roomName || !playerName) {
			console.warn("[Invite] Invalid invitation URL.");
			return;
		}

		pendingOnlineInvitation = {
			roomName: roomName,
			playerName: playerName,
			joinStarted: false,
			retryStartedAt: Date.now(),
		};

		console.log("[Invite] Pending invitation:", pendingOnlineInvitation);
		
		const cleanUrl = new URL(window.location.href);
		cleanUrl.search = "";
		cleanUrl.hash = "";
		window.history.replaceState({}, document.title, cleanUrl.toString());		

		const fullscreenButton = document.getElementById("inviteFullscreenButton");

		if ('ontouchstart' in window && fullscreenButton) {
			fullscreenButton.hidden = false;
		} else {
			OnlineLobbyDialogs.showJoinDialog();
			tryJoinPendingInvitation();
		}
	}
	
	// Automatický Join pozvankky po pripravení Socket.IO
	function tryJoinPendingInvitation() {
		if (!pendingOnlineInvitation || pendingOnlineInvitation.joinStarted) {
			return;
		}

		/*
		 * Otvorením Join dialógu sa vykoná rovnaká
		 * inicializácia ako pri ručnom stlačení J.
		 */
		if (!OnlineLobbyDialogs.isJoinDialogOpen()) {
			OnlineLobbyDialogs.showJoinDialog();
		}

		const playerNameInput = document.getElementById("onlineJoinPlayerName");
		const roomNameInput = document.getElementById("onlineJoinRoomName");
		const joinButton = document.getElementById("onlineJoinGameButton");

		if (!playerNameInput || !roomNameInput || !joinButton) {
			setTimeout(tryJoinPendingInvitation, 250);
			return;
		}

		playerNameInput.value = pendingOnlineInvitation.playerName;
		roomNameInput.value = pendingOnlineInvitation.roomName;

		if (!NetworkManager.socket || !NetworkManager.socket.connected) {
			setTimeout(tryJoinPendingInvitation, 250);
			return;
		}

		pendingOnlineInvitation.joinStarted = true;
		joinButton.click();
	}	
	

	async function enterInviteFullscreen() {
		const button = document.getElementById("inviteFullscreenButton");

		try {
			if (!document.fullscreenElement) {
				await document.documentElement.requestFullscreen();
			}
		} catch (error) {
			console.warn("Fullscreen could not be enabled:", error);
		}

		if (screen.orientation && screen.orientation.lock) {
			try {
				await screen.orientation.lock("landscape");
			} catch (error) {
				console.warn("Landscape orientation could not be locked:", error);
			}
		}

		button.hidden = true;

		OnlineLobbyDialogs.showJoinDialog();
		tryJoinPendingInvitation();
	}


	document.getElementById("inviteFullscreenButton").addEventListener("pointerup", event => {
		event.preventDefault();
		event.stopPropagation();
		enterInviteFullscreen();
	});

	class SoundManager {
		constructor() {
			this.ctx = new (window.AudioContext || window.webkitAudioContext)();
			this.buffers = {};
			this.masterGain = this.ctx.createGain();
			this.masterGain.connect(this.ctx.destination);
			this.masterGain.gain.value = 1.0; // master volume
		}

		// decode a base64-encoded OGG and store as AudioBuffer
		async load(name, base64) {
			const binary = atob(base64);
			const len = binary.length;
			const bytes = new Uint8Array(len);
			for (let i = 0; i < len; i++) bytes[i] = binary.charCodeAt(i);

			const buffer = await this.ctx.decodeAudioData(bytes.buffer);
			this.buffers[name] = buffer;
		}

		// load multiple sounds at once
		async loadAll(soundMap) {
			const promises = [];
			for (const name in soundMap) {
				promises.push(this.load(name, soundMap[name]));
			}
			return Promise.all(promises);
		}

		// play sound, with optional pitch and gain
		playSound(name, { volume = 1, rate = 1, fadeIn = 0 } = {}) {
			if (soundMuted) return;

			const buffer = this.buffers[name];
			if (!buffer) return;

			const src = this.ctx.createBufferSource();
			src.buffer = buffer;
			src.playbackRate.value = rate;

			const gain = this.ctx.createGain();
			const now = this.ctx.currentTime;

			if (fadeIn > 0) {
				// Start silent
				gain.gain.setValueAtTime(0, now);

				// Fade to target volume over fadeIn seconds
				gain.gain.linearRampToValueAtTime(volume, now + fadeIn);
			} else {
				gain.gain.value = volume;
			}

			src.connect(gain);
			gain.connect(this.masterGain);
			src.start();
		}

		// random slight pitch variation + intensity-based volume
		playSoundVar(name, variance = 0.1, intensity = 1) {
			if (soundMuted) return;

			const rate = 1 + (Math.random() * variance * 2 - variance);
			intensity = Math.max(0, Math.min(1, intensity));	// clamp intensity 0–1 for safety
			this.playSound(name, { rate, volume: intensity });
		}

		setVolume(v) {
			this.masterGain.gain.value = v;
		}

		resume() {
			if (this.ctx.state === "suspended") {
				this.ctx.resume();
			}
		}
	}

		type: 1, // board

	});

			goalSide: 1,
			nx: 1, ny: 0,   // smer doprava

			restitution: RESTITUTION_BOARD
		});

	// -----------  Goal Posts for physics ---------------------
	const GOALPOST_RADIUS = 3;
	const GOALPOST_RESTITUTION = 0.95;
	const PANEL_THICKNESS = 1;

	function sweepPuckVsBoundaries(puck, segments) {
		const px0 = puck.prevX;
		const py0 = puck.prevY;
		const px1 = puck.x;
		const py1 = puck.y;

		let earliest_t = 1;
		let hitSeg = null;
		let hitPoint = null;

		const vx = px1 - px0;
		const vy = py1 - py0;

		for (let seg of segments) {

			// preskočenie bránkového otvoru
			if (seg.x1 === seg.x2) {
				if (seg.x1 === fieldOffsetX ||
					seg.x1 === fieldOffsetX + fieldWidth) {

					if (puck.y >= goalY && puck.y <= goalY + goalHeight) {
						continue;
					}
				}
			}

			// Vypočítaj dot s normálou seg.nx, seg.ny
			const dotVN = vx * seg.nx + vy * seg.ny;

			// Ak sa nepohybujeme smerom k mantinelu → žiadny zásah
			if (dotVN >= 0) continue;

			// posunutý segment o normálu
			const s = {
				x1: seg.x1 + seg.nx * puck.radius,
				y1: seg.y1 + seg.ny * puck.radius,
				x2: seg.x2 + seg.nx * puck.radius,
				y2: seg.y2 + seg.ny * puck.radius
			};

			const inter = getLineSegmentIntersection(
				px0, py0, px1, py1,
				s.x1, s.y1, s.x2, s.y2
			);

			if (inter && inter.tPuck < earliest_t) {
				earliest_t = inter.tPuck;
				hitSeg = seg;
				hitPoint = { x: inter.x, y: inter.y };
			}
		}

		if (!hitSeg) return null;

		return {
			t: earliest_t,
			seg: hitSeg,
			point: hitPoint
		};
	}


    // -----------------------------
    // Simulation Objects
    // -----------------------------
	const puckObj = {
		x: fieldOffsetX + fieldWidth / 2,
		y: fieldOffsetY + fieldHeight / 2,
		prevX: 0,
		prevY: 0,
		radius: puckRadius,
		vx: 0,
		vy: 0,
		boardSoundTime: Date.now(),

		update() {
			this.restrictPostion();

			// 1) uložiť predchádzajúcu pozíciu
			this.prevX = this.x;
			this.prevY = this.y;

			// 2) aplikovať rýchlosť
			this.x += this.vx;
			this.y += this.vy;

			// 3) CCD test voči mantinelom
			const sweep = sweepPuckVsBoundaries(this, boundaries);

			if (sweep) {
				const t = sweep.t;

				// (a) presun na kontakt
				this.x = this.prevX + (this.x - this.prevX) * t;
				this.y = this.prevY + (this.y - this.prevY) * t;

				// (b) normála segmentu (je už správna)
				const nx = sweep.seg.nx;
				const ny = sweep.seg.ny;

				// (c) odraz rýchlosti
				let dot = this.vx * nx + this.vy * ny;
				if (dot < 0) {
					const REST = sweep.seg.restitution;
					this.vx = this.vx - (1 + REST) * dot * nx;
					this.vy = this.vy - (1 + REST) * dot * ny;

					// zvuk
					if (sweep.seg.type == 1) {
						if(Date.now() - this.boardSoundTime > SHOOT_SOUND_TIME_MIN) {
							const volume = Math.min(Math.abs(dot / PUCK_MAX_SPEED), 1);
							this.boardSoundTime = Date.now();
							sound.playSoundVar("puckBoard", 0.15, volume);
						}
					}
				}

				// (d) posun o epsilon dovnútra ihriska
				const EPS = 0.1;
				this.x += nx * EPS;
				this.y += ny * EPS;

				// (e) aplikuj zvyšok pohybu
				const remain = 1 - t;
				this.x += this.vx * remain;
				this.y += this.vy * remain;
			}

			// 4) trenie
			this.vx *= friction;
			this.vy *= friction;
			limitSpeed(this, PUCK_MAX_SPEED);
			this.restrictPostion();
		},

		restrictPostion() {
			// 5) finálne ohraničenie plochy
			let inGoalOpening = (this.y > goalY) && (this.y < goalY + goalHeight);
			let inGoalArea = inGoalOpening && (this.x < fieldOffsetX || this.x > fieldOffsetX + fieldWidth);
			let prevInGoalOpening = (this.prevY > goalY) && (this.prevY < goalY + goalHeight);
			let prevInGoalArea = prevInGoalOpening && (this.prevX < fieldOffsetX || this.prevX > fieldOffsetX + fieldWidth);
			for (const b of boundaries) {
				if ( (!inGoalOpening && !prevInGoalArea && b.type == 1) || ( (inGoalArea || prevInGoalArea) && b.type == 2) ) {
					const dist =
						(this.x - b.x1) * b.nx +
						(this.y - b.y1) * b.ny;

					if (dist < this.radius) {
						const correction = this.radius - dist;
						this.x += b.nx * correction;
						this.y += b.ny * correction;
					}
				}
			}
		}

	};


	// --- Eyes expressions ---
	class EyesExpression {
	  constructor(
		rotation,			// 1 to -1 = left to right
		lidSideRotation,    // Normal = 0, eager = 0.7, sad = -1
		lidLeftTop,         // Normal = 0.25, fully closed = 1, fully open = 0
		lidLeftBottom,      // Normal = 0.5, fully closed = 1, fully open = 0
		lidRightTop,        // Normal = 0.25, fully closed = 1, fully open = 0
		lidRightBottom,     // Normal = 0.5, fully closed = 1, fully open = 0
		headRotation		// 1 to -1 = left to right
	  ) {
		this.rotation = rotation;
		this.lidSideRotation = lidSideRotation;
		this.lidLeftTop = lidLeftTop;
		this.lidLeftBottom = lidLeftBottom;
		this.lidRightTop = lidRightTop;
		this.lidRightBottom = lidRightBottom;
		this.headRotation = headRotation;
	  }

      // New constructor that copies from another EyesExpression object
      static fromTemplate(template) {
        return new EyesExpression(
         template.rotation,
         template.lidSideRotation,
         template.lidLeftTop,
         template.lidLeftBottom,
         template.lidRightTop,
         template.lidRightBottom,
		 template.headRotation
        );
      }

      copyFrom(template) {
         this.rotation = template.rotation;
         this.lidSideRotation = template.lidSideRotation;
         this.lidLeftTop = template.lidLeftTop;
         this.lidLeftBottom = template.lidLeftBottom;
         this.lidRightTop = template.lidRightTop;
         this.lidRightBottom = template.lidRightBottom;
		 this.headRotation = template.headRotation;
      }

	  set(
		rotation = this.rotation,
		lidSideRotation = this.lidSideRotation,
		lidLeftTop = this.lidLeftTop,
		lidLeftBottom = this.lidLeftBottom,
		lidRightTop = this.lidRightTop,
		lidRightBottom = this.lidRightBottom,
		headRotation = this.headRotation
	  ) {
		if (rotation!= undefined) this.rotation = rotation;
		if (lidSideRotation != undefined) this.lidSideRotation = lidSideRotation;
		if (lidLeftTop != undefined) this.lidLeftTop = lidLeftTop;
		if (lidLeftBottom != undefined) this.lidLeftBottom = lidLeftBottom;
		if (lidRightTop != undefined) this.lidRightTop = lidRightTop;
		if (lidRightBottom != undefined) this.lidRightBottom = lidRightBottom;
		if (headRotation!= undefined) this.headRotation = headRotation;
	  }

      setExpression(expression) {
		this.set(
		  expression.rotation,
		  expression.lidSideRotation,
		  expression.lidLeftTop,
		  expression.lidLeftBottom,
		  expression.lidRightTop,
		  expression.lidRightBottom,
		  expression.headRotation
		);
	  }
	}

	class Head {
	  constructor() {
		this.eyesTemplate = normalEyesExpression; // current eyes expression template
		this.eyes = EyesExpression.fromTemplate(normalEyesExpression);   // current eyes expression
		this.eyesMovement = [];  // animation stack of eye expressions
	  }

	  eyeWink(winkCount) {
		for (let i = 0; i < winkCount; i++) {
		  this.addEyeMovement(5, undefined, winkExpression);
		  this.addEyeMovement(3, undefined, winkExpression);
		  this.addEyeMovement(5, undefined, this.eyesTemplate);
		  this.addEyeMovement(10, undefined, voidExpression);
		}
	  }

	  eyeClosed(closedTime) {
	    this.addEyeMovement(5, undefined, winkExpression);
		this.addEyeMovement(closedTime, undefined, winkExpression);
		this.addEyeMovement(5, undefined, this.eyesTemplate);
	  }

	  eyeScan(scanCount) {
		for (let i = 0; i < scanCount; i++) {
		  this.addEyeMovement(5, undefined, scanLeftExpression);
		  this.addEyeMovement(15, undefined, scanLeftExpression);
		  this.addEyeMovement(5, undefined, scanRightExpression);
		  this.addEyeMovement(15, undefined, scanRightExpression);
		  this.addEyeMovement(5, undefined, this.eyesTemplate);
		}
	  }

	  eyeSquint(squintTime) {
		  this.addEyeMovement(5, undefined, squintExpression);
		  this.addEyeMovement(squintTime, undefined, squintExpression);
		  this.addEyeMovement(5, undefined, this.eyesTemplate);
	  }

	  eyeBrowsUp(upCount) {
		for (let i = 0; i < upCount; i++) {
		  this.addEyeMovement(10, undefined, EybrowsUpExpression);
		  this.addEyeMovement(10, undefined, EybrowsDownExpression);
		}
		this.addEyeMovement(5, undefined, this.eyesTemplate);
	    this.addEyeMovement(60, undefined, voidExpression);
	  }

	  upsetHeadShake(upCount, speed) {
	    let expressionFrom = EyesExpression.fromTemplate(shakeLeftExpression);
		expressionFrom.headRotation = this.eyes.headRotation;
	    let randomDelay = Math.floor(Math.random() * 10) + 5;
	    this.addEyeMovement(randomDelay, expressionFrom, upsetExpression);
		for (let i = 0; i < upCount; i++) {
		  this.addEyeMovement(speed, undefined, shakeLeftExpression);
		  this.addEyeMovement(speed, undefined, shakeRightExpression);
		}
	    this.addEyeMovement(5, undefined, upsetExpression);
	    this.addEyeMovement(60, undefined, voidExpression);
		this.addEyeMovement(5, undefined, this.eyesTemplate);
	  }

	  // --- Add gesture to the end of gesture queue ---
	  addEyeMovement(movementTime, expressionFrom = null, expressionTo) {
	    if (!expressionFrom) {
	  	  if (this.eyesMovement.length === 0) {
	  		expressionFrom = EyesExpression.fromTemplate(this.eyes); // Use current eyes
	  	  } else {
	  		expressionFrom = EyesExpression.fromTemplate(this.eyesMovement[this.eyesMovement.length - 1].expressionTo); // Use last movement's expressionTo
	  	  }
	    } else {
	  	  expressionFrom = EyesExpression.fromTemplate(expressionFrom); // Ensure a copy
	    }
	  	expressionTo = EyesExpression.fromTemplate(expressionTo); // Ensure a copy
	    this.eyesMovement.push({
	  	  movementTime: movementTime,
	  	  actualTime: movementTime,
	  	  expressionFrom: expressionFrom,
	  	  expressionTo: expressionTo
	    });
	  }

      // Method to animate eyes
      animateEyes() {
	     if (this.eyesMovement.length === 0) return; // No active animation
	     let currMove = this.eyesMovement[0]; // Get the first movement

	class ConeBody {
	  constructor() {
		this.lArmRotation = new THREE.Vector3(0, 0, 0);
		this.rArmRotation = new THREE.Vector3(0, 0, 0);
		this.rotation = new THREE.Vector3(0, 0, 0);
		this.position = new THREE.Vector3(0, 0, 0);
		this.movements = [];  // animation stack of movements
	  }

	  setPose(pose) {
		this.lArmRotation.copy(pose.lArmRotation);
	    this.rArmRotation.copy(pose.rArmRotation);
	    this.rotation.copy(pose.rotation);
		this.position.copy(pose.position);
	  }

	  ///////// Player actions ////////////////

	  playerStickUp(count) {
	    let randomDelay = Math.floor(Math.random() * 10);
	    this.addMovement(randomDelay, playerStickDownPose);
		this.addMovement(10, playerStickUpPose);
		this.addMovement(60, playerStickUpPose);
		for (let i = 0; i < count; i++) {
		  this.addMovement(20, playerStickBehindPose);
		  this.addMovement(5, playerStickHalfPose);
		}
		this.addMovement(60, playerStickHalfPose);
		this.addMovement(20, playerStickDownPose);
	  }

	  playerStickLift() {
		this.addMovement(5, playerStickLiftedPose);
	  }

	  playerStickDown() {
		this.addMovement(5, playerStickDownPose);
	  }


	  ///////// Spectator actions ////////////////

	  // --- celebration actions ---
	  clap(count) {
	    let randomDelay = Math.floor(Math.random() * 30);
	    this.addMovement(randomDelay, defaultPose);
		this.addMovement(20, clap1Pose);
		for (let i = 0; i < count; i++) {
		  this.addMovement(10, clap1Pose);
		  this.addMovement(10, clap2Pose);
		}
		this.addMovement(20, defaultPose);
	  }

	  // --- celebration actions ---
	  handsUp(count) {
	    let randomDelay = Math.floor(Math.random() * 30);
	    this.addMovement(randomDelay, defaultPose);
		this.addMovement(20, handsUpPose);
		for (let i = 0; i < count; i++) {
		  this.addMovement(15, handsHalfUpPose);
		  this.addMovement(15, handsUpPose);
		}
		this.addMovement(20, defaultPose);
	  }

	  dance(count) {
	    let randomDelay = Math.floor(Math.random() * 30);
	    this.addMovement(randomDelay, defaultPose);
		for (let i = 0; i < count; i++) {
		  this.addMovement(15, danceLeftPose);
		  this.addMovement(15, danceRightPose);
		}
		this.addMovement(30, defaultPose);
	  }

	  // --- regular cheering actions ---
	  waveOne(count) {
		for (let i = 0; i < count; i++) {
		  this.addMovement(15, waveOneLeftPose);
		  this.addMovement(15, waveOneRightPose);
		}
		this.addMovement(30, defaultPose);
	  }

	  waveTwo(count) {
		for (let i = 0; i < count; i++) {
		  this.addMovement(12, waveTwoUpPose);
		  this.addMovement(12, waveTwoDownPose);
		}
		this.addMovement(30, defaultPose);
	  }

	  leanForward(seconds) {
	    this.addMovement(5, leanFwPose);
	    this.addMovement(seconds * 60, leanFwPose);
		this.addMovement(5, defaultPose);
	  }

	  // --- loosing actions ---
	  facePalm(seconds) {
	    let randomDelay = Math.floor(Math.random() * 60);
	    this.addMovement(randomDelay, defaultPose);
	    this.addMovement(5, facePalmPose);
	    this.addMovement(seconds * 60, facePalmPose);
		this.addMovement(5, defaultPose);
	  }

	  // --- Add movement to the end of movement queue ---
	  addMovement(movementTime, bodyTo) {
	    if (this.movements.length === 0) {
			this.movements.push({
				movementTime: movementTime,
				actualTime: movementTime,
				bodyFrom: {
					lArmRotation: this.lArmRotation.clone(),
					rArmRotation: this.rArmRotation.clone(),
					rotation: this.rotation.clone(),
					position: this.position.clone()
				},
				bodyTo: bodyTo
			});
		} else {
			this.movements.push({
				movementTime: movementTime,
				actualTime: movementTime,
				bodyFrom: {
					lArmRotation: this.movements[this.movements.length - 1].bodyTo.lArmRotation.clone(),
					rArmRotation: this.movements[this.movements.length - 1].bodyTo.rArmRotation.clone(),
					rotation: this.movements[this.movements.length - 1].bodyTo.rotation.clone(),
					position: this.movements[this.movements.length - 1].bodyTo.position.clone()
				},
				bodyTo: bodyTo
			});
		}
	  }

      // Method to animate body
      animate() {
	    if (this.movements.length === 0) return; // No active animation
	    let currMove = this.movements[0]; // Get the first movement
	    let progress = 1 - currMove.actualTime / currMove.movementTime; // Calculate animation progress (0 to 1)

	    // Interpolate to bodyTo
		if(currMove.actualTime > 0) {
			this.lArmRotation.lerpVectors(currMove.bodyFrom.lArmRotation, currMove.bodyTo.lArmRotation, progress);
			this.rArmRotation.lerpVectors(currMove.bodyFrom.rArmRotation, currMove.bodyTo.rArmRotation, progress);
			this.rotation.lerpVectors(currMove.bodyFrom.rotation, currMove.bodyTo.rotation, progress);
			this.position.lerpVectors(currMove.bodyFrom.position, currMove.bodyTo.position, progress);
		} else {
			this.lArmRotation.copy(currMove.bodyTo.lArmRotation);
			this.rArmRotation.copy(currMove.bodyTo.rArmRotation);
			this.rotation.copy(currMove.bodyTo.rotation);
			this.position.copy(currMove.bodyTo.position);
			this.movements.shift();
	    }
	    currMove.actualTime--;
	  }
	}

	///////////////////////////
	//  Player neural brain  //
	///////////////////////////
	class NeuralBrain {
		constructor(arch = null) {
			// Default Architecture
			this.arch = arch || { i: 62, h1: 64, h2: 48, o: 14 };
			this.applyArchitecture(this.arch);
			this.age = 0;
			this.initializeRandomly();
		}

		applyArchitecture(arch) {
			this.arch = arch;
			this.inputSize = arch.i;
			this.hidden1Size = arch.h1;
			this.hidden2Size = arch.h2;
			this.outputSize = arch.o;
			this.recalculateSizes();
		}

		recalculateSizes() {
			this.sizeW1 = this.inputSize * this.hidden1Size;
			this.sizeB1 = this.hidden1Size;
			if (this.hidden2Size > 0) {
				this.sizeW2 = this.hidden1Size * this.hidden2Size;
				this.sizeB2 = this.hidden2Size;
				this.sizeW3 = this.hidden2Size * this.outputSize;
			} else {
				this.sizeW2 = 0;
				this.sizeB2 = 0;
				this.sizeW3 = this.hidden1Size * this.outputSize;
			}
			this.sizeB3 = this.outputSize;
		}

		initializeRandomly() {
			this.weights1 = this.randomWeights(this.inputSize, this.hidden1Size);
			this.biases1 = new Float32Array(this.hidden1Size).fill(0);
			this.weights2 = this.hidden2Size > 0 ? this.randomWeights(this.hidden1Size, this.hidden2Size) : new Float32Array(0);
			this.biases2 = this.hidden2Size > 0 ? new Float32Array(this.hidden2Size).fill(0) : new Float32Array(0);
			this.weights3 = this.randomWeights(this.hidden2Size > 0 ? this.hidden2Size : this.hidden1Size, this.outputSize);
			this.biases3 = new Float32Array(this.outputSize).fill(0);
		}

		// export brain with architecture header to base64 string
		exportToBase64() {
			// Header: [i, h1, h2, o] = 4 floats
			const header = new Float32Array([this.inputSize, this.hidden1Size, this.hidden2Size, this.outputSize]);
			const totalFloats = 4 + this.sizeW1 + this.sizeB1 + this.sizeW2 + this.sizeB2 + this.sizeW3 + this.sizeB3;

			const combined = new Float32Array(totalFloats);
			combined.set(header, 0);
			let offset = 4;

			combined.set(this.weights1, offset); offset += this.sizeW1;
			combined.set(this.biases1, offset); offset += this.sizeB1;
			combined.set(this.weights2, offset); offset += this.sizeW2;
			combined.set(this.biases2, offset); offset += this.sizeB2;
			combined.set(this.weights3, offset); offset += this.sizeW3;
			combined.set(this.biases3, offset); offset += this.sizeB3;

			const bytes = new Uint8Array(combined.buffer);
			let binary = '';
			for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
			return window.btoa(binary);
		}

		// load brain with architecture header from base64 string
		loadFromBase64(base64Str) {
			try {
				const binary = window.atob(base64Str);
				const bytes = new Uint8Array(binary.length);
				for (let i = 0; i < binary.length; i++) {
					bytes[i] = binary.charCodeAt(i);
				}

				const floats = new Float32Array(bytes.buffer);
				this.applyArchitecture({ i: floats[0], h1: floats[1], h2: floats[2], o: floats[3] }); // Extract Header

				let offset = 4;
				this.weights1 = floats.slice(offset, offset + this.sizeW1); offset += this.sizeW1;
				this.biases1  = floats.slice(offset, offset + this.sizeB1); offset += this.sizeB1;
				this.weights2 = floats.slice(offset, offset + this.sizeW2); offset += this.sizeW2;
				this.biases2  = floats.slice(offset, offset + this.sizeB2); offset += this.sizeB2;
				this.weights3 = floats.slice(offset, offset + this.sizeW3); offset += this.sizeW3;
				this.biases3  = floats.slice(offset, offset + this.sizeB3); offset += this.sizeB3;

				console.log("Brain loaded successfully from Base64.");
			} catch (e) {
				console.error("Error loading brain from Base64:", e);
			}
		}

		// use the current this.arch
		clone() {
			const newBrain = new NeuralBrain(this.arch);
			newBrain.weights1 = new Float32Array(this.weights1);
			newBrain.biases1 = new Float32Array(this.biases1);
			newBrain.weights2 = new Float32Array(this.weights2);
			newBrain.biases2 = new Float32Array(this.biases2);
			newBrain.weights3 = new Float32Array(this.weights3);
			newBrain.biases3 = new Float32Array(this.biases3);
			newBrain.age = this.age;
			return newBrain;
		}

		/** Forward Pass */
		predict(inputs) {
			let h1 = this.computeLayer(inputs, this.weights1, this.biases1);

            if (this.hidden2Size > 0) {
                let h2 = this.computeLayer(h1, this.weights2, this.biases2);
			    return this.computeLayer(h2, this.weights3, this.biases3);
            } else {
                // Skip Layer 2
                return this.computeLayer(h1, this.weights3, this.biases3);
            }
		}

		computeLayer(input, weights, bias) {
			let output = new Float32Array(bias.length);
			let inputLen = input.length;
			for (let i = 0; i < output.length; i++) {
				let sum = bias[i];
				let offset = i * inputLen;
				for (let j = 0; j < inputLen; j++) {
					sum += input[j] * weights[offset + j];
				}
				output[i] = Math.tanh(sum);
			}
			return output;
		}

		randomWeights(inputs, outputs) {
			let w = new Float32Array(inputs * outputs);
			const scale = Math.sqrt(2 / inputs);
			for(let i=0; i<w.length; i++) w[i] = (Math.random() * 2 - 1) * scale;
			return w;
		}

		getChecksum() {
			let sum = 0;
			const add = (arr) => { for(let v of arr) sum += v; };
			add(this.weights1); add(this.biases1);
			add(this.weights2); add(this.biases2);
			add(this.weights3); add(this.biases3);
			return sum.toFixed(4); // e.g. "45.2312"
		}
	}


	///////// Reward structure ///////////////////
	class Reward {
		constructor() {
			this.reset();
		}

		reset() {
			this.total = 0;

			this.aiming            = 0;
			this.proximity         = 0;
			this.touchPuck         = 0;
			this.existence         = 0;
			this.rotation          = 0;
			this.tmateRepulsion    = 0;
			this.puckPush          = 0;
			this.hitWall           = 0;
			this.controlStability  = 0;
			this.goalAndAssist     = 0;
			this.goalConcede       = 0;
			this.shootAndPass      = 0;
			this.defenceInterccept = 0;
			this.defenceSpread     = 0;
			this.OneTimerPos       = 0;
			this.approachVelocity  = 0;
		}

		add(r) {
			let t = 0;

			t += r.aiming;            this.aiming            += r.aiming;
			t += r.proximity;         this.proximity         += r.proximity;
			t += r.touchPuck;         this.touchPuck         += r.touchPuck;
			t += r.existence;         this.existence         += r.existence;
			t += r.rotation;          this.rotation          += r.rotation;
			t += r.tmateRepulsion;    this.tmateRepulsion    += r.tmateRepulsion;
			t += r.puckPush;          this.puckPush          += r.puckPush;
			t += r.hitWall;           this.hitWall           += r.hitWall;
			t += r.controlStability;  this.controlStability  += r.controlStability;
			t += r.goalAndAssist;     this.goalAndAssist     += r.goalAndAssist;
			t += r.goalConcede;       this.goalConcede       += r.goalConcede;
			t += r.shootAndPass;      this.shootAndPass      += r.shootAndPass;
			t += r.defenceInterccept; this.defenceInterccept += r.defenceInterccept;
			t += r.defenceSpread;     this.defenceSpread     += r.defenceSpread;
			t += r.OneTimerPos;       this.OneTimerPos       += r.OneTimerPos;
			t += r.approachVelocity;  this.approachVelocity  += r.approachVelocity;

			this.total += t;
		}
	}
