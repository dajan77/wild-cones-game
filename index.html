	class Spectator {
		constructor(x, y, z, angle, radius, height, color, hasTeamColor, eyesTemplate, team, scene, detailLevel, dynamic, tribuneGroup) {
			this.x = x;
			this.y = y;
			this.z = z;
			this.angle = angle;
			this.team = team;
			this.hasTeamColor = hasTeamColor;
			this.color = color;
			this.radius = radius;
			this.height = height;
			this.detailLevel = detailLevel;
			this.head = new Head();
			this.body = new ConeBody();
			this.meshGroup = this.createMesh(scene);
			this.tribuneGroup = tribuneGroup;
			tribuneGroup.add(this.meshGroup);
			this.winkTime = Date.now() + Math.random() * SPECT_MEAN_TIME_WINK;
			this.squintTime = Date.now() + Math.random() * SPECT_MEAN_TIME_SQUINT;
			this.actionTime = Date.now() + Math.random() * SPECT_MEAN_TIME_ACTION;
			this.dynamic = dynamic;
			this.frozen = false;
		}

		setPosition(x, y, z) {
			this.meshGroup.position.set(this.x, this.y, this.z);
		}

		freeze() {
			this.frozen = true;
		}

		unfreeze()
		{
			this.frozen = false;
			this.resetActionTimes();
		}

		resetActionTimes() {
			this.winkTime = Date.now() + Math.random() * SPECT_MEAN_TIME_WINK;
			this.squintTime = Date.now() + Math.random() * SPECT_MEAN_TIME_SQUINT;
			this.actionTime = Date.now() + Math.random() * SPECT_MEAN_TIME_ACTION;
		}

		initiateState() {
			this.head.eyes.copyFrom(this.head.eyesTemplate);
			this.head.eyesMovement.length = 0;
			this.body.setPose(defaultPose);
			this.body.movements.length = 0;
			this.updateMesh();
		}

		update(action) {
			// head & eyes rotation to the puck
			if (!GState.goalScored) {
			  let actualAngleToPuck = Math.atan2(puckObj.y - this.meshGroup.getWorldPosition().z , puckObj.x - this.meshGroup.getWorldPosition().x) -  Math.PI * 1/2;
			  let newHeadRotation = Math.min(Math.max(normalizeAngle(this.angle - this.tribuneGroup.rotation.y - actualAngleToPuck), -HEAD_ANGLE_MAX), HEAD_ANGLE_MAX) / HEAD_ANGLE_MAX;
			  this.head.eyes.headRotation = (Math.abs(newHeadRotation - this.head.eyes.headRotation) < HEAD_ROT_SPEED_MAX) ? newHeadRotation : this.head.eyes.headRotation + Math.sign(newHeadRotation - this.head.eyes.headRotation) * HEAD_ROT_SPEED_MAX;
			}

			// initiate eyes gestures
			if (this.winkTime <= Date.now() ) {
			  this.head.eyeWink(Math.floor(Math.random() * 2) + 1 );
			  this.winkTime = Date.now() + Math.random() * SPECT_MEAN_TIME_WINK;
			}
			if (this.squintTime <= Date.now() ) {
			  this.head.eyeSquint(Math.floor(Math.random() * 120) + 60);
			  this.squintTime = Date.now() + Math.random() * SPECT_MEAN_TIME_SQUINT;
			}
			if (action != undefined || this.actionTime <= Date.now() ) {
				let actionCount = Math.floor(Math.random() * 10 + 5);
				let actionDuration = 0;
				if (action == undefined) action = Math.floor(Math.random() * 4 + 1);
				switch (action) {
					case 1:  // wawe one hand
						this.body.waveOne(actionCount);
						actionDuration = actionCount * 1;
						break;
					case 2: // wave both hands
						this.body.waveTwo(actionCount);
						actionDuration = actionCount * 1;
						break;
					case 3:  // lean forward and squint
						actionDuration = Math.floor(Math.random() * 5 + 5);
						this.body.leanForward(actionDuration);
						break;
					case 4: // clap hands
						this.body.clap(actionCount);
						actionDuration = actionCount * 1;
						break;
					case 10: // dance
						this.head.eyeSquint(actionCount * 30);
						this.body.dance(actionCount);
						actionDuration = actionCount * 1;
						break;
					case 11: // hands up celerate
						this.body.handsUp(actionCount);
						actionDuration = actionCount * 1;
						break;
					case 12: // palmface
						actionDuration = Math.floor(Math.random() * 6 + 3);
						this.head.eyeClosed(actionDuration / 4 * 60);
						if (Math.random() > 0.5) this.head.upsetHeadShake(4, 6); else this.head.upsetHeadShake(3, 15);
						this.body.facePalm(actionDuration);
						break;
					case 13: // headshake
						actionDuration = Math.floor(Math.random() * 6 + 3);
						if (Math.random() > 0.5) this.head.upsetHeadShake(4, 6); else this.head.upsetHeadShake(3, 15);
						break;
				}
			  this.actionTime =  Date.now() + actionDuration * 1000 + Math.random() * SPECT_MEAN_TIME_ACTION;
			}

			this.head.animateEyes();
			this.body.animate();
			this.updateMesh();
		}

		updateMesh() {
			// Update head objects
			this.meshGroup.getObjectByName("head").rotation.set(0, this.head.eyes.headRotation * HEAD_ANGLE_MAX, 0);
			this.meshGroup.getObjectByName("leftPupil").rotation.set(0, this.head.eyes.rotation * EYES_ANGLE_MAX, 0);
			this.meshGroup.getObjectByName("rightPupil").rotation.set(0, this.head.eyes.rotation * EYES_ANGLE_MAX, 0);
			this.meshGroup.getObjectByName("leftLidTop").rotation.set( (9/8 + this.head.eyes.lidLeftTop * (12/8 - 9/8)) * Math.PI, this.head.eyes.lidSideRotation * Math.PI / 8, 0);
			this.meshGroup.getObjectByName("leftLidBottom").rotation.set( (-10/8 + this.head.eyes.lidLeftBottom * (-12/8 + 10/8)) * Math.PI, -this.head.eyes.lidSideRotation * Math.PI / 8, 0);
			this.meshGroup.getObjectByName("rightLidTop").rotation.set( (9/8 + this.head.eyes.lidRightTop * (12/8 - 9/8)) * Math.PI, -this.head.eyes.lidSideRotation * Math.PI / 8, 0);
			this.meshGroup.getObjectByName("rightLidBottom").rotation.set( (-10/8 + this.head.eyes.lidRightBottom * (-12/8 + 10/8)) * Math.PI, this.head.eyes.lidSideRotation * Math.PI / 8, 0);
			this.meshGroup.getObjectByName("rightLidBottom").rotation.set( (-10/8 + this.head.eyes.lidRightBottom * (-12/8 + 10/8)) * Math.PI, this.head.eyes.lidSideRotation * Math.PI / 8, 0);
			// Update body objects
			this.meshGroup.getObjectByName("rightArm").rotation.set(this.body.rArmRotation.x * Math.PI, this.body.rArmRotation.y * Math.PI, this.body.rArmRotation.z * Math.PI);
			this.meshGroup.getObjectByName("leftArm").rotation.set(this.body.lArmRotation.x * Math.PI, this.body.lArmRotation.y * Math.PI, this.body.lArmRotation.z * Math.PI);
			this.meshGroup.rotation.set(this.body.rotation.x * Math.PI, this.angle + this.body.rotation.y * Math.PI, this.body.rotation.z * Math.PI);
			this.meshGroup.position.set(this.x + this.body.position.x, this.y + this.body.position.y, this.z + this.body.position.z);
		}

		createMesh(scene) {
		  // Spectator body
		  const coneTop = 4;
		  const group = new THREE.Group();
		  const spectatorGeometry = new THREE.CylinderGeometry(coneTop, this.radius, this.height, Math.floor(16 / this.detailLevel) , 1, false);
		  spectatorGeometry.translate(0, this.height / 2, 0);
		  let spectatorMaterial = this.team.spectatorMaterial;
		  if (!this.hasTeamColor) spectatorMaterial = new THREE.MeshLambertMaterial({color: this.color, specular: 0x888888, shininess: 0 });
		  const spectatorMesh = new THREE.Mesh(spectatorGeometry, spectatorMaterial);
		  group.add(spectatorMesh);
		  // Rounded cap on top
		  const capGeometry = new THREE.SphereGeometry(coneTop + 1, Math.floor(16 / this.detailLevel), Math.floor(4 / this.detailLevel), 0, Math.PI * 2, 0, Math.PI * 5 / 16);
		  const cap = new THREE.Mesh(capGeometry, spectatorMaterial);
		  cap.position.y = this.height - 3;
		  group.add(cap);
		  // Add low detail head with eyes
		  group.add(createHead(this.radius, this.height, spectatorMaterial, 2 * this.detailLevel));

		  // Define arm curve paths (Quadratic Bezier Curves)
		  const coneRadiusAtHalfHeight = this.radius - (this.radius - coneTop) * 0.5; // Approximate radius at half height
		  const coneHalfHeight = this.height / 2;
		  const leftConeStart = new THREE.Vector3(-coneRadiusAtHalfHeight, coneHalfHeight * 8/10, 0);  // Start point (left cone side at half height)
		  const rightConeStart = new THREE.Vector3(coneRadiusAtHalfHeight, coneHalfHeight * 8/10, 0);  // Start point (right cone side at half height)
		  const leftHandPosition = new THREE.Vector3(-coneRadiusAtHalfHeight * 1.5, this.height * 1/4,  coneRadiusAtHalfHeight * 1.3); // End point at left hand
		  const rightHandPosition = new THREE.Vector3(coneRadiusAtHalfHeight * 1.5, this.height * 1/4,  coneRadiusAtHalfHeight * 1.3);  // End point at right hand
		  const leftElbowControl = new THREE.Vector3(-coneRadiusAtHalfHeight * 3, this.height * 1/3, leftHandPosition.z - 5); // Control point for elbow
		  const rightElbowControl =new THREE.Vector3(coneRadiusAtHalfHeight * 3, this.height * 1/3, rightHandPosition.z - 5);  // Control point for elbow

		  const leftArmCurve = new THREE.QuadraticBezierCurve3( leftConeStart, leftElbowControl, leftHandPosition );
		  const rightArmCurve = new THREE.QuadraticBezierCurve3( rightConeStart, rightElbowControl, rightHandPosition );

		  // Create arm geometries
		  const armRadius = 1.5;
		  const leftArmGeometry = new THREE.TubeGeometry(leftArmCurve, Math.floor(8 / this.detailLevel), armRadius, Math.floor(8 / this.detailLevel), false);
		  const rightArmGeometry = new THREE.TubeGeometry(rightArmCurve, Math.floor(8 / this.detailLevel), armRadius, Math.floor(8 / this.detailLevel), false);
		  leftArmGeometry.translate(-leftConeStart.x, -leftConeStart.y, -leftConeStart.z);
		  rightArmGeometry.translate(-rightConeStart.x, -rightConeStart.y, -rightConeStart.z);

		  // Create Hands and Fingers
		  const leftHandGroup = this.createHand(spectatorMaterial);
		  const rightHandGroup = this.createHand(spectatorMaterial);
		  leftHandGroup.position.copy(leftHandPosition.clone().sub(leftConeStart)); // Position hand at leftHandPosition, relative to arm
		  rightHandGroup.position.copy(rightHandPosition.clone().sub(rightConeStart)); // Position hand at rightHandPosition, relative to arm
		  leftHandGroup.rotation.set( 0, Math.PI / 3, Math.PI * 5 / 4);
		  rightHandGroup.rotation.set( 0, -Math.PI / 3, -Math.PI / 4);

		  // Create arm meshes
		  const leftArmMesh = new THREE.Mesh(leftArmGeometry, spectatorMaterial);
		  const rightArmMesh = new THREE.Mesh(rightArmGeometry, spectatorMaterial);
		  leftArmMesh.position.copy(leftConeStart);
		  rightArmMesh.position.copy(rightConeStart);
		  leftArmMesh.name = "leftArm";
		  rightArmMesh.name = "rightArm";

		  leftArmMesh.add(leftHandGroup);
		  rightArmMesh.add(rightHandGroup);

		  // Add arms to the group
		  group.add(leftArmMesh); // **Add arms to the main group AFTER positioning**
		  group.add(rightArmMesh); // **Add arms to the main group AFTER positioning**

		  group.name = "spectator";
		  group.position.set(this.x, this.y, this.z);
		  //scene.add(group);
		  return group;
		}

		createHand(material) {
			const handGroup = new THREE.Group();
			const fingerWidth = 1.5;
			const fingerHeight = 1.5;
			const fingerDepth = 10;

			// Fingers
			for (let i = 0; i < 3; i++) {
				let fingerLength = fingerDepth * ( (i == 0) ? 0.9 : ((i == 1) ?  1 : 0.7 ));
				const fingerGeometry = new THREE.BoxGeometry(fingerWidth, fingerHeight, fingerLength );
				const fingerMesh = new THREE.Mesh(fingerGeometry, material);
				fingerMesh.position.set(
					fingerWidth * 1.5 * (i - 1),
					0,
					fingerLength / 2 - 2
				);
				fingerMesh.rotation.y = (i - 1) * Math.PI / 8; // ~10 degrees in radians
				handGroup.add(fingerMesh);
			}
			return handGroup;
		}
	}

    const STEP_DEPTH = 35;

	function createTribune(position, width, fragments, rotation, railings, spectatorsRate, onlySpectators) {
	  const tribuneGroup = new THREE.Group();
	  const stepCount = STEP_COUNT;
	  const stepWidth = width;
	  const stepDepth = STEP_DEPTH;
	  const stepHeight = STEP_HEIGHT;
	  const stepSpacing = 0;
	  const benchFragments = fragments;
	  const tribuneDepth = (stepDepth + stepSpacing) * stepCount;
	  const fragmentWidth = stepWidth / benchFragments - benchGap;

	  // Materials and Geometries
	  const stepGeometry = new THREE.BoxGeometry(stepWidth, stepHeight, stepDepth);
	  const benchFootGeometry = new THREE.BoxGeometry(5, 7, stepDepth / 2);
	  const benchGeometry = new THREE.BoxGeometry(fragmentWidth, 3, stepDepth / 2)

	  for (let i = 0; i < stepCount; i++) {
		const step = new THREE.Mesh( stepGeometry, concreteMaterial );
		step.position.set(0, i * (stepHeight + stepSpacing), - i * (stepDepth + stepSpacing));
		tribuneGroup.add(step);

		if (i > 0) {
		  const totalBenchWidth = benchFragments * (fragmentWidth + benchGap) - benchGap;
		  const startOffset = -totalBenchWidth / 2 + fragmentWidth / 2;
		  for (let j = 0; j < benchFragments; j++) {
			const offset = startOffset + j * (fragmentWidth + benchGap);
			if (j != 0 && i < stepCount - 2) {
				const subStep = new THREE.Mesh( subStepGeometry, concreteMaterial );
				subStep.position.set(offset - fragmentWidth / 2 - benchGap / 2, step.position.y + stepHeight * 3 /4, step.position.z - stepDepth * 3/8 );
				tribuneGroup.add(subStep);
			}
		    if(i != 5 && i != 10) { // Create benches
				const benchFoot1 = new THREE.Mesh(benchFootGeometry, woodenMaterial );
				benchFoot1.position.set(offset + fragmentWidth / 2 - 5, step.position.y + stepHeight / 2 + 3.5, step.position.z - stepDepth / 4 );
				tribuneGroup.add(benchFoot1);

				const benchFoot2 = new THREE.Mesh(benchFootGeometry, woodenMaterial );
				benchFoot2.position.set(offset - fragmentWidth / 2 + 5, step.position.y + stepHeight / 2 + 3.5, step.position.z - stepDepth / 4 );
				tribuneGroup.add(benchFoot2);

				const bench = new THREE.Mesh(benchGeometry,	woodenMaterial );
				bench.position.set(offset, step.position.y + stepHeight / 2 + 8, step.position.z - stepDepth / 4 );
				tribuneGroup.add(bench);

				// Spawn specatators
				const spectSpacing = 50;
				const spectCount = Math.floor(fragmentWidth/ spectSpacing );
				const seatY = step.position.y + stepHeight / 2;
				const seatZ = step.position.z - stepDepth / 6;
				const seatXmin = offset - fragmentWidth / 2 + (fragmentWidth - (spectCount * spectSpacing) ) / 2 + spectSpacing / 2;
				for (let s= 0; s < spectCount; s++) {
					const seatX = seatXmin + s * spectSpacing;
					let isSeatPlace = (((seatX + stepWidth/2) > ((tribuneDepth - Math.abs(seatZ)) * Math.tan(Math.PI/8) + spectSpacing )) && ((seatX + stepWidth/2) < (stepWidth - ((tribuneDepth - Math.abs(seatZ)) * Math.tan(Math.PI/8) + spectSpacing ) )));
					let seatOccupiedProb = (i < 5) ? spectatorsRate : spectatorsRate * SPECT_UPPER_FACTOR;
					if (isSeatPlace && Math.random() < seatOccupiedProb) {
						let isDynamic = (i < 5) ? (Math.random() < SPECT_DYNAMIC_RATE) : (Math.random() < SPECT_DYNAMIC_UPPER_RATE);
						let detail = 1;
						spawnRandomSpectator(seatX, seatY + 10, seatZ, 0, spectators, detail, isDynamic, tribuneGroup);
					}
				}
			} else
		    {
			  if (railings){  // Create railings
				const railingOffset = ( i==5 ) ? 105 : 30;
				const railingStartX = ( j == benchFragments - 1 ) ? offset + fragmentWidth / 2 - railingOffset - railingOverhang : offset + fragmentWidth / 2 - railingOverhang;
				const railingEndX = ( j == 0 ) ? offset - fragmentWidth / 2 + railingOffset + railingOverhang : offset - fragmentWidth / 2 + railingOverhang;
				const railingTopGeometry = new THREE.CylinderGeometry(railingR, railingR, railingStartX - railingEndX + 2 * railingOverhang);

				const railingPost1 = new THREE.Mesh(railingPostGeometry, railingMaterial );
				railingPost1.position.set(railingStartX, step.position.y + stepHeight / 2 + railingH / 2, step.position.z + stepDepth / 2  - railingEdgeOffset );
				tribuneGroup.add(railingPost1);

				const railingPost2 = new THREE.Mesh(railingPostGeometry, railingMaterial );
				railingPost2.position.set(railingEndX, step.position.y + stepHeight / 2 + railingH / 2, step.position.z + stepDepth / 2 - railingEdgeOffset );
				tribuneGroup.add(railingPost2);

				const railingTop = new THREE.Mesh(railingTopGeometry, railingMaterial );
				railingTop.rotation.z = Math.PI / 2;
				railingTop.position.set(railingEndX + (railingStartX - railingEndX) / 2, step.position.y + stepHeight / 2 + railingH, step.position.z + stepDepth / 2 - railingEdgeOffset );
				tribuneGroup.add(railingTop);
			  }
			}
		  }
		}
	  }
	  tribuneGroup.position.set(position.x, position.y, position.z);
	  tribuneGroup.rotation.y = rotation;
	  tribuneGroup.name = "tribune";
	  scene.add(tribuneGroup);
	}

            directionalLight.intensity = 0; // Disable directional light in high graphics

            // Re-create spotlights if they were disposed
            if (spotLights.length === 0) {

	// Gamepads management

	const previousButtonStates = []; // Save across frames
	const previousAxisStates = []; // Save across frames

	function gamepadUnbound(gamepad) {
		if (!gamepad) return false;
		let result = true;
		players.forEach(player => {
			if (player.gamepad && player.gamepad.index == gamepad.index) result = false;
		});
		return result;
	}

	function manageGamepads() {
		let gamepads = navigator.getGamepads();
		if (!gamepads) return;
		gamepads.forEach((gamepad, gpIndex) => {
			if ( gamepad == null || gamepad.id == "HID-compliant game controller (STANDARD GAMEPAD Vendor: 054c Product: 0ce6)" ) return;
			const gpMap = getGpMap(gamepad);


			if (GState.gameState === "title") {
				// try to bind gamepad
				if ((gpMap.butDpadRight && gamepad.buttons[gpMap.butDpadRight].pressed) ||
					(gpMap.axDpad && Math.round(gamepad.axes[gpMap.axDpad] * 7) == -3)) {

					if (NetworkManager.isOnline()) {
						const localPlayerIndex = NetworkManager.localPlayerIndex;

						if (localPlayerIndex !== null && players[localPlayerIndex] &&
							players[localPlayerIndex].gamepad === undefined &&
							gamepadUnbound(gamepad)) {

							players[localPlayerIndex].bindGamepad(gamepad);
						}
					} else {
						players.forEach(player => {
							if (player.gamepad === undefined && gamepadUnbound(gamepad)) {
								player.bindGamepad(gamepad);
							}
						});
					}
				}

				// try to unbind gamepad
				if ((gpMap.butDpadLeft && gamepad.buttons[gpMap.butDpadLeft].pressed) ||
					(gpMap.axDpad && Math.round(gamepad.axes[gpMap.axDpad] * 7) == 5)) {

					if (NetworkManager.isOnline()) {
						const localPlayerIndex = NetworkManager.localPlayerIndex;

						if (localPlayerIndex !== null && players[localPlayerIndex] &&
							players[localPlayerIndex].gamepad &&
							players[localPlayerIndex].gamepad.index === gamepad.index) {

							players[localPlayerIndex].unbindGamepad();
						}
					} else {
						players.forEach(player => {
							if (player.gamepad && player.gamepad.index === gamepad.index) {
								player.unbindGamepad();
							}
						});
					}
				}

				// try to rebind gamepad down
				if ((gpMap.butDpadDown && gamepad.buttons[gpMap.butDpadDown].pressed && !(previousButtonStates[gpIndex][gpMap.butDpadDown] || false))
					|| (gpMap.axDpad && Math.round(gamepad.axes[gpMap.axDpad] * 7) == 1 && !(Math.round(previousAxisStates[gpIndex][gpMap.axDpad] * 7) == 1 || false))) {

					if (NetworkManager.isOnline()) {
						const orginPlayerIndex = NetworkManager.localPlayerIndex;

						if (orginPlayerIndex !== null && players[orginPlayerIndex] &&
							players[orginPlayerIndex].gamepad &&
							players[orginPlayerIndex].gamepad.index === gamepad.index) {

							for(let j = orginPlayerIndex + 1; j < players.length; j++) {
								const onlinePlayer = NetworkManager.getOnlinePlayer(j);

								if (!onlinePlayer || onlinePlayer.peerId === NetworkManager.peerId) {
									NetworkManager.changeLocalPlayerIndex(j);
									break;
								}
							}
						}
					} else {
						let orginPlayerIndex;
						for(let i = 0; i < players.length; i++) {
							if (players[i].gamepad && players[i].gamepad.index == gamepad.index) {
								orginPlayerIndex = i;
								break;
							}
						}
						for(let j = orginPlayerIndex; j < players.length; j++) {
							if (players[j].gamepad === undefined) {
								players[orginPlayerIndex].unbindGamepad();
								players[j].bindGamepad(gamepad);
								break;
							}
						}
					}
				}

				// try to rebind gamepad up
				if ((gpMap.butDpadUp && gamepad.buttons[gpMap.butDpadUp].pressed && !(previousButtonStates[gpIndex][gpMap.butDpadUp] || false))
					|| (gpMap.axDpad && Math.round(gamepad.axes[gpMap.axDpad] * 7) == -7 && !(Math.round(previousAxisStates[gpIndex][gpMap.axDpad] * 7) == -7 || false))) {

					if (NetworkManager.isOnline()) {
						const orginPlayerIndex = NetworkManager.localPlayerIndex;

						if (orginPlayerIndex !== null && players[orginPlayerIndex] &&
							players[orginPlayerIndex].gamepad &&
							players[orginPlayerIndex].gamepad.index === gamepad.index) {

							for(let j = orginPlayerIndex - 1; j > -1; j--) {
								const onlinePlayer = NetworkManager.getOnlinePlayer(j);

								if (!onlinePlayer || onlinePlayer.peerId === NetworkManager.peerId) {
									NetworkManager.changeLocalPlayerIndex(j);
									break;
								}
							}
						}
					} else {
						let orginPlayerIndex;
						for(let i = 0; i < players.length; i++) {
							if (players[i].gamepad && players[i].gamepad.index === gamepad.index) {
								orginPlayerIndex = i;
								break;
							}
						}
						for(let j = orginPlayerIndex; j > -1; j--) {
							if (players[j].gamepad === undefined) {
								players[orginPlayerIndex].unbindGamepad();
								players[j].bindGamepad(gamepad);
								break;
							}
						}
					}
				}
			}


			// check for main user's gamepad action
			const activePlayer = players.find(p => p.gamepad && p.gamepad.index === gamepad.index);
			if (!gamepadUnbound(gamepad) && activePlayer?.isMainUser) {

				if (gpMap.butSpace != undefined && gamepad.buttons[gpMap.butSpace].pressed && !(previousButtonStates[gpIndex][gpMap.butSpace] || false)) {
					handleGameState("go");
				}

				if (GState.gameState != "title" && gpMap.butPause != undefined && gamepad.buttons[gpMap.butPause].pressed && !(previousButtonStates[gpIndex][gpMap.butPause] || false)) {
					handleGameState("pause");
				}
			}

			/* Scan gamepad buttons and axes and print to console
			let butstr = ""; let axstr = "";
			for (let b=0; b < gamepad.buttons.length; b++) butstr = butstr + ", B"+ b + ": " + ((gamepad.buttons[b].pressed) ? 1 : 0);
			for (let a=0; a < gamepad.axes.length; a++) axstr = axstr + ", A"+ a + ": " + (gamepad.axes[a]);
			console.log(butstr);
			console.log(axstr);
			//*/

			// Update previous state for next frame
			if (gpIndex > previousButtonStates.length - 1) {
				previousButtonStates[gpIndex] = [];
				previousAxisStates[gpIndex] = [];
			}
		    gamepad.buttons.forEach((button, index) => {
				previousButtonStates[gpIndex][index] = button.pressed;
			});
		    gamepad.axes.forEach((axis, index) => {
				previousAxisStates[gpIndex][index] = axis;
			});
		});
	}

	function setupTouchControlsForPlayer(player = null) {
		if (!('ontouchstart' in window)) return;

		const moveZone = document.getElementById('touchMoveZone');
		const rotateZone = document.getElementById('touchRotateZone');
		const strategyButton = document.getElementById('touchStrategyButton');
		const pauseButton = document.getElementById('touchPauseButton');
		const startButton = document.getElementById('touchStartButton');
		const graphicsButton = document.getElementById('touchGraphicsButton');
		const cameraButton = document.getElementById('touchCameraButton');

		const touchElements = [
			moveZone,
			rotateZone,
			strategyButton,
			pauseButton,
			startButton,
			graphicsButton,
			cameraButton
		];

		/*
		 * Odoberieme touch control z predchádzajúceho hráča
		 * a vynulujeme jeho aktuálne vstupy.
		 */
	
		if (touchControlState.player) {
			const previousPlayer = touchControlState.player;

			previousPlayer.isTouchControl = false;
			previousPlayer.controlInput.movex = 0;
			previousPlayer.controlInput.movey = 0;
			previousPlayer.controlInput.rotate = 0;
			previousPlayer.controlInput.rotX = 0;
			previousPlayer.controlInput.rotY = 0;
			previousPlayer.controlInput.boost = 0;
			previousPlayer.controlInput.lift = 0;
			previousPlayer.controlInput.strategy = 0;
		}

		touchControlState.player = player;

		/*
		 * Zrušíme rozpracované dotykové gestá.
		 */
		touchControlState.moveTouchId = null;
		touchControlState.moveStart = null;
		touchControlState.rotateTouchId = null;
		touchControlState.rotateStart = null;
		touchControlState.lastRotateTapTime = 0;

		/*
		 * Volanie bez hráča touch control iba odoberie.
		 */
		if (!player) {
			touchElements.forEach(el => {
				el.style.display = "none";
			});

			return;
		}

		player.isTouchControl = true;

		touchElements.forEach(el => {
			el.style.display = "block";
		});

		/*
		 * Event listenery pridáme iba pri prvom volaní.
		 * Pri ďalších volaniach používajú aktuálnu hodnotu
		 * touchControlState.player.
		 */
		if (touchControlState.initialized) {
			return;
		}

		touchControlState.initialized = true;

		// --- Pohyb ---
		moveZone.addEventListener("touchstart", e => {
			const activePlayer = touchControlState.player;
			if (!activePlayer) return;

			const touch = [...e.changedTouches].find(
				t => t.clientX < window.innerWidth / 2
			);

			if (!touch) return;

			touchControlState.moveTouchId = touch.identifier;
			touchControlState.moveStart = touch;
		});

		moveZone.addEventListener("touchmove", e => {
			const activePlayer = touchControlState.player;
			if (!activePlayer) return;

			const touch = [...e.touches].find(
				t => t.identifier === touchControlState.moveTouchId
			);

			if (!touch || !touchControlState.moveStart) return;

			const dx =
				(touch.clientX - touchControlState.moveStart.clientX) *
					touchAxis[camSetting.controlsRotation].x2x +
				(touch.clientY - touchControlState.moveStart.clientY) *
					touchAxis[camSetting.controlsRotation].y2x;

			const dy =
				(touch.clientX - touchControlState.moveStart.clientX) *
					touchAxis[camSetting.controlsRotation].x2y +
				(touch.clientY - touchControlState.moveStart.clientY) *
					touchAxis[camSetting.controlsRotation].y2y;

			const max = 20;

			activePlayer.controlInput.movex = clamp(dx / max, -1, 1);
			activePlayer.controlInput.movey = clamp(dy / max, -1, 1);
		});

		moveZone.addEventListener("touchend", e => {
			const activePlayer = touchControlState.player;

			if ([...e.changedTouches].some(t => t.identifier === touchControlState.moveTouchId) ) {
				touchControlState.moveTouchId = null;
				touchControlState.moveStart = null;

				if (activePlayer) {
					activePlayer.controlInput.movex = 0;
					activePlayer.controlInput.movey = 0;
				}
			}
		});

		moveZone.addEventListener("touchcancel", e => {
			const activePlayer = touchControlState.player;

			touchControlState.moveTouchId = null;
			touchControlState.moveStart = null;

			if (activePlayer) {
				activePlayer.controlInput.movex = 0;
				activePlayer.controlInput.movey = 0;
			}
		});

		// --- Rotácia + boost ---
		const doubleTapThreshold = 300;

		rotateZone.addEventListener("touchstart", e => {
			const activePlayer = touchControlState.player;
			if (!activePlayer) return;

			const touch = [...e.changedTouches].find(
				t => t.clientX >= window.innerWidth / 2
			);

			if (!touch) return;

			const now = Date.now();

			if (now - touchControlState.lastRotateTapTime < doubleTapThreshold ) {
				activePlayer.controlInput.boost = 1;
			}

			touchControlState.lastRotateTapTime = now;
			touchControlState.rotateTouchId = touch.identifier;
			touchControlState.rotateStart = touch;
		});

		rotateZone.addEventListener("touchmove", e => {
			const activePlayer = touchControlState.player;
			if (!activePlayer) return;

			const touch = [...e.touches].find(
				t => t.identifier === touchControlState.rotateTouchId
			);

			if (!touch || !touchControlState.rotateStart) return;

			activePlayer.controlInput.rotX =
				(touch.clientX - touchControlState.rotateStart.clientX) * touchAxis[camSetting.controlsRotation].x2x +
				(touch.clientY - touchControlState.rotateStart.clientY) * touchAxis[camSetting.controlsRotation].y2x;

			activePlayer.controlInput.rotY =
				(touch.clientX - touchControlState.rotateStart.clientX) * touchAxis[camSetting.controlsRotation].x2y +
				(touch.clientY - touchControlState.rotateStart.clientY) * touchAxis[camSetting.controlsRotation].y2y;
		});

		rotateZone.addEventListener("touchend", e => {
			const activePlayer = touchControlState.player;

			if ( [...e.changedTouches].some(t => t.identifier === touchControlState.rotateTouchId)) {
				touchControlState.rotateTouchId = null;
				touchControlState.rotateStart = null;

				if (activePlayer) {
					activePlayer.controlInput.rotate = 0;
					activePlayer.controlInput.rotX = 0;
					activePlayer.controlInput.rotY = 0;
					activePlayer.controlInput.boost = 0;
				}
			}
		});

		rotateZone.addEventListener("touchcancel", e => {
			const activePlayer = touchControlState.player;

			touchControlState.rotateTouchId = null;
			touchControlState.rotateStart = null;

			if (activePlayer) {
				activePlayer.controlInput.rotate = 0;
				activePlayer.controlInput.rotX = 0;
				activePlayer.controlInput.rotY = 0;
				activePlayer.controlInput.boost = 0;
			}
		});

		// --- Ostatné tlačidlá ---
		strategyButton.addEventListener("touchstart", () => {
			const activePlayer = touchControlState.player;

			if (activePlayer) {
				activePlayer.controlInput.strategy = 1;
			}
		});

		strategyButton.addEventListener("touchend", () => {
			const activePlayer = touchControlState.player;

			if (activePlayer) {
				activePlayer.controlInput.strategy = 0;
			}
		});

		pauseButton.addEventListener("touchstart", () => {
			if (touchControlState.player) {
				handleGameState("pause");
			}
		});

		startButton.addEventListener("touchstart", () => {
			if (touchControlState.player) {
				handleGameState("go");
			}
		});

		graphicsButton.addEventListener("touchstart", () => {
			if (!touchControlState.player) return;

			graphicsLevel = (graphicsLevel === 1) ? 0 : 1;
			setGraphicsLevel(graphicsLevel);
		});

		cameraButton.addEventListener("touchstart", () => {
			if (touchControlState.player) {
				switchCamera();
			}
		});
	}


	class HistoryTracker {
		constructor() {
			this.bufferSize = 61; // We need history up to 60 ticks ago
			this.frames = []; // Array of snapshot objects
			this.currentIndex = 0;
		}

		// Call this EVERY tick before physics update
		recordFrame(players) {
			// Create Snapshot (Keep this logic)
			const snapshot = players.map(p => ({
				x: p.x,
				y: p.y,
				angle: p.angle
			}));

			/*  DEBUG PRINT
			let historyStream = "";
			players.forEach((p, i) => {
				historyStream += `P${i}: {x:${p.x.toFixed(1)} y:${p.y.toFixed(1)} a:${p.angle.toFixed(2)}} | `;
			});
			console.log(historyStream);
			*/

			// Buffer Logic
			this.frames[this.currentIndex] = snapshot;
			this.currentIndex++;
			if (this.currentIndex >= this.bufferSize) {
				this.currentIndex = 0;
			}
		}

		// Get data from 'ticksAgo' (e.g., 30 or 60)
		getFrame(ticksAgo) {
			// Calculate the index in the circular buffer
			let index = this.currentIndex - 1 - ticksAgo;
			if (index < 0) index += this.bufferSize;

			// If game just started and we don't have history yet, return current frame
			return this.frames[index] || this.frames[this.currentIndex - 1] || null;
		}
	}

	let socketIoLoadingPromise = null;

	function loadSocketIoClient() {
		/*
		 * Knižnica už bola načítaná.
		 */
		if (typeof window.io === "function") {
			return Promise.resolve();
		}

		/*
		 * Knižnica sa práve načítava.
		 * Ďalšie volanie použije rovnaký Promise.
		 */
		if (socketIoLoadingPromise) {
			return socketIoLoadingPromise;
		}

		socketIoLoadingPromise = new Promise((resolve, reject) => {
			const script = document.createElement("script");
			script.src = "https://wild-cones-signaling.onrender.com/socket.io/socket.io.js";
			script.async = true;
			script.onload = function () {
				if (typeof window.io === "function") {
					resolve();
				} else {
					socketIoLoadingPromise = null;
					reject(new Error("Socket.IO script was loaded, but io() is unavailable."));
				}
			};

			script.onerror = function () {
				socketIoLoadingPromise = null;
				reject(new Error("Socket.IO client could not be loaded."));
			};

			document.head.appendChild(script);
		});

		return socketIoLoadingPromise;
	}

			return !!info && info.peerId === this.peerId;

			if (
				typeof this.onOnlinePlayersChanged ===

			) {
				this.onOnlinePlayersChanged(

				);
			}

			if (

		isGameplayControlSyncActive() {

			);

		queueIceCandidate(remotePeerId, candidate) {
			let candidates = this.pendingIceCandidates.get(remotePeerId);

			if (!candidates) {
				candidates = [];

				this.pendingIceCandidates.set(remotePeerId, candidates);
			}

			candidates.push(candidate);
		},

		async flushPendingIceCandidates(remotePeerId, peerConnection) {
			const candidates = this.pendingIceCandidates.get(remotePeerId);

			if (!candidates || candidates.length === 0) {
				return;
			}

			for (const candidate of candidates) {
				try {
					await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
				} catch (error) {
					console.error("[NetworkManager] Could not add queued ICE candidate:", error);
				}
			}

			this.pendingIceCandidates.delete(remotePeerId);
		},

		getPeerTransport(peerId) {
			const peer = this.peers.get(peerId);

			if (!peer) {
				return "connecting";

			return peer.transport || "connecting";

		setPeerTransport(peerId, transport, fallbackReason = "") {
			const peer = this.peers.get(peerId);

			if (!peer) {
				return false;
			}

			peer.transport = transport;
			peer.fallbackReason = fallbackReason;

			this.peers.set(peerId, peer);
			this.emitConnectionStateChanged();

			return true;
		},

		isVolatileNetworkMessage(message) {
			if (!message || typeof message.type !== "string") {
				return false;
			}

			return (
				message.type === "gameplay-state" ||
				message.type === "player-control-input" ||
				message.type === "players-control-input"
			);
		},

		getRemotePeerIds() {
			const peerIds = [];

			for (const [peerId, peer] of this.peers.entries()) {
				if (peerId === this.peerId) {
					continue;
				}

				if (!peer || !peer.role) {
					continue;
				}

				peerIds.push(peerId);
			}

			return peerIds;
		},

		broadcastDataMessage(message) {
			let sentCount = 0;

			for (const peerId of this.getRemotePeerIds()) {
				if (this.sendDataMessage(peerId, message)) {
					sentCount++;
				}
			}

			return sentCount;
		},

		broadcastGameplayMessage(message) {
			if (!message) {
				return 0;
			}

			let sentCount = 0;

			for (const peerId of this.getRemotePeerIds()) {
				if (this.sendGameplayMessage(peerId, message)) {
					sentCount++;
				}
			}

			return sentCount;
		},

		getPeerTransportLabel(peerId) {
			const transport = this.getPeerTransport(peerId);

			switch (transport) {
				case "webrtc":
					return "Direct P2P";

				case "socket-relay":
					return "Server relay";

				case "failed":
					return "Connection failed";

				default:
					return "Establishing direct P2P...";
			}
		},

		/* --------------------------------------------------------------- */
		/* Socket.IO connection                                            */
		/* --------------------------------------------------------------- */

		async connect() {
			if (this.socket && this.socket.connected) {
				this.peerId = this.socket.id;
				return true;
			}

			if (this.connectPromise) {
				return this.connectPromise;
			}

			if (typeof io !== "function") {
				throw new Error(
					"Socket.IO client is not loaded."
				);
			}

			this.socket = window.io(
				this.SIGNALING_URL,
				{
					transports: ["websocket", "polling"],
					timeout: 20000,
					reconnection: true,
					reconnectionAttempts: 10,
					reconnectionDelay: 1000
				}
			);

			this.installSocketHandlers();

			this.connectPromise = new Promise(
				(resolve, reject) => {
					const timeoutId = setTimeout(() => {
						this.connectPromise = null;

						reject(
							new Error(
								"Connection to signaling server timed out."
							)
						);
					}, 20000);

					this.socket.once("connect", () => {
						clearTimeout(timeoutId);

						this.peerId = this.socket.id;
						this.connectPromise = null;

						console.log(
							"[NetworkManager] Signaling connected:",
							this.peerId
						);

						this.emitConnectionStateChanged();
						resolve(true);
					});

					this.socket.once(
						"connect_error",
						(error) => {
							clearTimeout(timeoutId);

							this.connectPromise = null;
							reject(error);
						}
					);
				}
			);

			return this.connectPromise;
		},

		installSocketHandlers() {
			this.socket.on("connect", () => {
				const onlineSessionWasActive = !!this.roomName && !!this.role;

				this.peerId = this.socket.id;

				console.log("[NetworkManager] Socket connected:", this.peerId);

				if (onlineSessionWasActive && this.socket.recovered === false) {
					console.warn("[NetworkManager] Socket session was not recovered.");

					this.closeAllPeerConnections();
					this.clearOnlineSessionState();

					this.showGameMessage("Online session could not be restored.");
				}

				this.emitConnectionStateChanged();
			});

			
			this.socket.on("connect_error", (error) => {
				this.reportError(error);
				this.emitConnectionStateChanged();
			});

			this.socket.on("disconnect", (reason) => {
				console.warn(
					"[NetworkManager] Socket disconnected:",
					reason
				);

				/*
				 * Pri dočasnom výpadku Socket.IO ponecháme WebRTC
				 * spojenia. Ak sa neskôr nepripoja, môžeš doplniť
				 * explicitný timeout.
				 */
				this.emitConnectionStateChanged();
			});

			this.socket.on("rooms:list", (payload) => {
				this.publicRooms =
					Array.isArray(payload?.rooms)
						? payload.rooms
						: [];

				if (
					typeof this.onPublicRoomsChanged ===
					"function"
				) {
					this.onPublicRoomsChanged(
						this.publicRooms
					);
				}
			});

			this.socket.on(
				"room:guest-joined",
				async (payload) => {
					if (!this.isHost()) {
						return;
					}

					try {
						await this.handleGuestJoined(payload);
					} catch (error) {
						this.reportError(error);
					}
				}
			);

			this.socket.on("room:guest-left", (payload) => {
				if (!this.isHost()) {
					return;
				}

				this.handleGuestLeft(payload.peerId);
			});

			this.socket.on("room:closed", (payload) => {
				console.warn(
					"[NetworkManager] Room closed:",
					payload
				);

				this.closeAllPeerConnections();
				this.clearOnlineSessionState();
			});

			this.socket.on("room:kicked", (payload) => {
				console.warn(
					"[NetworkManager] Removed from room:",
					payload
				);

				this.closeAllPeerConnections();
				this.clearOnlineSessionState();
			});

			this.socket.on(
				"webrtc:signal",
				async (payload) => {
					try {
						await this.handleWebRtcSignal(
							payload
						);
					} catch (error) {
						this.reportError(error);
					}
				}
			);

			this.socket.on("room:data", (payload) => {
				const sourcePeerId = payload?.sourcePeerId;
				const message = payload?.message;

				if (
					typeof sourcePeerId !== "string" ||
					!message ||
					typeof message !== "object"
				) {
					return;
				}

				/*
				 * Relay správu prijmeme iba od peera,
				 * ktorý je známy v aktuálnej miestnosti.
				 */
				if (!this.peers.has(sourcePeerId)) {
					return;
				}

				this.handleDataMessage(sourcePeerId, message);
			});

			this.socket.on("room:relay-enabled", (payload) => {
				const peerId = payload?.peerId;

				if (typeof peerId !== "string" || !this.peers.has(peerId)) {
					return;
				}

				const previousTransport = this.getPeerTransport(peerId);

				if (previousTransport === "socket-relay") {
					return;
				}

				console.log(
					"[NetworkManager] Socket.IO relay enabled:",
					peerId
				);

				this.clearWebRtcConnectionTimeout(peerId);
				this.relayRequestsPending.delete(peerId);

				this.setPeerTransport(
					peerId,
					"socket-relay",
					"Direct P2P connection unavailable"
				);

				/*
				 * Zatvoríme neúspešné alebo rozpracované
				 * WebRTC spojenie.
				 */
				this.closePeerConnection(peerId);

				/*
				 * Relay je pripravený na prenos správ.
				 */
				this.sendDataMessage(peerId, {
					type: "hello",
					peerId: this.peerId,
					playerName: this.playerName,
					role: this.role
				});

				if (this.isHost()) {
					this.sendInitialStateToPeer(peerId);
				}
			});

		},

		sendSocketRelayMessage(peerId, message) {
			if (!this.socket || !this.socket.connected) {
				return false;
			}

			const delivery = this.isVolatileNetworkMessage(message)
				? "volatile"
				: "reliable";

			const payload = {
				targetPeerId: peerId,
				delivery: delivery,
				message: message
			};

			if (delivery === "volatile") {
				this.socket.volatile.emit("room:data", payload);
			} else {
				this.socket.emit("room:data", payload);
			}

			return true;
		},

		requestSocketRelay(peerId, reason = "") {
			if (!this.socket || !this.socket.connected) {
				return false;
			}

			if (this.getPeerTransport(peerId) === "socket-relay") {
				return true;
			}

			if (this.relayRequestsPending.has(peerId)) {
				return true;
			}

			this.relayRequestsPending.add(peerId);

			console.log(
				"[NetworkManager] Requesting Socket.IO relay:",
				peerId,
				reason
			);

			this.socket.timeout(10000).emit(
				"room:enable-relay",
				{
					targetPeerId: peerId
				},
				(timeoutError, response) => {
					if (timeoutError) {
						this.relayRequestsPending.delete(peerId);

						console.error(
							"[NetworkManager] Relay request timed out:",
							peerId
						);

						return;
					}

					if (!response?.ok) {
						this.relayRequestsPending.delete(peerId);

						console.error(
							"[NetworkManager] Relay request failed:",
							response?.error
						);
					}
				}
			);

			return true;
		},


		/* --------------------------------------------------------------- */
		/* Public room operations                                          */
		/* --------------------------------------------------------------- */

		async listPublicRooms() {
			await this.connect();

			return new Promise((resolve) => {
				this.socket.timeout(10000).emit(
					"rooms:list",
					(timeoutError, response) => {
						if (timeoutError) {
							resolve({
								ok: false,
								error:
									"The signaling server did not respond."
							});
							return;
						}

						if (response?.ok) {
							this.publicRooms =
								Array.isArray(response.rooms)
									? response.rooms
									: [];

							if (
								typeof
									this.onPublicRoomsChanged ===
								"function"
							) {
								this.onPublicRoomsChanged(
									this.publicRooms
								);
							}
						}

						resolve(response);
					}
				);
			});
		},

		async hostGame(
			roomName,
			playerName,
			isPublic,
			hostPlayerIndex
		) {
			await this.connect();

			const validHostIndex =
				this.validatePlayerIndex(hostPlayerIndex)
					? hostPlayerIndex
					: 0;

			return new Promise((resolve) => {
				this.socket.timeout(10000).emit(
					"room:create",
					{
						name: roomName,
						playerName: playerName,
						isPublic: isPublic === true
					},
					(timeoutError, response) => {
						if (timeoutError) {
							resolve({
								ok: false,
								error:
									"The signaling server did not respond."
							});
							return;
						}

						if (!response?.ok) {
							resolve(response);
							return;
						}

						this.mode = "online";
						this.role = "host";

						this.roomName =
							response.room.name;

						this.roomIsPublic =
							response.room.isPublic === true;

						this.peerId =
							response.room.peerId;

						this.playerName =
							response.room.playerName;

						this.hostPeerId =
							response.room.peerId;

						this.hostPlayerName =
							response.room.playerName;

						this.localPlayerIndex =
							validHostIndex;

						this.onlinePlayers = [
							null,
							null,
							null,
							null
						];

						this.peers.clear();
						this.peerToPlayerIndex.clear();

						this.peers.set(this.peerId, {
							peerId: this.peerId,
							playerName: this.playerName,
							role: "host",
							ready: true,
							transport: "connecting",
							fallbackReason: "",
						});

						this.assignPeerToPlayerIndex(
							this.peerId,
							this.playerName,
							"host",
							validHostIndex
						);

						this.emitOnlinePlayersChanged();
						resolve(response);
					}
				);
			});
		},

		async joinGame(roomName, playerName) {
			await this.connect();

			return new Promise((resolve) => {
				this.socket.timeout(10000).emit(
					"room:join",
					{
						name: roomName,
						playerName: playerName
					},
					(timeoutError, response) => {
						if (timeoutError) {
							resolve({
								ok: false,
								error:
									"The signaling server did not respond."
							});
							return;
						}

						if (
							!response?.ok &&
							response?.error === "The room host is temporarily disconnected. Please try again shortly." &&
							pendingOnlineInvitation
						) {
							if (Date.now() - pendingOnlineInvitation.retryStartedAt < 60000) {
								pendingOnlineInvitation.joinStarted = false;

								setTimeout(() => {
									tryJoinPendingInvitation();
								}, 2000);

								resolve({
									ok: false,
									retrying: true,
									error: response.error
								});
							} else {
								pendingOnlineInvitation = null;

								OnlineLobbyDialogs.showJoinError(
									"The room host did not reconnect."
								);

								resolve({
									ok: false,
									retrying: false,
									error: "The room host did not reconnect."
								});
							}

							return;
						}					

						if (!response?.ok) {
							resolve(response);
							return;
						}

						this.mode = "online";
						this.role = "guest";

						this.roomName =
							response.room.name;

						this.roomIsPublic =
							response.room.isPublic === true;

						this.peerId =
							response.room.peerId;

						this.playerName =
							response.room.playerName;

						this.hostPeerId =
							response.room.hostPeerId;

						this.hostPlayerName =
							response.room.hostPlayerName;

						this.localPlayerIndex = null;

						this.onlinePlayers = [
							null,
							null,
							null,
							null
						];

						this.peers.clear();
						this.peerToPlayerIndex.clear();

						this.peers.set(this.peerId, {
							peerId: this.peerId,
							playerName: this.playerName,
							role: "guest",
							ready: false,
							transport: "connecting",
							fallbackReason: "",
						});

						this.peers.set(this.hostPeerId, {
							peerId: this.hostPeerId,
							playerName:
								this.hostPlayerName,
							role: "host",
							ready: true,
							transport: "connecting",
							fallbackReason: "",
						});

						this.emitConnectionStateChanged();
						resolve(response);
					}
				);
			});
		},

		leaveGame() {
			if (this.socket?.connected) {
				this.socket.emit(
					"room:leave",
					() => {}
				);
			}

			this.closeAllPeerConnections();
			this.clearOnlineSessionState();
		},


		/* --------------------------------------------------------------- */
		/* Guest registration on host                                      */
		/* --------------------------------------------------------------- */

		async handleGuestJoined(payload) {
			const guestPeerId = payload?.peerId;
			const guestPlayerName = payload?.playerName;

			if (
				typeof guestPeerId !== "string" ||
				typeof guestPlayerName !== "string"
			) {
				throw new Error(
					"Invalid room:guest-joined payload."
				);
			}

			this.peers.set(guestPeerId, {
				peerId: guestPeerId,
				playerName: guestPlayerName,
				role: "guest",
				ready: false,
				transport: "connecting",
				fallbackReason: "",
			});

			const defaultPlayerIndex =
				this.findDefaultPlayerIndexForGuest();

			if (defaultPlayerIndex === null) {
				throw new Error(
					"No free player slot is available."
				);
			}

			this.assignPeerToPlayerIndex(
				guestPeerId,
				guestPlayerName,
				"guest",
				defaultPlayerIndex
			);

			if (this.forceSocketRelay) {
				this.requestSocketRelay(guestPeerId, "Forced relay test");
			} else {
				await this.createHostPeerConnection(guestPeerId);
			}


			this.emitOnlinePlayersChanged();
			this.broadcastOnlinePlayerState();
		},

		handleGuestLeft(peerId) {
			this.remoteControlInputs.delete(peerId);
			this.lastReceivedInputSequence.delete(peerId);

			this.removePeerAssignment(peerId);
			this.closePeerConnection(peerId);

			this.emitOnlinePlayersChanged();
			this.broadcastOnlinePlayerState();

			this.clearWebRtcConnectionTimeout(peerId);
			this.relayRequestsPending.delete(peerId);
		},

		findDefaultPlayerIndexForGuest() {
			/*
			 * Požadované základné pravidlo:
			 *
			 * host na Player 1, index 0:
			 *     preferuj Player 4, index 3
			 *
			 * host na inom indexe:
			 *     preferuj Player 2, index 1
			 */
			const preferredIndex =
				this.localPlayerIndex <= 1 ? 2 : 0;

			if (this.isPlayerIndexFree(preferredIndex)) {
				return preferredIndex;
			}

			for (let index = 0; index < 4; index += 1) {
				if (this.isPlayerIndexFree(index)) {
					return index;
				}
			}

			return null;
		},


		/* --------------------------------------------------------------- */
		/* Player assignment                                               */
		/* --------------------------------------------------------------- */

		validatePlayerIndex(playerIndex) {
			return (
				Number.isInteger(playerIndex) &&
				playerIndex >= 0 &&
				playerIndex <= 3
			);
		},

		isPlayerIndexFree(playerIndex) {
			return (
				this.validatePlayerIndex(playerIndex) &&
				this.onlinePlayers[playerIndex] === null
			);
		},

		findPeerPlayerIndex(peerId) {
			const storedIndex =
				this.peerToPlayerIndex.get(peerId);

			return this.validatePlayerIndex(storedIndex)
				? storedIndex
				: null;
		},

		assignPeerToPlayerIndex(
			peerId,
			playerName,
			role,
			playerIndex
		) {
			if (!this.validatePlayerIndex(playerIndex)) {
				return false;
			}

			const currentOccupant =
				this.onlinePlayers[playerIndex];

			if (
				currentOccupant &&
				currentOccupant.peerId !== peerId
			) {
				return false;
			}

			const oldIndex =
				this.findPeerPlayerIndex(peerId);

			if (
				oldIndex !== null &&
				oldIndex !== playerIndex
			) {
				this.onlinePlayers[oldIndex] = null;
			}

			this.onlinePlayers[playerIndex] = {
				playerIndex: playerIndex,
				peerId: peerId,
				playerName: playerName,
				role: role
			};

			this.peerToPlayerIndex.set(
				peerId,
				playerIndex
			);

			return true;
		},

		removePeerAssignment(peerId) {
			const playerIndex =
				this.findPeerPlayerIndex(peerId);

			if (playerIndex !== null) {
				this.onlinePlayers[playerIndex] = null;
			}

			this.peerToPlayerIndex.delete(peerId);
			this.peers.delete(peerId);

			this.updateLocalPlayerIndex();
		},

		requestLocalPlayerIndex(playerIndex) {
			if (!this.isGuest()) {
				return false;
			}

			if (!this.validatePlayerIndex(playerIndex)) {
				return false;
			}

			return this.sendDataMessage(
				this.hostPeerId,
				{
					type: "request-player-index",
					requestedPlayerIndex:
						playerIndex
				}
			);
		},

		changeLocalPlayerIndex(playerIndex) {
			if (!this.isOnline()) {
				return false;
			}

			if (!this.validatePlayerIndex(playerIndex)) {
				return false;
			}

			const currentPlayerIndex = this.findPeerPlayerIndex(this.peerId);

			// Hráč už je priradený k požadovanému indexu.
			if (currentPlayerIndex === playerIndex) {
				return false;
			}

			const currentOccupant = this.onlinePlayers[playerIndex];

			// Cieľový Player je obsadený iným online hráčom.
			if (currentOccupant && currentOccupant.peerId !== this.peerId) {
				this.showGameMessage("Player " + (playerIndex + 1) + " is already occupied.");

				return false;
			}

			if (this.isGuest()) {
				// Guest neposúva hráča lokálne. Pošle požiadavku hostovi a počká na nový autoritatívny online-player-state.
				const sent = this.requestLocalPlayerIndex(playerIndex);

				if (!sent) {
					this.showGameMessage("Player assignment request could not be sent.");
				}

				return sent;
			}

			if (this.isHost()) {
				// Host je autorita a môže svoje priradenie zmeniť priamo.
				const assigned =
					this.assignPeerToPlayerIndex(
						this.peerId,
						this.playerName,
						"host",
						playerIndex
					);

				if (!assigned) {
					this.showGameMessage("Player " + (playerIndex + 1) + " could not be assigned.");

					return false;
				}

				// Aktualizujeme localPlayerIndex a vyvoláme existujúci callback, ktorý aplikuje zmenu na lokálne players[].
				this.emitOnlinePlayersChanged();

				// Nové priradenie odošleme všetkým guestom.
				this.broadcastOnlinePlayerState();

				return true;
			}

			return false;
		},

		handlePlayerIndexRequest(
			requesterPeerId,
			requestedPlayerIndex
		) {
			if (!this.isHost()) {
				return;
			}

			if (
				!this.validatePlayerIndex(
					requestedPlayerIndex
				)
			) {
				this.sendDataMessage(
					requesterPeerId,
					{
						type:
							"player-index-request-result",
						accepted: false,
						requestedPlayerIndex:
							requestedPlayerIndex,
						reason:
							"Invalid player index."
					}
				);

				return;
			}

			const requester =
				this.peers.get(requesterPeerId);

			if (
				!requester ||
				requester.role !== "guest"
			) {
				return;
			}

			const currentOccupant =
				this.onlinePlayers[
					requestedPlayerIndex
				];

			if (
				currentOccupant &&
				currentOccupant.peerId !==
					requesterPeerId
			) {
				this.sendDataMessage(
					requesterPeerId,
					{
						type:
							"player-index-request-result",
						accepted: false,
						requestedPlayerIndex:
							requestedPlayerIndex,
						reason:
							"The selected player is occupied."
					}
				);

				return;
			}

			const assigned =
				this.assignPeerToPlayerIndex(
					requesterPeerId,
					requester.playerName,
					requester.role,
					requestedPlayerIndex
				);

			this.sendDataMessage(
				requesterPeerId,
				{
					type:
						"player-index-request-result",
					accepted: assigned,
					requestedPlayerIndex:
						requestedPlayerIndex,
					reason: assigned
						? ""
						: "The selected player could not be assigned."
				}
			);

			if (assigned) {
				this.emitOnlinePlayersChanged();
				this.broadcastOnlinePlayerState();
			}
		},

		updateLocalPlayerIndex() {
			const previousIndex = this.localPlayerIndex;

			if (!this.peerId) {
				this.localPlayerIndex = null;
			} else {
				this.localPlayerIndex = this.findPeerPlayerIndex(this.peerId);
			}

			if (previousIndex !== this.localPlayerIndex) {
				this.localPlayerAuthoritativeState = null;
				this.localPlayerAuthoritativeStateReceivedAt = 0;

			const newOnlinePlayers = [
				null,
				null,
				null,
				null

			this.peerToPlayerIndex.clear();

			for (
				let index = 0;
				index < state.players.length;
				index += 1
			) {
				const playerInfo =
					state.players[index];

				if (!playerInfo) {

				const playerIndex =
					playerInfo.playerIndex;

				if (
					!this.validatePlayerIndex(

					peerId: playerInfo.peerId,

			if (typeof state.goalScored === "boolean") {

		storeLocalPlayerAuthoritativeState(state) {

		getShortestAngleDifference(targetAngle, currentAngle) {
			let difference = targetAngle - currentAngle;

			while (difference > Math.PI) {

			while (difference < -Math.PI) {
				difference += 2 * Math.PI;
			}

			return difference;

		updateLocalPlayerReconciliation() {
			if (!this.isGuest() || this.localPlayerIndex === null || !this.localPlayerAuthoritativeState) {
				return;
			}

			const player = players[this.localPlayerIndex];

			if (!player) {
				return;
			}

			const now = performance.now();

			let deltaTimeMs;

			if (this.lastLocalPlayerSmoothingTime > 0) {
				deltaTimeMs = now - this.lastLocalPlayerSmoothingTime;
			} else {
				deltaTimeMs = 1000 / FPS_TARGET;
			}

			this.lastLocalPlayerSmoothingTime = now;

			/*
			 * Ochrana pred veľkým časovým skokom,
			 * napríklad po prepnutí browser tabu.
			 */
			deltaTimeMs = clamp(deltaTimeMs, 0, 50);

			const state = this.localPlayerAuthoritativeState;

			/*
			 * Snapshot je pri prijatí už mierne starý.
			 *
			 * Preto odhadneme, kde by sa autoritatívny
			 * hráč nachádzal teraz.
			 *
			 * vx a vy sú v tejto hre hodnoty na frame,
			 * preto čas prepočítame na počet frame.
			 */
			const snapshotAgeMs = now - this.localPlayerAuthoritativeStateReceivedAt + this.estimatedOneWayLatencyMs;
			const snapshotAgeFrames = clamp(snapshotAgeMs / (1000 / FPS_TARGET), 0, 6);
			const targetX = state.x + state.vx * snapshotAgeFrames;
			const targetY = state.y + state.vy * snapshotAgeFrames;
			const targetAngle = normalizeAngle(state.angle + state.rotSpeed * snapshotAgeFrames);
			const differenceX = targetX - player.x;
			const differenceY = targetY - player.y;
			const positionError = Math.hypot(differenceX, differenceY);
			const angleError = this.getShortestAngleDifference(targetAngle, player.angle);

			/*
			 * Veľké odchýlky sa nesmú vyrovnávať pomaly.
			 *
			 * Môžu znamenať kolíziu, reset pozícií,
			 * začiatok hry alebo návrat po góle.
			 */
			if (positionError > this.localPlayerHardSnapDistance || Math.abs(angleError) > this.localPlayerHardSnapAngle) {
				player.x = targetX;
				player.y = targetY;
				player.prevX = state.prevX;
				player.prevY = state.prevY;
				player.angle = targetAngle;
				player.prevAngle = state.prevAngle;
				player.vx = state.vx;
				player.vy = state.vy;
				player.rotSpeed = state.rotSpeed;

				return;
			}

			/*
			 * Exponenciálny smoothing je nezávislý
			 * od aktuálneho FPS.
			 */
			const positionCorrectionFactor = 1 - Math.exp(-deltaTimeMs / this.localPlayerPositionCorrectionTime );
			const angleCorrectionFactor = 1 - Math.exp( -deltaTimeMs / this.localPlayerAngleCorrectionTime );
			const velocityCorrectionFactor = 1 - Math.exp( -deltaTimeMs / this.localPlayerVelocityCorrectionTime );

			/*
			 * Veľmi malú pozičnú chybu ignorujeme,
			 * aby hráč neustále jemne nevibroval.
			 */
			if (positionError > this.localPlayerPositionDeadZone) {
				player.x += differenceX * positionCorrectionFactor;
				player.y += differenceY * positionCorrectionFactor;
			}

			/*
			 * Rovnako ignorujeme zanedbateľnú
			 * odchýlku uhla.
			 */
			if (Math.abs(angleError) > this.localPlayerAngleDeadZone) {
				player.angle = normalizeAngle(player.angle + angleError * angleCorrectionFactor);
			}

			/*
			 * Rýchlosť korigujeme pomalšie.
			 */
			if (typeof state.vx === "number") {
				player.vx += (state.vx - player.vx ) * velocityCorrectionFactor;
			}

			if (typeof state.vy === "number") {
				player.vy += (state.vy - player.vy ) * velocityCorrectionFactor;
			}

			if (typeof state.rotSpeed === "number") {
				player.rotSpeed += (state.rotSpeed - player.rotSpeed) * velocityCorrectionFactor;
			}

			/*
			 * Nefyzikálne gameplay hodnoty môžeme

			if (

		storeRemotePlayerState(playerState) {

		applyPuckGameplayState(state) {

				return;
			}

			/*
			 * Offline alebo host môže stále použiť
			 * priame aplikovanie, ak by to bolo potrebné.

			if (!this.isGuest()) {

				puckObj.y = state.y;
				puckObj.prevX = state.prevX;
				puckObj.prevY = state.prevY;

				y:		state.y,
				prevX:	state.prevX,

		updateRemotePlayersSmoothing(deltaTimeMs) {
			if (!this.isGuest()) {
				return;
			}

			const positionFactor = 1 - Math.exp( -deltaTimeMs / this.remotePlayerSmoothingTime);
			const velocityFactor = 1 - Math.exp( -deltaTimeMs / this.remotePlayerVelocitySmoothingTime);

			for (const [playerIndex, state] of this.remotePlayerStates.entries()) {

				if (playerIndex === this.localPlayerIndex) {
					continue;
				}

				const player = players[playerIndex];

				if (!player || !state) {
					continue;
				}

				/*
				 * Extrapolujeme prijatý snapshot smerom
				 * k súčasnému času.
				 *
				 * vx, vy a rotSpeed sú podľa doterajšieho
				 * modelu hodnoty na jeden 60 Hz frame.
				 */
				const stateAgeMs = performance.now() - state.receivedAt;
				const stateAgeFrames = clamp(stateAgeMs / (1000 / 60), 0, 4);
				const targetX = state.x + state.vx * stateAgeFrames;
				const targetY = state.y + state.vy * stateAgeFrames;
				const targetAngle = normalizeAngle(state.angle + state.rotSpeed * stateAgeFrames);
				const dx = targetX - player.x;
				const dy = targetY - player.y;
				const distance = Math.hypot(dx, dy);
				const angleDifference = this.getShortestAngleDifference(targetAngle, player.angle);

				if (distance > this.remotePlayerHardSnapDistance || Math.abs(angleDifference) > this.remoteAngleHardSnap) {
					player.x = targetX;
					player.y = targetY;
					player.prevX = state.prevX;
					player.prevY = state.prevY;
					player.angle = targetAngle;
					player.prevAngle = state.prevAngle;
					player.vx = state.vx;
					player.vy = state.vy;
					player.rotSpeed = state.rotSpeed;

					continue;
				}

				player.x += dx * positionFactor;
				player.y += dy * positionFactor;
				player.angle = normalizeAngle(player.angle + angleDifference * positionFactor);
				player.vx += (state.vx - player.vx) * velocityFactor;
				player.vy += (state.vy - player.vy) * velocityFactor;
				player.rotSpeed += (state.rotSpeed - player.rotSpeed) * velocityFactor;
			}
		},

		updateRemotePuckSmoothing(deltaTimeMs) {
			if (!this.isGuest() || !this.remotePuckState || !puckObj) {
				return;
			}

			const state = this.remotePuckState;
			const stateAgeMs = performance.now() - state.receivedAt;
			const stateAgeFrames = clamp(stateAgeMs / (1000 / 60), 0, 4);
			const targetX = state.x + state.vx * stateAgeFrames;
			const targetY = state.y + state.vy * stateAgeFrames;
			const dx = targetX - puckObj.x;
			const dy = targetY - puckObj.y;
			const distance = Math.hypot(dx, dy);

			/*
			 * Reset puku, gól alebo veľká kolízia.
			 */
			if (
				distance >
				this.remotePuckHardSnapDistance
			) {
				puckObj.x = targetX;
				puckObj.y = targetY;
				puckObj.prevX = state.prevX;
				puckObj.prevY = state.prevY;
				puckObj.vx = state.vx;
				puckObj.vy = state.vy;

				return;
			}

			const positionFactor = 1 - Math.exp( -deltaTimeMs / this.remotePuckSmoothingTime);
			const velocityFactor = 1 - Math.exp( -deltaTimeMs /this.remotePuckVelocitySmoothingTime);

			puckObj.x += dx * positionFactor;
			puckObj.y += dy * positionFactor;
			puckObj.vx += (state.vx - puckObj.vx) * velocityFactor;
			puckObj.vy += (state.vy - puckObj.vy) * velocityFactor;

		updateRemoteObjectsSmoothing() {

				typeof msgExpireTime !== "undefined"

				msgExpireTime =
					Date.now() +
					(
						typeof MSG_TIME !==
						"undefined"
							? MSG_TIME
							: 2000

			}

				"[NetworkManager]",
				text
			);
