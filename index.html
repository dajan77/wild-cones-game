		handleChatMessage(remotePeerId, message) {
			if (!message || typeof message.text !== "string"
			) {
				return;
			}

			const cleanText = message.text
				.trim()
				.replace(/\s+/g, " ")
				.slice(0, 160);

			if (!cleanText) {
				return;
			}

			if (this.isHost()) {
				/*
				 * Host dôveruje identite peera zo spojenia,
				 * nie menu uvedenému v správe.
				 */
				const peer = this.peers.get(remotePeerId);

				if (!peer || peer.role !== "guest") {
					return;
				}

				OnlineChat.addMessage(
					remotePeerId,
					peer.playerName,
					cleanText,
					false
				);

				/*
				 * Prepošleme správu všetkým ostatným guestom.
				 */
				for (const peerId of this.getRemotePeerIds()) {
					if (peerId === remotePeerId) {
						continue;
					}

					this.sendDataMessage(
						peerId,
						{
							type: "chat-message",
							senderPeerId: remotePeerId,
							playerName: peer.playerName,
							text: cleanText
						}
					);
				}

				return;
			}

			if (this.isGuest()) {
				/*
				 * Guest prijíma chatové správy iba od hosta.
				 * Host môže posielať vlastnú správu alebo
				 * preposlať správu iného guesta.
				 */
				if (remotePeerId !== this.hostPeerId) {
					return;
				}

				const senderPeerId =
					typeof message.senderPeerId === "string"
						? message.senderPeerId
						: this.hostPeerId;

				let playerName = message.playerName;

				if (typeof playerName !== "string" || !playerName) {
					const peer = this.peers.get(senderPeerId);

					playerName = peer ? peer.playerName : "Player";
				}

				OnlineChat.addMessage(
					senderPeerId,
					playerName,
					cleanText,
					false
				);
			}
		},

		handleChatCommand(text) {
			const trimmedText = String(text).trim();

			if (!trimmedText.toLowerCase().startsWith("/kick ")) {
				return false;
			}

			if (!this.isHost()) {
				this.showGameMessage("Only the host can kick players.");
				return true;
			}

			const requestedPlayerName = trimmedText
				.substring(6)
				.trim()
				.toLowerCase();

			if (!requestedPlayerName) {
				this.showGameMessage("Usage: /kick playername");
				return true;
			}

			let targetPeerId = null;
			let targetPlayerName = "";

			for (const [peerId, peer] of this.peers.entries()) {
				if (
					peerId !== this.peerId &&
					peer.role === "guest" &&
					peer.playerName.toLowerCase() === requestedPlayerName
				) {
					targetPeerId = peerId;
					targetPlayerName = peer.playerName;
					break;
				}
			}

			if (!targetPeerId) {
				this.showGameMessage(
					'Online player "' + requestedPlayerName + '" was not found.'
				);

				return true;
			}

			this.kickPeer(targetPeerId)
				.then(result => {
					if (result && result.ok) {
						this.showGameMessage(
							targetPlayerName + " was removed from the room."
						);
					} else {
						this.showGameMessage(
							result?.error || "The player could not be removed."
						);
					}
				})
				.catch(error => {
					console.error("[NetworkManager] Kick failed:", error);

					this.showGameMessage(
						"The player could not be removed."
					);
				});

			return true;
		},


		sendChatMessage(text) {
			if (!this.isOnline()) {
				return false;
			}

			const cleanText = String(text)
				.trim()
				.replace(/\s+/g, " ")
				.slice(0, 160);

			if (!cleanText) {
				return false;
			}

			if (cleanText.startsWith("/")) {
				const commandHandled =
					this.handleChatCommand(cleanText);

				if (commandHandled) {
					return true;
				}

				this.showGameMessage("Unknown chat command.");
				return true;
			}

			OnlineChat.addMessage(
				this.peerId,
				this.playerName,
				cleanText,
				true
			);

			if (this.isHost()) {
				this.broadcastDataMessage({
					type: "chat-message",
					senderPeerId: this.peerId,
					playerName: this.playerName,
					text: cleanText
				});

				return true;
			}

			if (this.isGuest()) {
				return this.sendDataMessage(
					this.hostPeerId,
					{
						type: "chat-message",
						text: cleanText
					}
				);
			}

			return false;
		},

		/* --------------------------------------------------------------- */
		/* WebRTC                                                          */
		/* --------------------------------------------------------------- */

		createPeerConnection(remotePeerId) {
			const existingConnection =
				this.peerConnections.get(
					remotePeerId
				);

			if (existingConnection) {
				return existingConnection;
			}

			const peerConnection = new RTCPeerConnection(this.rtcConfig);

			this.peerConnections.set(remotePeerId, peerConnection);
			this.setPeerTransport(remotePeerId, "connecting");
			this.startWebRtcConnectionTimeout(remotePeerId);

			peerConnection.onicecandidate =
				(event) => {
					if (!event.candidate) {
						console.log(
							"[NetworkManager] ICE gathering complete:",
							remotePeerId
						);

						return;
					}

					console.log(
						"[NetworkManager] Local ICE candidate:",
						remotePeerId,
						event.candidate.type,
						event.candidate.protocol
					);

					this.sendWebRtcSignal(
						remotePeerId,
						"ice-candidate",
						event.candidate.toJSON()
					);
				};

			peerConnection.ondatachannel =
				(event) => {
					this.setupDataChannel(
						remotePeerId,
						event.channel
					);
				};

			peerConnection.onconnectionstatechange = () => {
				const state = peerConnection.connectionState;

				console.log(
					"[NetworkManager] Peer",
					remotePeerId,
					state
				);

				if (state === "connected") {
					/*
					 * Transport sa označí ako webrtc až pri
					 * otvorení DataChannel.
					 */
					this.emitConnectionStateChanged();
					return;
				}

				if (state === "failed") {
					this.requestSocketRelay(
						remotePeerId,
						"WebRTC connection failed"
					);

					return;
				}

				this.emitConnectionStateChanged();
			};

			peerConnection.oniceconnectionstatechange = () => {
				const iceState = peerConnection.iceConnectionState;

				console.log(
					"[NetworkManager] ICE peer",
					remotePeerId,
					iceState
				);

				if (iceState === "failed") {
					this.requestSocketRelay(
						remotePeerId,
						"ICE connection failed"
					);
				}
			};

			peerConnection.onicegatheringstatechange =
				() => {
					console.log(
						"[NetworkManager] ICE gathering",
						remotePeerId,
						peerConnection.iceGatheringState
					);
				};

			return peerConnection;
		},

		async createHostPeerConnection(
			guestPeerId
		) {
			const peerConnection =
				this.createPeerConnection(
					guestPeerId
				);

			const dataChannel =
				peerConnection.createDataChannel(
					"wild-cones-lobby",
					{
						ordered: true
					}
				);

			this.setupDataChannel(
				guestPeerId,
				dataChannel
			);

			const offer =
				await peerConnection.createOffer();

			await peerConnection.setLocalDescription(
				offer
			);

			this.sendWebRtcSignal(
				guestPeerId,
				"offer",
				peerConnection.localDescription
			);
		},

		setupDataChannel(remotePeerId, dataChannel) {
			const oldChannel =
				this.dataChannels.get(remotePeerId);

			if (
				oldChannel &&
				oldChannel !== dataChannel
			) {
				try {
					oldChannel.close();
				} catch (error) {
					console.warn(error);
				}
			}

			this.dataChannels.set(
				remotePeerId,
				dataChannel
			);

			dataChannel.onopen = () => {
				/*
				 * Ak už bol potvrdený relay fallback,
				 * neskoro otvorený WebRTC kanál nepoužijeme.
				 */
				if (this.getPeerTransport(remotePeerId) === "socket-relay") {
					dataChannel.close();
					return;
				}

				console.log(
					"[NetworkManager] DataChannel opened:",
					remotePeerId
				);

				this.clearWebRtcConnectionTimeout(remotePeerId);
				this.relayRequestsPending.delete(remotePeerId);
				this.setPeerTransport(remotePeerId, "webrtc");

				this.sendDataMessage(remotePeerId, {
					type: "hello",
					peerId: this.peerId,
					playerName: this.playerName,
					role: this.role
				});

				if (this.isHost()) {
					this.sendInitialStateToPeer(remotePeerId);
				}
			};

			dataChannel.onmessage = (event) => {
				let message;

				try {
					message =
						JSON.parse(event.data);
				} catch (error) {
					console.warn(
						"[NetworkManager] Invalid data message:",
						event.data
					);

					return;
				}

				this.handleDataMessage(
					remotePeerId,
					message
				);
			};

			dataChannel.onclose = () => {
				console.warn(
					"[NetworkManager] DataChannel closed:",
					remotePeerId
				);

				this.emitConnectionStateChanged();
			};

			dataChannel.onerror = (error) => {
				this.reportError(error);
			};
		},

		async handleWebRtcSignal(payload) {
			const remotePeerId = payload.sourcePeerId;
			const signalType = payload.signalType;
			const signalData = payload.data;

			let peerConnection = this.peerConnections.get(remotePeerId);

			if (!peerConnection) {
				peerConnection = this.createPeerConnection(remotePeerId);
			}

			if (signalType === "offer") {
				await peerConnection.setRemoteDescription(new RTCSessionDescription(signalData));
				await this.flushPendingIceCandidates(remotePeerId, peerConnection);
				const answer = await peerConnection.createAnswer();
				await peerConnection.setLocalDescription(answer);

				this.sendWebRtcSignal(
					remotePeerId,
					"answer",
					peerConnection.localDescription
				);

				return;
			}

			if (signalType === "answer") {
				await peerConnection.setRemoteDescription(new RTCSessionDescription(signalData));
				await this.flushPendingIceCandidates(remotePeerId, peerConnection);

				return;
			}

			if (signalType === "ice-candidate" && signalData) {
				if (
					peerConnection.remoteDescription &&
					peerConnection.remoteDescription.type
				) {
					await peerConnection.addIceCandidate(new RTCIceCandidate(signalData));
				} else {
					this.queueIceCandidate(remotePeerId, signalData);
				}
			}
		},

		sendWebRtcSignal(
			targetPeerId,
			signalType,
			data
		) {
			if (
				!this.socket ||
				!this.socket.connected
			) {
				return false;
			}

			this.socket.emit(
				"webrtc:signal",
				{
					targetPeerId:
						targetPeerId,
					signalType:
						signalType,
					data:
						data
				}
			);

			return true;
		},

		sendDataMessage(peerId, message) {
			const transport = this.getPeerTransport(peerId);

			if (transport === "socket-relay") {
				return this.sendSocketRelayMessage(peerId, message);
			}

			const dataChannel = this.dataChannels.get(peerId);

			if (!dataChannel || dataChannel.readyState !== "open") {
				return false;
			}

			dataChannel.send(JSON.stringify(message));

			return true;
		},

		sendGameplayMessage(peerId, message) {
			const transport = this.getPeerTransport(peerId);

			if (transport === "socket-relay") {
				return this.sendSocketRelayMessage(peerId, message);
			}

			const channel = this.dataChannels.get(peerId);

			if (!channel || channel.readyState !== "open") {
				return false;
			}

			if (channel.bufferedAmount > 64 * 1024) {
				return false;
			}

			channel.send(JSON.stringify(message));

			return true;
		},

		handleDataMessage(remotePeerId, message) {
			if (
				!message ||
				typeof message.type !== "string"
			) {
				return;
			}

			if (message.type === "hello") {
				const previousPeer =
					this.peers.get(
						remotePeerId
					) || {};

				this.peers.set(
					remotePeerId,
					{
						...previousPeer,
						peerId: remotePeerId,
						playerName:
							message.playerName,
						role:
							message.role
					}
				);

				return;
			}

			if (
				message.type ===
				"online-player-state"
			) {
				/*
				 * Autoritatívny stav prijíma guest.
				 */
				if (this.isGuest()) {
					this.applyOnlinePlayerState(
						message.state
					);
				}

				return;
			}

			if (
				message.type ===
				"request-player-index"
			) {
				/*
				 * Žiadosti prijíma a vyhodnocuje host.
				 */
				if (this.isHost()) {
					this.handlePlayerIndexRequest(
						remotePeerId,
						message.requestedPlayerIndex
					);
				}

				return;
			}

			if (
				message.type ===
				"player-index-request-result"
			) {
				if (
					message.accepted !== true &&
					message.reason
				) {
					this.showGameMessage(
						message.reason
					);
				}
			}

			if (message.type === "set-ready") {
				if (!this.isHost()) {
					return;
				}

				const peer =
					this.peers.get(remotePeerId);

				if (!peer || peer.role !== "guest") {
					return;
				}

				peer.ready =
					message.ready === true;

				this.broadcastOnlinePlayerState();
				this.emitOnlinePlayersChanged();

				return;
			}

			if (message.type === "gameplay-state") {
				// Gameplay stav môže guest prijať iba od hosta.
				if (this.isGuest() && remotePeerId === this.hostPeerId) {
					this.applyGameplayStateMessage(message);
				}

				return;
			}

			if (message.type === "teams-configuration") {
				if (this.isGuest() && remotePeerId === this.hostPeerId) {
					this.applyTeamsConfigurationMessage(message);
				}

				return;
			}

			if (message.type === "player-control-input") {
				if (this.isHost()) {
					this.handleRemoteControlInput(remotePeerId, message);
				}

				return;
			}

			if (message.type === "players-control-input") {
				if (this.isGuest() && remotePeerId === this.hostPeerId) {
					this.applyPlayersControlInputMessage(message);
				}

				return;
			}

			if (message.type === "chat-message") {
				this.handleChatMessage( remotePeerId, message);

				return;
			}

		},

		startWebRtcConnectionTimeout(peerId) {
			this.clearWebRtcConnectionTimeout(peerId);

			const timeoutId = setTimeout(() => {
				if (this.getPeerTransport(peerId) !== "connecting") {
					return;
				}

				console.warn(
					"[NetworkManager] WebRTC timeout for peer:",
					peerId
				);

				this.requestSocketRelay(
					peerId,
					"WebRTC connection timeout"
				);
			}, this.webrtcConnectionTimeoutMs);

			this.peerConnectionTimeouts.set(peerId, timeoutId);
		},

		clearWebRtcConnectionTimeout(peerId) {
			const timeoutId = this.peerConnectionTimeouts.get(peerId);

			if (timeoutId !== undefined) {
				clearTimeout(timeoutId);
				this.peerConnectionTimeouts.delete(peerId);
			}
		},


		/* --------------------------------------------------------------- */
		/* Cleanup                                                         */
		/* --------------------------------------------------------------- */

		closePeerConnection(peerId) {
			const dataChannel =
				this.dataChannels.get(peerId);

			if (dataChannel) {
				try {
					dataChannel.close();
				} catch (error) {
					console.warn(error);
				}
			}

			const peerConnection =
				this.peerConnections.get(peerId);

			if (peerConnection) {
				try {
					peerConnection.close();
				} catch (error) {
					console.warn(error);
				}
			}

			this.dataChannels.delete(peerId);
			this.peerConnections.delete(peerId);
			this.clearWebRtcConnectionTimeout(peerId);
			this.pendingIceCandidates.delete(peerId);
		},

		closeAllPeerConnections() {
			const peerIds = new Set([
				...this.dataChannels.keys(),
				...this.peerConnections.keys()
			]);

			for (const peerId of peerIds) {
				this.closePeerConnection(peerId);
			}
		},

		clearOnlineSessionState() {
			this.mode = "offline";
			this.role = "none";

			this.roomName = null;
			this.roomIsPublic = false;

			this.hostPeerId = null;
			this.hostPlayerName = null;

			this.localPlayerIndex = null;

			this.onlinePlayers = [
				null,
				null,
				null,
				null
			];

			this.peers.clear();
			this.peerToPlayerIndex.clear();
			this.emitOnlinePlayersChanged();

			this.remoteControlInputs.clear();
			this.lastReceivedInputSequence.clear();
			this.localControlInputSequence = 0;
			this.playersControlSequence = 0;
			this.lastReceivedPlayersControlSequence = -1;
			this.lastControlInputSendTime = 0;
			this.lastPlayersControlSendTime = 0;

			this.localPlayerAuthoritativeState = null;
			this.localPlayerAuthoritativeStateReceivedAt = 0;
			this.lastLocalPlayerSmoothingTime = 0;

			this.remotePlayerStates.clear();
			this.remotePuckState = null;
			this.lastRemoteObjectsSmoothingTime = 0;
			this.pendingIceCandidates.clear();

			for (const timeoutId of this.peerConnectionTimeouts.values()) {
				clearTimeout(timeoutId);
			}

			this.peerConnectionTimeouts.clear();
			this.relayRequestsPending.clear();

			if (typeof OnlineChat !== "undefined") {
				OnlineChat.clear();
			}
		},

	};

					"onlineJoinGameButton"
				)

						this.executeJoinGame();
					}
				);

				.getElementById(
					"onlineJoinCancelButton"
				)
				.addEventListener(

						this.closeJoinDialog();
					}
				);

				)

				) {

					event.stopPropagation();
					this.executeJoinGame();
				}
			});			

			NetworkManager.onPublicRoomsChanged =
				() => {
					this.renderPublicRooms();
				};

				};

		isHostDialogOpen() {
			return (
				this.hostDialog !== null &&
				this.hostDialog.hidden === false
			);
		},

		isJoinDialogOpen() {
			return (
				this.joinDialog !== null &&
				this.joinDialog.hidden === false
			);
		},

		isAnyDialogOpen() {
			return (
				this.isHostDialogOpen() ||
				this.isJoinDialogOpen()
			);
		},

		isTextInputActive() {
			const element = document.activeElement;

			if (!element) {
				return false;
			}

			return (
				element.tagName === "INPUT" ||
				element.tagName === "TEXTAREA" ||
				element.tagName === "SELECT" ||
				element.isContentEditable === true
			);
		},

		shouldBlockGameInput() {
			return (
				this.isAnyDialogOpen() ||
				this.isTextInputActive() ||
				(
					typeof OnlineChat !== "undefined" &&
					OnlineChat.hasInputFocus()
				)
			);
		},

		getHostPlayerIndex() {
			const index = players.findIndex((player) => {
				return player.isMainUser === true;
			});

			if (NetworkManager.validatePlayerIndex(index)) {
				return index;
			}

			return 0;
		},

		showHostDialog() {

			this.setHostMessage("");

				document.getElementById(
					"onlineHostPlayerName"
				);

			const roomNameInput =
				document.getElementById(
					"onlineHostRoomName"
				);

			if (!playerNameInput.value.trim()) {

					this.loadSavedPlayerName() ||
					"Host";
			}

			if (!roomNameInput.value.trim()) {
				roomNameInput.value =
					this.generateRoomName();
			}

			setTimeout(() => {
				playerNameInput.focus();
				playerNameInput.select();
			}, 0);

			this.setHostBusy(false);

		async showJoinDialog() {
			this.closeHostDialog();
			this.setJoinMessage("");

			const playerNameInput =
				document.getElementById(
					"onlineJoinPlayerName"
				);

			if (!playerNameInput.value.trim()) {
				playerNameInput.value =
					this.loadSavedPlayerName() ||
					"Guest";
			}

			this.joinDialog.hidden = false;
			this.setJoinMessage("Loading public rooms, please wait...", true);

			setTimeout(() => {
				playerNameInput.focus();
				playerNameInput.select();
			}, 0);

			try {
				await loadSocketIoClient();

				this.setJoinMessage("");
				await this.refreshPublicRooms();
			} catch (error) {
				this.setJoinMessage(error.message || "The online service could not be loaded.");
			}

		closeJoinDialog() {
			this.joinDialog.hidden = true;
			this.setJoinBusy(false);
		},

		async executeHostGame() {
			const playerName =
				document
					.getElementById(
						"onlineHostPlayerName"
					)
					.value
					.trim();

			const roomName =
				document
					.getElementById(
						"onlineHostRoomName"
					)
					.value
					.trim();

			const isPublic =
				document
					.getElementById(
						"onlineHostPublic"
					)
					.checked;

			if (!playerName) {
				this.setHostMessage(
					"Enter a player name."
				);

				return;
			}

			if (!roomName) {
				this.setHostMessage(
					"Enter a room name."
				);

				return;
			}

			this.setHostBusy(true);

			try {
				this.setHostMessage("Loading online service, please wait...", true);
				await loadSocketIoClient();
				this.setHostMessage("Connecting to online service...", true);

				const hostPlayerIndex =
					this.getHostPlayerIndex();

				const response =
					await NetworkManager.hostGame(
						roomName,
						playerName,
						isPublic,
						hostPlayerIndex
					);

				if (!response || !response.ok) {
					this.setHostMessage( response && response.error ? response.error : "The room could not be created." );

					return;
				}

				this.savePlayerName(playerName);
				this.setHostMessage(
					"Online room created.",
					true
				);

				this.closeHostDialog();
				this.renderConnectionFrame();

				NetworkManager.showGameMessage(
					"Hosting online room: " +
					NetworkManager.roomName
				);
			} catch (error) {
				console.error(error);

				this.setHostMessage(
					error.message ||
					"The online service could not be reached."
				);
			} finally {
				this.setHostBusy(false);
			}
		},

		async executeJoinGame() {
			const playerName =
				document
					.getElementById(
						"onlineJoinPlayerName"
					)
					.value
					.trim();

			const roomName =
				document
					.getElementById(
						"onlineJoinRoomName"
					)
					.value
					.trim();

			if (!playerName) {
				this.setJoinMessage(
					"Enter a player name."
				);

				return;
			}

			if (!roomName) {
				this.setJoinMessage(
					"Select or enter a room name."
				);

				return;
			}

			this.setJoinBusy(true);

			try {
				this.setJoinMessage("Loading online service, please wait...", true);
				await loadSocketIoClient();
				this.setJoinMessage("Connecting to online room...", true);

				const response =
					await NetworkManager.joinGame(
						roomName,
						playerName
					);
				
				if (response?.retrying) {
					this.setJoinMessage("Waiting for the room host to reconnect...", true);
					return;
				}

				if (!response || !response.ok) {
					this.setJoinMessage( response && response.error ? response.error : "The room could not be joined.");

					return;
				}

				this.savePlayerName(playerName);
				this.closeJoinDialog();
				this.renderConnectionFrame();

				NetworkManager.showGameMessage(
					"Connected to room: " +
					NetworkManager.roomName
				);
			} catch (error) {
				console.error(error);

				this.setJoinMessage(
					error.message ||
					"The online service could not be reached."
				);
			} finally {
				this.setJoinBusy(false);
			}
		},

		applyOnlineStateToPlayers() {
			if (!NetworkManager.isOnline()) {
				return;
			}

			const localPlayerIndex = NetworkManager.localPlayerIndex;

			/*
			 * Guest ešte nemusel dostať pridelený index
			 * od hosta. Dovtedy players nemeníme.
			 */
			if (localPlayerIndex === null || !players[localPlayerIndex]) {
				return;
			}

			const previousMainUser = players.find(player => {
				return player.isMainUser === true;
			});

			/*
			 * Gamepad je nezávislý od trojice ovládačov
			 * keys, touch a vr, preto ho prenášame osobitne.
			 */
			const transferredGamepad = previousMainUser
				? previousMainUser.gamepad
				: undefined;

			/*
			 * Všetkým hráčom odoberieme lokálne controllery
			 * a zrušíme príznak hlavného používateľa.
			 */
			for (const player of players) {
				if (player.gamepad) {
					player.unbindGamepad();
				}

				player.controlKeys = undefined;
				player.isTouchControl = false;
				player.isVrControl = false;
				player.isMainUser = false;
			}

			/*
			 * Nastavíme isUser a viditeľnosť ringu podľa
			 * autoritatívneho zoznamu online hráčov.
			 */
			for (let playerIndex = 0; playerIndex < players.length; playerIndex++) {
				const player = players[playerIndex];
				const onlinePlayer = NetworkManager.getOnlinePlayer(playerIndex);
				const ring = player.meshGroup.getObjectByName("ring");

				if (onlinePlayer) {
					player.isUser = true;

					if (ring) {
						ring.visible = true;
					}
				} else {
					player.isUser = false;
					player.isMainUser = false;

					if (ring) {
						ring.visible = false;
					}
				}
			}

			const localPlayer = players[localPlayerIndex];

			/*
			 * Aplikujeme jeden z navzájom sa vylučujúcich
			 * controllerov: keys, touch alebo vr.
			 */
			assignControllerTypeToMainUser(
				localPlayer,
				mainUserControllerType
			);

			/*
			 * Nezávisle obnovíme gamepad, ak bol priradený.
			 */
			if (transferredGamepad) {
				localPlayer.bindGamepad(transferredGamepad);
			}

			/*
			 * Touch UI zobrazíme iba pri touch ovládaní.
			 */
			if (mainUserControllerType === "touch") {
				touchControlState.enabled = true;
				touchControlState.pendingPlayerIndex = null;
				setupTouchControlsForPlayer(localPlayer);
			} else {
				touchControlState.enabled = false;
				touchControlState.pendingPlayerIndex = null;
				setupTouchControlsForPlayer();
			}

			localPlayer.isUser = true;
			localPlayer.isMainUser = true;

			const localPlayerRing =
				localPlayer.meshGroup.getObjectByName("ring");

			if (localPlayerRing) {
				localPlayerRing.visible = true;
			}

			setPlayerCamera();
		},

	const OnlineChat = {
		frame: null,
		input: null,
		messagesElement: null,

		closeTimer: null,
		maxMessages: 30,

		autoShowIncoming: true,

		keyTHoldTimer: null,
		keyTLongPressTriggered: false,
		keyTHoldTimeMs: 2000,

		init() {
			this.frame = document.getElementById("onlineChatFrame");
			this.input = document.getElementById("onlineChatInput");
			this.messagesElement = document.getElementById("onlineChatMessages");

			if (!this.frame || !this.input || !this.messagesElement) {
				console.error("[OnlineChat] Chat HTML elements are missing.");
				return;
			}

			this.input.addEventListener("input", () => {
				this.scheduleClose(5000);
			});

			this.input.addEventListener("keydown", event => {
				/*
				 * Herné keydown eventy nesmú spracovať
				 * klávesy písané do chatu.
				 */
				event.stopPropagation();

				if (
					event.code === "Enter" ||
					event.code === "NumpadEnter"
				) {
					event.preventDefault();
					this.sendCurrentMessage();
					return;
				}

				if (event.code === "Escape") {
					event.preventDefault();
					this.close();
				}
			});

			this.input.addEventListener("keyup", event => {
				event.stopPropagation();
			});
		},

		isOpen() {
			return this.frame && this.frame.hidden === false;
		},

		hasInputFocus() {
			return (
				this.input &&
				document.activeElement === this.input
			);
		},

		open(focusInput = true, visibleTimeMs = 5000) {
			if (!NetworkManager.isOnline()) {
				return;
			}

			this.frame.hidden = false;

			if (focusInput) {
				setTimeout(() => {
					this.input.focus();
				}, 0);
			}

			this.scheduleClose(visibleTimeMs);
		},

		close() {
			if (!this.frame) {
				return;
			}

			this.frame.hidden = true;
			this.input.value = "";
			this.input.blur();

			if (this.closeTimer !== null) {
				clearTimeout(this.closeTimer);
				this.closeTimer = null;
			}
		},

		scheduleClose(delayMs) {
			if (this.closeTimer !== null) {
				clearTimeout(this.closeTimer);
			}

			this.closeTimer = setTimeout(() => {
				this.close();
			}, delayMs);
		},

		sendCurrentMessage() {
			const text = this.input.value.trim();

			if (!text) {
				this.scheduleClose(5000);
				return;
			}

			const sent = NetworkManager.sendChatMessage(text);

			if (sent) {
				this.input.value = "";
				this.scheduleClose(5000);
			}
		},

		addMessage(peerId, playerName, text, isLocalMessage = false) {
			if (!this.messagesElement) {
				return;
			}

			const messageElement = document.createElement("div");
			messageElement.className = "online-chat-message";

			const matchTime = Math.max(0, GState.matchTimer || 0);
			const minutes = Math.floor(matchTime / 60);
			const seconds = Math.floor(matchTime % 60);

			const timeElement = document.createElement("span");
			timeElement.className = "online-chat-time";
			timeElement.textContent =
				String(minutes).padStart(2, "0") +
				":" +
				String(seconds).padStart(2, "0") +
				" ";

			const nameElement = document.createElement("span");
			nameElement.className = "online-chat-player-name";
			nameElement.textContent = playerName + ": ";

			const playerColor = this.getPeerColor(peerId);

			if (playerColor) {
				nameElement.style.color = playerColor;
			}

			const textElement = document.createElement("span");
			textElement.textContent = text;

			messageElement.appendChild(timeElement);
			messageElement.appendChild(nameElement);
			messageElement.appendChild(textElement);

			this.messagesElement.appendChild(messageElement);

			while (
				this.messagesElement.children.length >
				this.maxMessages
			) {
				this.messagesElement.removeChild(
					this.messagesElement.firstElementChild
				);
			}

			this.messagesElement.scrollTop =
				this.messagesElement.scrollHeight;

			/*
			 * Vlastná odoslaná správa ponechá chat otvorený
			 * 5 sekúnd. Prijatá správa ho zobrazí 10 sekúnd.
			 */
			if (isLocalMessage) {
				this.open(true, 5000);
			} else if (this.autoShowIncoming) {
				this.open(false, 10000);
			}
		},

		getPeerColor(peerId) {
			const playerIndex =
				NetworkManager.findPeerPlayerIndex(peerId);

			if (
				playerIndex === null ||
				!players[playerIndex]
			) {
				return "#ffffff";
			}

			const ringColor =
				players[playerIndex].ringColor;

			if (typeof ringColor === "number") {
				return (
					"#" +
					ringColor
						.toString(16)
						.padStart(6, "0")
				);
			}

			if (
				ringColor &&
				typeof ringColor.getHexString === "function"
			) {
				return "#" + ringColor.getHexString();
			}

			return "#ffffff";
		},

		toggleAutoShowIncoming() {
			this.autoShowIncoming = !this.autoShowIncoming;

			const message = this.autoShowIncoming
				? "Automatic chat display enabled."
				: "Automatic chat display disabled.";

			NetworkManager.showGameMessage(message);

			/*
			 * Pri vypnutí automatického zobrazovania
			 * zavrieme chat, ak práve nie je aktívny textový vstup.
			 */
			if (!this.autoShowIncoming && !this.hasInputFocus()) {
				this.close();
			}
		},

		clear() {
			if (this.messagesElement) {
				this.messagesElement.innerHTML = "";
			}

			this.close();
		},

	};

    let lastUpdateTime = Date.now();
	let lastUpdateFps = Date.now();
	let framesCount = 0;
	let gameHistory = new HistoryTracker();

	const FIXED_STEP_MS = 1000 / FPS_TARGET;
	let simulationAccumulator = 0;
	let previousFrameTime = performance.now();
	
	let renderFps = 0;
	let renderFramesCount = 0;
	let lastRenderFpsUpdate = performance.now();


	//////////////////////////////////////
    // Animation Loop					//
	//////////////////////////////////////
	
	function animate(time) {
		if (previousFrameTime === null) {
			previousFrameTime = time;
		}

		renderFramesCount++;
		
		if (time - lastRenderFpsUpdate >= 1000) {
			renderFps = renderFramesCount;
			renderFramesCount = 0;
			lastRenderFpsUpdate = time;
		}		

		const frameDelta = Math.min(time - previousFrameTime, 100);
		previousFrameTime = time;
		simulationAccumulator += frameDelta;

		while (simulationAccumulator >= FIXED_STEP_MS) {
			updateGameSimulation();
			simulationAccumulator -= FIXED_STEP_MS;
		}

		if (vrControlState.sessionActive) {
			updateVrHud();
			handleVrSessionButtons();

			// Poziadavka na aplikacny recenter VR pohladu
			if (vrControlState.recenterPending) {
				if (vrControlState.recenterDelayFrames > 0) {
					vrControlState.recenterDelayFrames--;
				} else if (recenterVrView()) {
					vrControlState.recenterPending = false;
				}
			}
		}

		renderer.render(scene, camera);
	}

	// spustenie hlavnej animacnej slucky programu
	renderer.setAnimationLoop(animate);


	//////////////////////////////////////
    // Gameplay Loop					//
	//////////////////////////////////////

	function updateGameSimulation() {
		NetworkManager.updateGameplayStateBroadcast();

		let now = Date.now();
		if (now > msgExpireTime) msgText = "";
		
		if (!GState.gamePaused) {
			lastUpdateTime = now;
			framesCount++;
			if (now - lastUpdateFps > 1000) {
				fps = framesCount;
				lastUpdateFps = now;
				framesCount = 0;
			}
			// Gameplay state
			if (GState.gameState === "playing" || GState.gameState === "overtime" || GState.gameState === "tied") {
			if (!NetworkManager.isGuest()) {
				let dt = (now - lastTimerUpdate) / 1000;
				lastTimerUpdate = now;
				if (!GState.goalScored && GState.gameState === "overtime") {
					GState.matchTimer += dt;
				}
				if (!GState.goalScored && GState.gameState === "playing") {
					GState.matchTimer -= dt;
					if (GState.matchTimer <= 0) {
						GState.matchTimer = 0;
						if(teamA.score != teamB.score) {
							GState.gameState = "gameover";
						} else
						{
							GState.gameState = "tied";
							GState.goalScored = true;
							GState.goalTimer = breakTimerMax;
						}
					}
				}
			}

			gameHistory.recordFrame(players);

			// handle player control inputs
			players.forEach((p, playerIndex) => {
				if (NetworkManager.isGuest() && playerIndex !== NetworkManager.localPlayerIndex) {
					return;
				}
				p.updateControls();
			});

			NetworkManager.updateControlInputNetwork();
			players.forEach(p => p.applyControls());
			players.forEach(p => p.update());

			NetworkManager.updateLocalPlayerReconciliation(); // position smoothing for guest player
			if (NetworkManager.isGuest() && NetworkManager.localPlayerIndex !== null) {
				players[NetworkManager.localPlayerIndex].updateMesh();
			}

			checkPlayerCollisions();

			const order = getPlayerCollisionOrder(players);
			for (const idx of order) {
				checkPuckPlayerCollision(players[idx]);
				checkPuckStickCollision(players[idx]);
			}
			handleGoalPostCollisions();
			puckObj.update();
			NetworkManager.updateRemoteObjectsSmoothing(); // position smoothing for remote players and puck

			if (!NetworkManager.isGuest()) {
				checkGoalScore();
				if (GState.goalScored) {
					GState.goalTimer--;
					if (GState.goalTimer <= 0) {
						resetPositions();
						if (GState.gameState === "overtime") { GState.gameState = "gameover"; }
						else if(GState.gameState === "tied") { GState.gameState = "overtime"; GState.goalScored = false; }
					}
				}
			}
			updateGoalScorePresentation();
			  if (!spectatorsFrozen) spectators.forEach(s => {if(s.dynamic && !s.frozen) s.update() });  // Update spectators
			}

			if (GState.gameState === "title") {
				if (!NetworkManager.isGuest()) {
					setGameMode();
				}
			}

			// Update 3D objects.
			puckMesh.position.set(puckObj.x, puckHeight3D/2, puckObj.y);

			setCamera(camSetting.type, false);

			if (DEBUG_ENABLED) {
				debugCircle.position.set(debugCircleX, markingYOffset, debugCircleY); // debug object
				debugPuck.position.set(debugPuckX, markingYOffset, debugPuckY); // debug object
				debugTarget.position.set(debugTargetX, markingYOffset, debugTargetY); // debug object
			}

			if(DEBUG_INFO) DebugVariable = ' FPS:' + Math.round(fps) + ', Geometries:' + renderer.info.memory.geometries + ', Triangles:' + renderer.info.render.triangles + ', Calls:' + renderer.info.render.calls;
			
		}

		manageGamepads();

		if (!vrControlState.sessionActive) {
			updateOverlay();
		}

		updateOnGameStateChange();
		prevGameState = GState.gameState;
	}

	function switchCamera() {
		camSetting.type = (camSetting.type == 3) ? 0 : camSetting.type + 1;
		camSetting.userType = camSetting.type;
 
		msgText = "Camera: " + camSetting.name[camSetting.type];
		msgExpireTime = Date.now() + MSG_TIME;;
	}


	function setCamera(type, resetAngle = true) {

		camSetting.type = type;
		
		// Pre gamepad nastavime orientaciu ovladania voci kamere
		if (type === 0 ||type === 1) {
			camSetting.controlsRotation = 0;
		}
		else if (type === 2) {
			camSetting.controlsRotation = 1;
		}	
		else if (type === 3) {
			camSetting.controlsRotation = 3;
		}	
		
		// Vo VR mode nenatavujeme kameru vobec
		if (vrControlState.sessionActive) {
			return;
		}
	
		if (type == 0){  //side view whole rink
			camSetting.type = 0;
			if (resetAngle) camSetting.AngleX = Math.PI/6;
			
			camera.position.set(center3D.x, camSetting.type0Distance *Math.sin(camSetting.AngleX), center3D.z + camSetting.type0Distance * Math.cos(camSetting.AngleX));
			camera.lookAt(center3D);
			camSetting.lookAt.x = center3D.x;
			camSetting.lookAt.y = center3D.y;
			camSetting.lookAt.z = center3D.z;
			camSetting.distance = camSetting.type0Distance;
		}

		if (type == 1){  // side view panning
			if (resetAngle) camSetting.AngleX = Math.PI/6;
			camSetting.type = 1;
			camSetting.panSpeed = 4; // You already have this
			camSetting.zoomSpeed = 2; // You already have this
			camSetting.minDistance = 350; // Minimum camera distance - adjust as needed
			camSetting.maxDistance = 1000; // Maximum camera distance - adjust as needed
			camSetting.lookAtMinX = fieldOffsetX + 200 ;
			camSetting.lookAtMaxX = fieldOffsetX + fieldWidth - 200;
			camSetting.lookAtMinZ = 100;
			camSetting.lookAtMaxZ = fieldHeight - 0;
			camSetting.lookAtDeltaPanLimit = 200;
			camSetting.camPosMinZ = 50;
			camSetting.camPosMaxZ = fieldHeight + 50;

			let estTime = 0.2 * FPS_TARGET;
			let boundFactor = 2;
			let minX = Math.min(puckObj.x, puckObj.x + puckObj.vx * estTime); let maxX = Math.max(puckObj.x, puckObj.x + puckObj.vx * estTime);
			let minY = Math.min(puckObj.y, puckObj.y + puckObj.vy * estTime); let maxY = Math.max(puckObj.y, puckObj.y + puckObj.vy * estTime);

			players.forEach((p, playerIndex) => {
				const isRemoteOnlinePlayer = NetworkManager.isOnline() && NetworkManager.isRemoteOnlinePlayer(playerIndex);

				if (!p.isUser || isRemoteOnlinePlayer) {
					return;
				}

				if (p.isUser) minX = (p.x - p.radius * boundFactor < minX) ? p.x - p.radius * boundFactor : minX;
				if (p.isUser) maxX = (p.x + p.radius * boundFactor > maxX) ? p.x + p.radius * boundFactor : maxX;
				if (p.isUser) minY = (p.y - p.radius * boundFactor < minY) ? p.y - p.radius * boundFactor : minY;
				if (p.isUser) maxY = (p.y + p.radius * boundFactor > maxY) ? p.y + p.radius * boundFactor : maxY;
			});

			// Calculate Bounding Box for Puck and User Players
			let boxWidth = maxX - minX;
			let boxHeight = maxY - minY;
			let boxX = minX + boxWidth / 2;
			let boxY = minY + boxHeight / 2;

			let cameraLookAtX = clamp(boxX, camSetting.lookAtMinX, camSetting.lookAtMaxX);
			let cameraLookAtZ = clamp(boxY, camSetting.lookAtMinZ, camSetting.lookAtMaxZ);

			let dLookAt = Math.hypot(cameraLookAtX - camSetting.lookAt.x, cameraLookAtZ - camSetting.lookAt.z);
			let panRatio = (dLookAt < camSetting.lookAtDeltaPanLimit) ? dLookAt / camSetting.lookAtDeltaPanLimit : 1;
			camSetting.panSpeed = camSetting.panSpeed * panRatio;

			cameraLookAtX = (dLookAt < camSetting.panSpeed) ? cameraLookAtX : camSetting.lookAt.x + (cameraLookAtX - camSetting.lookAt.x) / dLookAt * camSetting.panSpeed;
			cameraLookAtZ = (dLookAt < camSetting.panSpeed) ? cameraLookAtZ : camSetting.lookAt.z + (cameraLookAtZ - camSetting.lookAt.z) / dLookAt * camSetting.panSpeed;

			// Calculate required camera distance from target
			let camTarget = new THREE.Vector3(cameraLookAtX , 0, cameraLookAtZ);
			const frustumWidthAtDistance1 = 2 * Math.tan(camera.fov / 2 * Math.PI / 180);
			let requiredDistance = (Math.hypot(boxWidth, boxHeight) / frustumWidthAtDistance1 ) * 1.2;
			requiredDistance = clamp(requiredDistance, camSetting.minDistance, camSetting.maxDistance); // Clamp distance
			requiredDistance = (Math.abs(requiredDistance - camSetting.distance) < camSetting.zoomSpeed) ? requiredDistance : camSetting.distance + Math.sign(requiredDistance - camSetting.distance) * camSetting.zoomSpeed;

			camera.position.y = camTarget.y + requiredDistance * Math.sin(camSetting.AngleX); // Use dynamicCameraDistance for Y
			camera.position.z = clamp(camTarget.z + requiredDistance * Math.cos(camSetting.AngleX), camSetting.camPosMinZ, camSetting.camPosMaxZ); // Use dynamicCameraDistance for Z
			camera.position.x = camTarget.x;
			camSetting.lookAt.x = camTarget.x;
			camSetting.lookAt.y = camTarget.y;
			camSetting.lookAt.z = camTarget.z;
			camSetting.distance = requiredDistance;
			camera.lookAt(camTarget);
		}

		if (type == 2 ||  type == 3){  //rear view panning
			if (resetAngle) camSetting.AngleX = Math.PI/4;
			if (type == 2) {
				camSetting.type = 2;
				camSetting.panSpeed = 5; //
				camSetting.zoomSpeed = 3; //
				camSetting.minDistance = 250; // Minimum camera distance - adjust as needed
				camSetting.maxDistance = 300; // Maximum camera distance - adjust as needed
				camSetting.lookAtMinX = fieldOffsetX + 100 ;
				camSetting.lookAtMaxX = fieldOffsetX + fieldWidth - 200;
				camSetting.lookAtMinZ = 100;
				camSetting.lookAtMaxZ = fieldHeight - 100;
				camSetting.lookAtDeltaPanLimit = 100;
				camSetting.camPosMinX = -100;
				camSetting.camPosMaxX = fieldOffsetX + fieldWidth - 300;

			}
			if (type == 3) {
				camSetting.type = 3;
				camSetting.panSpeed = 5; //
				camSetting.zoomSpeed = 3; //
				camSetting.minDistance = 250; // Minimum camera distance - adjust as needed
				camSetting.maxDistance = 300; // Maximum camera distance - adjust as needed
				camSetting.lookAtMinX = fieldOffsetX + 200 ;
				camSetting.lookAtMaxX = fieldOffsetX + fieldWidth - 100;
				camSetting.lookAtMinZ = 100;
				camSetting.lookAtMaxZ = fieldHeight - 100;
				camSetting.lookAtDeltaPanLimit = 100;
				camSetting.camPosMinX = 300;
				camSetting.camPosMaxX = fieldOffsetX + fieldWidth + 100;
			}

			let estTime = 0 * FPS_TARGET;
			let boundFactor = 1;
			let minX = Math.min(puckObj.x, puckObj.x + puckObj.vx * estTime); let maxX = Math.max(puckObj.x, puckObj.x + puckObj.vx * estTime);
			let minY = Math.min(puckObj.y, puckObj.y + puckObj.vy * estTime); let maxY = Math.max(puckObj.y, puckObj.y + puckObj.vy * estTime);

			players.forEach((p, playerIndex) => {
				const isRemoteOnlinePlayer = NetworkManager.isOnline() && NetworkManager.isRemoteOnlinePlayer(playerIndex);

				if (!p.isUser || isRemoteOnlinePlayer) {
					return;
				}
				if (p.isUser) minX = (p.x - p.radius * boundFactor < minX) ? p.x - p.radius * boundFactor : minX;
				if (p.isUser) maxX = (p.x + p.radius * boundFactor > maxX) ? p.x + p.radius * boundFactor : maxX;
				if (p.isUser) minY = (p.y - p.radius * boundFactor < minY) ? p.y - p.radius * boundFactor : minY;
				if (p.isUser) maxY = (p.y + p.radius * boundFactor > maxY) ? p.y + p.radius * boundFactor : maxY;
			});

			// Calculate Bounding Box for Puck and User Players
			let boxWidth = maxX - minX;
			let boxHeight = maxY - minY;
			let boxX = minX + boxWidth / 2;
			let boxY = minY + boxHeight / 2;

			let fieldCenterX = fieldOffsetX + fieldWidth / 2;
			let lookAtShiftLimitX = fieldWidth / 8;   // x distance from field center for look at-target shifting zone
			let lookAtShiftX = 100; // look at target X-shift distance

			let targetX = (type == 2) ? minX : maxX;  // for rear cam get minX of bound box as target, for front cam get maxX
			let signFrontRearCam = (type == 2) ? -1 : 1;
			let cameraLookAtX  = (targetX > fieldCenterX - lookAtShiftLimitX && targetX < fieldCenterX + lookAtShiftLimitX) ? targetX + (targetX - fieldCenterX) / lookAtShiftLimitX * lookAtShiftX : targetX + Math.sign(targetX - fieldCenterX) * lookAtShiftX; // target object nearest to camera with additional offset

			let cameraLookAtZ = boxY;
			cameraLookAtX = clamp(cameraLookAtX, camSetting.lookAtMinX, camSetting.lookAtMaxX);
			cameraLookAtZ = clamp(cameraLookAtZ, camSetting.lookAtMinZ, camSetting.lookAtMaxZ);

			let dLookAt = Math.hypot(cameraLookAtX - camSetting.lookAt.x, cameraLookAtZ - camSetting.lookAt.z);
			let panRatio = (dLookAt < camSetting.lookAtDeltaPanLimit) ? dLookAt / camSetting.lookAtDeltaPanLimit : 1;

			let actualPanSpeed = camSetting.panSpeed * panRatio;
			if (dLookAt > 0 && dLookAt > actualPanSpeed) {
				cameraLookAtX = camSetting.lookAt.x + (cameraLookAtX - camSetting.lookAt.x) / dLookAt * actualPanSpeed;
				cameraLookAtZ = camSetting.lookAt.z + (cameraLookAtZ - camSetting.lookAt.z) / dLookAt * actualPanSpeed;
			}

			// Calculate required camera distance from target
			let camTarget = new THREE.Vector3(cameraLookAtX , 0, cameraLookAtZ);
			const frustumWidthAtDistance1 = 2 * Math.tan(camera.fov / 2 * Math.PI / 180);

			let requiredDistance =  Math.hypot(camTarget.x - camera.position.x, camTarget.y - camera.position.y);
			requiredDistance = clamp(requiredDistance, camSetting.minDistance, camSetting.maxDistance); // Clamp distance
			requiredDistance = (Math.abs(requiredDistance - camSetting.distance) < camSetting.zoomSpeed) ? requiredDistance : camSetting.distance + Math.sign(requiredDistance - camSetting.distance) * camSetting.zoomSpeed;

			camera.position.y = camTarget.y + requiredDistance * Math.sin(camSetting.AngleX); // Use dynamicCameraDistance for Y
			camera.position.x = clamp(camTarget.x + signFrontRearCam * requiredDistance * Math.cos(camSetting.AngleX), camSetting.camPosMinX, camSetting.camPosMaxX); // Use dynamicCameraDistance for Z
			camera.position.z = camTarget.z;
			camSetting.lookAt.x = camTarget.x;
			camSetting.lookAt.y = camTarget.y;
			camSetting.lookAt.z = camTarget.z;
			camSetting.distance = requiredDistance;
			camera.lookAt(camTarget);

			//if (DEBUG_ENABLED) DebugVariable = ' FPS:' + Math.round(fps) + ' strategyA:' + teamA.strategy + ' strategyB:' + teamB.strategy + ' minY:' + Math.round(minY) + ' maxY:' + Math.round(maxY) + ' boxHeight:' + Math.round(boxHeight) + ' frustumWidth:' + Math.round(frustumWidthAtDistance1 * 1000) / 1000 +  ' requiredDistance:' + Math.round(requiredDistance) + ' postiion:' + Math.round(camera.position.x) + ',' + Math.round(camera.position.y) + ',' + Math.round(camera.position.z) + ',' + ' lookAt: ' + Math.round(camSetting.lookAt.x) + ',' + Math.round(camSetting.lookAt.y) + ','+ Math.round(camSetting.lookAt.z) + ',';
		}
	}

	// Calculates the world coordinates of a player's stick blade center

	function getStickCenter(player, customX = null, customY = null, customAngle = null) {
		// Allow calculating for current frame OR history frame
		const px = (customX !== null) ? customX : player.x;
		const py = (customY !== null) ? customY : player.y;
		const ang = (customAngle !== null) ? customAngle : player.angle;

		const ox = player.stickOffset.x;
		const oy = player.stickOffset.y;
		const mag = Math.hypot(ox, oy) || 1;

		// Halfway along stick blade
		const halfLen = player.stickLength / 2;
		const dirX = ox / mag;
		const dirY = oy / mag;

		const localCenterX = ox + dirX * halfLen;
		const localCenterY = oy + dirY * halfLen;

		// Rotate
		const s = Math.sin(ang);
		const c = Math.cos(ang);

		return {
			x: px + (localCenterX * c - localCenterY * s),
			y: py + (localCenterX * s + localCenterY * c)
		};
	}


	///////////////////////////////////////////////////////////
	//////////  	AI Functionality				///////////
	///////////////////////////////////////////////////////////

	/**
	 * Extracts 48 normalized inputs for the Neural Network.
	 */
	function getAINetworkInputs(player) {
		const inputs = player.aiInputBuffer;

		// Orientation
		const dirX = (player.team === teamA) ? 1.0 : -1.0;
		const dirY = (player.team === teamA) ? 1.0 : -1.0;

		// Constants
		const MAX_V = 15.0;
		const MAX_ROT = MAX_SHOOT_ROT_SPEED;
		const MAX_DIST_X = fieldWidth;
		const MAX_DIST_Y = fieldHeight; // Used for Y normalization consistency?
		// Actually, for radial scaling, we should use ONE Max Distance for both axes to preserve aspect ratio.
		// Let's use the field Diagonal or Width as the universal scalar.
		const MAX_SCALAR = fieldWidth;

		const CENTER_X = fieldOffsetX + fieldWidth / 2;
		const CENTER_Y = fieldOffsetY + fieldHeight / 2;
		const stick = getStickCenter(player);

		// --- HELPER: Non-Linear Vector Scaler ---
		function getScaledVector(targetX, targetY, originX, originY) {
			let rawDx = targetX - originX;
			let rawDy = targetY - originY;
			let dist = Math.hypot(rawDx, rawDy);

			let normX = 0, normY = 0;
			if (dist > 0) {
				normX = rawDx / dist;
				normY = rawDy / dist;
			}

			// Square Root Scaling (The "Sensitivity Curve")
			let magInput = Math.pow(Math.min(dist, MAX_SCALAR) / MAX_SCALAR, 0.5);

			return [
				normX * magInput,
				normY * magInput
			];
		}

		// --- SELF (0-7) ---
		inputs[0] = (player.vx / MAX_V) * dirX;
		inputs[1] = (player.vy / MAX_V) * dirY;
		inputs[2] = player.rotSpeed / MAX_ROT; // Rot is relative, no flip needed usually, unless output flips
		inputs[3] = Math.sin(player.angle) * dirY;
		inputs[4] = Math.cos(player.angle) * dirX;
		inputs[5] = player.stamina / STAMINA_MAX;

		// Keep Board Position LINEAR (It's a map coordinate, not a distance sensor)
		inputs[6] = ((player.x - CENTER_X) / (fieldWidth / 2)) * dirX;
		inputs[7] = ((player.y - CENTER_Y) / (fieldHeight / 2)) * dirY;

		// --- GAME CONTEXT (8-9) ---
		let delta = player.team.score - player.team.opponent.score;
		inputs[8] = Math.max(-5, Math.min(5, delta)) / 5.0;
		inputs[9] = Math.max(0, GState.matchTimer / MATCH_DURATION);

		// --- PUCK (10-13) ---
		// Use Helper (Stick Centric)
		const puckVec = getScaledVector(puckObj.x, puckObj.y, stick.x, stick.y);
		inputs[10] = puckVec[0] * dirX;
		inputs[11] = puckVec[1] * dirY;

		inputs[12] = ((puckObj.vx - player.vx) / MAX_V) * dirX;
		inputs[13] = ((puckObj.vy - player.vy) / MAX_V) * dirY;

		// --- GOALS (14-17) ---
		const enemyGoalX = (dirX === 1) ? (fieldOffsetX + fieldWidth) : fieldOffsetX;
		const ownGoalX = (dirX === 1) ? fieldOffsetX : (fieldOffsetX + fieldWidth);

		// Use Helper (Body Centric for Goals usually fine, or Stick if you want aim)
		// Let's use Body for navigation goals
		const targetGoalVec = getScaledVector(enemyGoalX, goalCenterY, player.x, player.y);
		inputs[14] = targetGoalVec[0] * dirX;
		inputs[15] = targetGoalVec[1] * dirY;

		const ownGoalVec = getScaledVector(ownGoalX, goalCenterY, player.x, player.y);
		inputs[16] = ownGoalVec[0] * dirX;
		inputs[17] = ownGoalVec[1] * dirY;

		// --- ENTITY SORTING (Same as before) ---
		let teammate = null;
		let opponents = [];
		for (let i = 0; i < players.length; i++) {
			let p = players[i];
			if (p === player) continue;
			let entityObj = { p: p, globalIndex: i };
			if (p.team === player.team) teammate = entityObj;
			else opponents.push(entityObj);
		}
		opponents.sort((a, b) => {
			const d1 = Math.hypot(a.p.x - player.x, a.p.y - player.y);
			const d2 = Math.hypot(b.p.x - player.x, b.p.y - player.y);
			return d1 - d2;
		});

		// --- HISTORY HELPER ---
		const fillEntityData = (startIndex, entity) => {
			if (!entity) return;

			// 1. Position History (SCALED)
			const posTimes = [0, 15, 30];
			for(let k=0; k<3; k++) {
				let snap = gameHistory.getFrame(posTimes[k]);
				let data = snap[entity.globalIndex];

				// Use Helper!
				const vec = getScaledVector(data.x, data.y, player.x, player.y);

				let idx = startIndex + (k * 2);
				inputs[idx]     = vec[0] * dirX;
				inputs[idx + 1] = vec[1] * dirY;
			}

			// 2. Angle History (No scaling needed, already -1 to 1)
			const angleTimes = [0, 5];
			for(let k=0; k<2; k++) {
				let snap = gameHistory.getFrame(angleTimes[k]);
				let data = snap[entity.globalIndex];

				let idx = startIndex + 6 + (k * 2);
				inputs[idx]     = Math.sin(data.angle) * dirY;
				inputs[idx + 1] = Math.cos(data.angle) * dirX;
			}
		};

		// --- FILL DATA (18-47) ---
		fillEntityData(18, teammate);
		fillEntityData(28, opponents[0]);
		fillEntityData(38, opponents[1]);

		// --- Physical Controls from last frame ---
		inputs[48] = player.prevNeuralOutput[0]; // Move X
		inputs[49] = player.prevNeuralOutput[1]; // Move Y
		inputs[50] = player.prevNeuralOutput[2]; // rotSin
		inputs[51] = player.prevNeuralOutput[3]; // rotCos
		inputs[52] = player.prevNeuralOutput[4]; // Boost
		inputs[53] = player.prevNeuralOutput[5]; // Lift

		// --- "Scratchpad / Memory" nodes from last frame ---
		inputs[54] = player.prevNeuralOutput[6]; // Memory 1
		inputs[55] = player.prevNeuralOutput[7]; // Memory 2
		inputs[56] = player.prevNeuralOutput[8]; // Memory 3
		inputs[57] = player.prevNeuralOutput[9]; // Memory 4
		inputs[58] = player.prevNeuralOutput[10]; // Memory 5
		inputs[59] = player.prevNeuralOutput[11]; // Memory 6
		inputs[60] = player.prevNeuralOutput[12]; // Memory 7
		inputs[61] = player.prevNeuralOutput[13]; // Memory 8

		return inputs;
	}


	//  Apply AI brain outputs to player controls
	function applyAINetworkOutput(player, output) {

		// SAVE RAW OUTPUT FOR NEXT FRAME
		player.prevNeuralOutput.set(output);

		const dirX = (player.team === teamA) ? 1.0 : -1.0;
		const dirY = (player.team === teamA) ? 1.0 : -1.0;

		// Apply the Deadzone
		const DEADZONE = 0.4;

		player.controlInput.movex = applyDeadzone(output[0], DEADZONE) * dirX;
		player.controlInput.movey = applyDeadzone(output[1], DEADZONE) * dirY;

		// --- SEAMLESS CIRCULAR ROTATION ---

		// 1. Get the 2D vector from the AI (outputs at index 2 and 3)
		const outSin = output[2];
		const outCos = output[3];

		// 2. Use atan2 to get a seamless angle from -PI to PI
		const aiOffset = Math.atan2(outSin, outCos);

		// 3. Apply your puck-relative logic
		const angleToPuck = Math.atan2(puckObj.y - player.y, puckObj.x - player.x);
		const referenceAngle = normalizeAngle(angleToPuck - Math.PI / 2);
		const targetAngle = normalizeAngle(referenceAngle + aiOffset);

		// 4. PD control to turn
		const angleError = normalizeAngle(targetAngle - player.angle);
		const KP = 2.5;
		player.controlInput.rotate = Math.max(-1, Math.min(1, angleError * KP));

		// Adjust indices for the remaining buttons
		player.controlInput.boost = (output[4] > 0.0) ? 1 : 0;
		player.controlInput.lift = (output[5] > 0.5) ? 1 : 0;
	}


    window.addEventListener('resize', function(){
		camera.aspect = window.innerWidth/window.innerHeight;
		camera.updateProjectionMatrix();
		renderer.setSize(window.innerWidth, window.innerHeight);
    });

	window.addEventListener("DOMContentLoaded", () => {
		OnlineLobbyDialogs.init();
		OnlineChat.init();
		OnlineInviteDialog.init();
		handleInviteUrl();

		const startVrButton = document.getElementById("touchStartVrButton");

		if (startVrButton) {
			startVrButton.addEventListener(
				"pointerup",
				async event => {
					event.preventDefault();
					event.stopPropagation();

					const started = await startVrSession();

					if (!started) {
						return;
					}

					setPlayerCamera();
					applyVrGraphicsDefaults();
					enterVrCameraMode();
					positionVrCameraRig();
					
					createVrHud();					
					positionVrHudAboveOppositeStand();
					
					handleGameState("go");
				}
			);
		}
	});
